# MANTIDO POR HUMANOS — este arquivo NÃO é sobrescrito por `npm run extract`.
#
# Colunas que a página **usa** e que mesmo assim ficam fora da carga, por decisão.
#
# Não confundir com a projeção automática de `packages/snapshot/src/colunas-usadas.ts`:
# aquela descarta o que ninguém toca, é derivada e não precisa de decisão nenhuma. Esta
# aqui é o contrário — a coluna É usada, e alguém decidiu que o custo de tê-la em
# memória a cada abertura de página não se paga.
#
# **Consequência, dita em voz alta:** todo visual que amarra uma destas colunas deixa de
# ser calculado na abertura da página. Ele aparece como "sob demanda", e não como erro.
# Qualquer OUTRO uso da coluna — uma medida, uma coluna calculada — erra alto, porque aí
# é engano, não decisão.
#
# Ver docs/DECISAO-DESEMPENHO.md.

# Vazio, e isso é uma decisão medida — não um esquecimento.
#
# `'FIELD AGENDA'[Relato]` morou aqui de 10/08/2026 a 24/08/2026. Ele saiu porque a
# medição que o pôs aqui deixou de valer: ela foi feita sobre um `field-agenda.jsonl`
# de 1.458.244 linhas e 950 MB, e o snapshot de hoje tem **103.913 linhas e 120 MB**.
#
# Medido em 24/08/2026, processo frio, `agendamento-field`:
#
# | Caminho | Custo |
# |---|---|
# | Página sem `Relato`, e depois a tabela sob demanda | 5,9 s + **12,0 s** = 17,9 s |
# | Página com `Relato` dentro, tudo de uma vez | **6,9 s** |
#
# Os 12,0 s do sob demanda não eram parse: só 1,0 s deles era cálculo. Os outros 11 s
# eram `carrega` montando um **segundo** dataset da página inteira — as mesmas
# `PROTOCOLOS GERAL`, `PROTOCOLOS PRODUTIVIDADE` e companhia relidas e reconvertidas —
# com o primeiro ainda residente. O preço não era a coluna de texto; era ter dois
# datasets vivos na mesma máquina. Num processo frio, carregar tudo **com** `Relato` e
# calcular só aquela tabela custa 2,5 s.
#
# Fica também a memória: um dataset de 1,4 GB de RSS no lugar de dois somando ~2,0 GB.
#
# O mecanismo continua inteiro e testado — `sobDemandaDoVisual`, `aqueceSobDemanda`,
# `SobDemanda.tsx`. O que mudou é que nenhuma coluna precisa dele hoje. Se um snapshot
# voltar a crescer uma ordem de grandeza, é aqui que a decisão se registra de novo —
# com a medição junto, como esta.
sob_demanda: []
