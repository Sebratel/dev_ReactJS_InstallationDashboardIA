# Janela de dados: como perguntar ao Power BI a MESMA fatia que temos em disco.
#
# ARQUIVO HUMANO. Não é gerado por `npm run extract` — decisão nossa, como
# `divergencias.yaml` e `juncoes.yaml`.
#
# POR QUE EXISTE. O modelo publicado carrega mais história do que a plataforma
# materializa. Medido em 25/08/2026, `PROTOCOLOS PRODUTIVIDADE` tinha 187.534
# linhas no Power BI e 70.868 aqui, porque o SQL corta em `a.created >=
# '2026-01-01'`. Gravar em `specs/paridade/*.yaml` a medida SEM filtro poria no
# gabarito um número que a plataforma nunca vai produzir. Um gabarito impossível
# não detecta regressão — ele ensina a ignorar o alarme.
#
# REGRA DO CAMPO `verificado`: só entra aqui predicado que, aplicado no Power BI,
# devolve a contagem de linhas que temos em disco. O número fica registrado para
# que a próxima pessoa possa refazer a conta em vez de acreditar.
#
# REGRA DO CAMPO `sha` (17/09/2026): a prova vale para UMA definição de query.
# Reescreva o SQL e o conjunto de linhas muda embaixo do predicado, sem que uma
# letra dele mude — e a prova continua ali, com cara de conferida. Por isso todo
# `verificado` declara o `shaDaQuery` da spec no dia da prova, e `carregaJanelas`
# **recusa** a janela (manda a tabela para `bloqueadas`) quando o sha falta ou não
# bate. Mesmo desenho do `shaConferido` de `packages/snapshot/src/nativas.ts` e do
# guarda de coluna materializada (ACHADOS #47): o hash não conserta nada, ele
# obriga alguém a refazer a conta.
#
# Comparar CONTAGEM não serviria: as duas pontas acumulam, então divergir com o
# tempo é o normal, e qualquer limiar ou envelhece ou não pega nada. O sha é
# exato. E ele ignora espaço em branco de propósito — reindentar o SQL não
# invalida uma prova, e invalidar por isso treinaria quem mantém este arquivo a
# recarimbar o sha sem medir, que é o pior desfecho possível para um guarda assim.
#
# COMO CONFERIR DE NOVO:
#   EVALUATE ROW("n", CALCULATE(COUNTROWS('TABELA'), <o dax abaixo>))
# compare com a entrada da tabela em snapshot/manifesto.json, e grave junto o sha
# que `shaDaQuery('specs', '<TABELA>')` devolve (`tools/powerbi/src/janela.ts`).

tabelas: {}

# Tabelas em que NENHUM predicado equaliza, porque os dois lados não são a mesma
# coisa. Card cujo alcance toca uma destas não recebe número automático.
# AS DUAS PRIMEIRAS ESTÃO AQUI DESDE 17/09/2026, E ANTES ERAM JANELAS VÁLIDAS.
# Não porque o predicado tenha sido refutado, mas porque a PROVA dele venceu e
# ninguém pode mais dizer sobre qual definição de query ela foi feita. Preferir o
# bloqueio é a regra do topo deste arquivo aplicada a ele mesmo: o arquivo que
# prova que o número está certo é o último lugar onde cabe um palpite. Limpar cada
# um custa UMA consulta DAX — a receita está em "COMO CONFERIR DE NOVO".
bloqueadas:
  PROTOCOLOS GERAL: >-
    A PROVA VENCEU, E ESTA TEM EVIDÊNCIA DE QUE O CONJUNTO MUDOU (17/09/2026). O
    predicado era `'PROTOCOLOS GERAL'[DATA CRIADO] >= DATE(2026,1,1)`, provado em
    25/08/2026 com pbi=35095 contra nos=34978. Em 17/09 o disco traz 95.442
    linhas — 2,73x — e isso não é acúmulo de 23 dias: o commit 8b1fd19 (04/09)
    reescreveu o desempate do ROW_NUMBER e destravou um EXISTS, e o título dele
    diz "3,1x". A lista `it.id IN (...)` do SQL nunca mudou, então o corte por
    data continua sendo o predicado plausível; o que não se sabe é se o lado do
    Power BI ganhou as mesmas linhas. Enquanto não se souber, todo gabarito daqui
    sairia medido sobre ~35 mil linhas e comparado com 95 mil. Para desbloquear:
    rode a consulta de "COMO CONFERIR DE NOVO" e devolva a entrada a `tabelas`
    com o `sha` novo.

  PROTOCOLOS PRODUTIVIDADE: >-
    A PROVA VENCEU, SEM EVIDÊNCIA DE QUE O PREDICADO TENHA DEIXADO DE VALER
    (17/09/2026). O predicado era `'PROTOCOLOS PRODUTIVIDADE'[DATA CRIADO] >=
    DATE(2026,1,1)`, provado em 25/08/2026 com pbi=70879 contra nos=70868. O disco
    hoje traz 77.452 linhas: +9,3% em 23 dias, compatível com acúmulo normal. O
    que impede de mantê-la é que a query foi REESCRITA desde a prova — migrada de
    M para SQL em 10/09, e o desempate de endereço em 14/09 — então a prova não é
    sobre a definição de hoje, e nenhum registro diz que alguém remediu depois. É
    bloqueio por falta de prova, não por defeito conhecido: é o caso em que
    desbloquear provavelmente só confirma o que já estava lá.
    ARMADILHA, que sobrevive ao desbloqueio e por isso fica registrada aqui: o
    corte é por DATA CRIADO, mas quase toda medida agrega por DATA INSTALAÇÃO.
    Protocolo criado em 2025 e instalado em 2026 existe lá e não existe aqui — 328
    casos em 2026, concentrados na primeira semana de janeiro. O predicado tem de
    ser na coluna do CORTE, não na da agregação: é ele que reproduz o conjunto de
    linhas que temos.

  FIELD AGENDA: >-
    As duas tabelas têm definições diferentes, não janelas diferentes. O nosso SQL
    filtra região (`region_title LIKE '%Base Canoas (Ativação)%' OR '%Base São
    Leopoldo (Ativação)%'`) e exclui relatos por título (`Execução:%`,
    `Manutenção de Solicitação%`, ...); o modelo publicado não faz nada disso.
    Medido em 25/08/2026: 1.587.041 linhas lá contra 41.255 aqui, e o recorte de
    3 meses do SQL sozinho explica só até 641.996 — sobra um fator de 15.
    (Esse recorte de 3 meses saiu do `sql:` num reset em 26/08 e foi restaurado em
    27/08 por medição — ver docs/ACHADOS.md. O snapshot de 25/08 tem 41.773 linhas.)
    E antes de tratar a diferença como defeito nosso: NINGUÉM REGISTRA CONTRA QUAL
    RELATÓRIO os números de `pbi:` foram medidos. Erick, 27/08: o alvo é o
    `INST - Relatório Instalação`, NÃO o `... Gerencial`. "Definições diferentes"
    é exatamente a cara de ter consultado o relatório errado.
    CORREÇÃO (17/09/2026): este parágrafo dizia "a última carga desta query MORREU
    (`snapshot/field-agenda.erro.log`, ECONNRESET em 19/08 após 38 min de colunas
    calculadas), então o arquivo em disco também está incompleto. Resolver a carga
    antes de tentar equalizar." Aquele arquivo de erro NÃO EXISTE mais, e o
    manifesto traz 643.176 linhas x 26 colunas geradas em 15/09/2026 — a carga foi
    resolvida e a instrução mandava refazer trabalho já feito. O que NÃO muda é o
    bloqueio: o fator de 15 acima foi raciocinado sobre um disco de 41 mil linhas e
    hoje há 643 mil, então nem a divergência de forma foi remedida — ela foi
    remexida. Reequalizar exige medir de novo os dois lados, contra o relatório
    certo.

  # Este bloqueio não é de janela — é de CONFIANÇA na fonte, e o motivo importa
  # porque aqui quem regrediu foi o Power BI, não a plataforma.
  INSTALAÇÕES REINCIDENTES: >-
    A base de reincidência do modelo publicado congelou. Medido em 25/08/2026: as
    linhas marcadas `reincidente_30d = "SIM"` vão de 2026-01-02 até **2026-04-13**
    e param, enquanto as marcadas "NÃO" seguem até 2026-08-25 — fonte que parou de
    alimentar, não regra de negócio. Total lá: 444. Aqui: 1.372, distribuídos de
    forma estável (212, 157, 176, 195, 193, 185, 165, 89 por mês).
    A prova de que os 444 são o desvio, e não nós: o gabarito de
    `specs/paridade/instalacao-reincidente.yaml`, ditado DA TELA em 11/08/2026,
    registra `Reincidentes: 1272` e `% Reincidencia: 0.0649` — e a nossa
    `% Reincidencia` dá 0.064911, erro de 0,02%. O relatório mostrava o número
    certo em agosto e passou a mostrar 444 depois. Preencher o gabarito pela API
    aqui trocaria um número correto por um regredido. Reavaliar quando a fonte
    de manutenções do Power BI voltar a alimentar.

  BACKLOG AGENDADO FUTURO: >-
    ⚠️ ESTA CONTAGEM ESTÁ VELHA — reconferir. O `snapshot/manifesto.json` (carga de
    25/08/2026 19:53) diz que `backlog-agendado-futuro` tem **91.335 linhas**, que é
    EXATAMENTE o número do Power BI abaixo. Se confirmar, o bloqueio caiu.
    O texto original, de quando aqui havia 147.936:
    Formas incompatíveis. No Power BI é uma tabela de 5 colunas
    (`protocolo_id`, `data_inicio_slot`, `data_carga`) com 91.335 linhas; aqui são
    147.936 — nós temos MAIS, então não é recorte de data, e um predicado de
    janela não teria o que cortar. Provavelmente granularidade de carga diferente
    (`data_carga` sugere um acumulado diário lá). Investigar a definição antes de
    declarar qualquer predicado.
