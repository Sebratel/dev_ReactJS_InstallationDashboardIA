# GERADO automaticamente por tools/extractor a partir do PBIP.
# NÃO editar à mão sem registrar em docs/SPEC-DRIVEN.md.
spec: measures
table: CALENDARIO INSTALADO
id: calendario-instalado
measures:
- name: TOTAL_DIAS_ENCERRADOS
  format: "0"
  display_folder: null
  dax: "DISTINCTCOUNT('CALENDARIO INSTALADO'[DATA INSTALADO].[Dia])"
- name: "# PROJEÇÃO"
  format: "0"
  display_folder: null
  dax: |-
    DISTINCTCOUNT('PROTOCOLOS GERAL'[SOLICITACAO]) + 
    (
        [# MEDIA INSTALADO MENSAL] * 
        CALCULATE(
            SUM('CALENDARIO INSTALADO'[PESO]),
            DATESBETWEEN(
                'CALENDARIO INSTALADO'[DATA INSTALADO],
                TODAY(), -- Data atual
                ENDOFMONTH('CALENDARIO INSTALADO'[DATA INSTALADO]) -- Último dia do mês atual
            )
        )
    )
