# GERADO automaticamente por tools/extractor a partir do PBIP.
# NÃO editar à mão sem registrar em docs/SPEC-DRIVEN.md.
spec: measures
table: PROTOCOLOS PRODUTIVIDADE
id: protocolos-produtividade
measures:
- name: "Faixa Premiação"
  format: null
  display_folder: null
  dax: |-
    VAR Ativacoes = DISTINCTCOUNT('PROTOCOLOS PRODUTIVIDADE'[N°PROTOCOLO])
    RETURN
        SWITCH(
            TRUE(),
            Ativacoes <= 59, "R$ 0,00", // Caso haja valores negativos ou zero (cuidado com contratos cancelados no dia 0)
            Ativacoes <= 74, "R$ 150,00",
            Ativacoes <= 89, "R$ 300,00",
            Ativacoes <= 104, "R$ 600,00",
            Ativacoes <= 119, "R$ 800,00",
            Ativacoes <= 135, "R$ 1.000,00",
            Ativacoes > 136, "R$ 1.200,00",
            "Outros" // Fallback para qualquer caso não coberto
    )
- name: "Faixa 1 Premiação Total"
  format: null
  display_folder: null
  dax: |-
    // Esta verificação garante que o cálculo só será exibido nos totais,
    // e não nas colunas individuais de "Tipo de Protocolo".
    IF(
        ISINSCOPE('PROTOCOLOS PRODUTIVIDADE'[N°PROTOCOLO]), // Substitua 'SuaTabela' pelo nome real da sua tabela
        BLANK(), // Retorna vazio para as colunas de tipo de protocolo
        // Se não estiver no escopo do tipo de protocolo (ou seja, no total), calcula a faixa.
        VAR Ativacoes = DISTINCTCOUNT('PROTOCOLOS PRODUTIVIDADE'[N°PROTOCOLO])
        RETURN
            SWITCH(
                TRUE(),
                Ativacoes <= 59, "R$ 0,00",
                Ativacoes <= 74, "R$ 150,00",
                Ativacoes <= 89, "R$ 300,00",
                Ativacoes <= 104, "R$ 600,00",
                Ativacoes <= 119, "R$ 800,00",
                Ativacoes <= 135, "R$ 1.000,00",
                "R$ 1.200,00" // O padrão para Ativacoes > 135
            )
    )
- name: protocolos_fibra
  format: "0"
  display_folder: null
  dax: |-
    CALCULATE(
        DISTINCTCOUNT('PROTOCOLOS PRODUTIVIDADE'[N°PROTOCOLO]),
        'PROTOCOLOS PRODUTIVIDADE'[TIPO DE PROTOCOLO] = "TEC - Instalação de Fibra – CORPORATIVO" ||
        'PROTOCOLOS PRODUTIVIDADE'[TIPO DE PROTOCOLO] = "TEC - Instalação de Fibra")
- name: protocolos_troca
  format: "0"
  display_folder: null
  dax: |-
    CALCULATE(
        DISTINCTCOUNT('PROTOCOLOS PRODUTIVIDADE'[N°PROTOCOLO]),
        'PROTOCOLOS PRODUTIVIDADE'[TIPO DE PROTOCOLO] = "TEC - Troca de Endereço")
- name: Faixas
  format: null
  display_folder: null
  dax: |-
    VAR Ativacoes = DISTINCTCOUNT('PROTOCOLOS PRODUTIVIDADE'[N°PROTOCOLO])
    RETURN
        SWITCH(
            TRUE(),
            Ativacoes <= 59, " ", // Caso haja valores negativos ou zero (cuidado com contratos cancelados no dia 0)
            Ativacoes <= 74, "FAIXA 1",
            Ativacoes <= 89, "FAIXA 2",
            Ativacoes <= 104, "FAIXA 3",
            Ativacoes <= 119, "FAIXA 4",
            Ativacoes <= 135, "FAIXA 5",
            Ativacoes > 136, "FAIXA 6",
            "Outros" // Fallback para qualquer caso não coberto))))
            )
- name: Total Protocolos
  format: "0"
  display_folder: null
  dax: "DISTINCTCOUNT('PROTOCOLOS PRODUTIVIDADE'[N°PROTOCOLO])"
- name: Total Dias
  format: "0"
  display_folder: null
  dax: "DISTINCTCOUNT('PROTOCOLOS PRODUTIVIDADE'[DATA INSTALAÇÃO])"
- name: "Média Protocolos por Dia"
  format: null
  display_folder: null
  dax: |-
    DIVIDE(
        [Total Protocolos],
        [Total Dias]
    )
- name: "Média Geral"
  format: null
  display_folder: null
  dax: |-
    AVERAGEX(
        VALUES('PROTOCOLOS PRODUTIVIDADE'[INSTALADOR]),
        DIVIDE(
            CALCULATE(DISTINCTCOUNT('PROTOCOLOS PRODUTIVIDADE'[N°PROTOCOLO])),
            CALCULATE(DISTINCTCOUNT('PROTOCOLOS PRODUTIVIDADE'[DATA INSTALAÇÃO]))
        )
    )
- name: "Instalações Produtividade"
  format: "0"
  display_folder: null
  dax: "DISTINCTCOUNT('PROTOCOLOS PRODUTIVIDADE'[N°PROTOCOLO])"
