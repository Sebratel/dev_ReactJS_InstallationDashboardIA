# Cadência do refresh automático — MANTIDO POR HUMANOS, como incremental.yaml e
# cache-policies.yaml: "de quanto em quanto tempo" é decisão, não extração, e
# `npm run extract` nunca deveria sobrescrever isto.
#
# Cada grupo roda em SÉRIE dentro de um mesmo tick do Refresh Manager
# (tools/refresh/src/index.ts) — nunca em paralelo com outro grupo do mesmo tick.
# Ver o docstring de index.ts para o porquê (read-modify-write do manifesto).
#
# Query que não aparece em grupo nenhum aqui NÃO tem refresh automático — continua
# só no passe manual (`npm run snapshot -- --todas`). Isso vale hoje para QUATRO
# categorias, nenhuma por acidente — as duas últimas só apareceram ao rodar o
# primeiro tick de verdade em 02/09/2026:
#
#   1. 4 das 7 fontes nunca medidas isoladamente continuam de fora
#      (gestores-equipes, dbMaria; apuracao-premiacao, capacidade-equipe,
#      quadro-funcional, gsheets) — dar cadência automática a
#      uma fonte sem custo medido é a mesma aposta sem evidência que
#      incremental.yaml já cometeu uma vez com "67s, medido" antes de existir
#      caminho de código que produzisse esse número (ACHADOS #80).
#      `backlog-instalacao`/`backlog-agendado-futuro` (2 das 7) foram
#      medidas ao vivo em 03/09/2026 (ACHADOS #93) — 58-60ms cada, entraram no
#      grupo `quente` abaixo. `clima-tempo` (a 7ª, fonte web) foi medida ao vivo
#      em 09/09/2026: **7.267 ms**, 1.869 linhas, 14 chamadas à Open-Meteo — e
#      entrou no grupo `frio` (ACHADOS #104). Ela é a ÚNICA query cujo conteúdo
#      caduca sozinha: a previsão é uma janela de ~16 dias que anda todo dia, e
#      sem cadência ela envelhece até o visual de previsão esvaziar. Estava 6
#      dias parada quando isso foi descoberto.
#   2. `protocolos-produtividade` — **RESOLVIDO em 13/09/2026, entrou no grupo
#      `frio` abaixo.** Estava fora por ACHADOS #81 ("SQL e M calculam as mesmas 3
#      colunas, e o full-fetch passou do teto de 600s"), e `grupos.ts` tinha uma
#      trava recusando o arquivo inteiro se ela aparecesse. As duas causas caíram:
#      o M ficou só com o join de GESTOR, e o SQL saiu de "não termina em 600s"
#      para 142,7s. O que custava não era o fanout de `financial_receivable_titles`
#      (78,57 títulos por contrato, medido) e sim o `regexp_replace` dentro do `ON`
#      do CTE `mesclado`: sem estatística sobre a expressão o planejador estimava
#      `rows=2` contra 70 mil reais e escolhia Nested Loop — dois regexps por PAR
#      de linhas. `AS MATERIALIZED` nas CTEs `unificado`/`auxiliar` resolveu.
#      Materialização ponta a ponta medida: **162s, 76.398 linhas**.
#      A trava em `grupos.ts` continua existindo, com a lista vazia.
#   3. `protocolos-geral` — o M dela faz `Table.NestedJoin` com `GESTORES EQUIPES`
#      (dbMaria), e o pacote `mysql2` não está instalado nem declarado em
#      package.json. QUALQUER query que toque dbMaria — direto ou por join de M —
#      crasha com `ERR_MODULE_NOT_FOUND: mysql2` (ACHADOS #83). Fora daqui até o
#      pacote existir.
#   4. `field-agenda` — o número de 22,0s em incremental.ts/no briefing da Frente 3
#      é custo de SQL isolado (`npm run probe:custo-incremental`), não o
#      materializador inteiro. Medido ao vivo em 02/09/2026: **21 minutos e 49
#      segundos** ponta a ponta (busca + conversão de 642.365 linhas × 26 colunas
#      + escrita). Nenhuma cadência de minutos é segura para esta query enquanto
#      isso não for remedido e, se real, investigado (ACHADOS #82).
#
#      `field-agenda-slot` (achado #87 — mesma origem, sem os `LEFT JOIN` de
#      relato/skill) NÃO tem este problema — ver grupo `frio` abaixo, 03/09/2026.
#      A forma COMPLETA (`field-agenda`) continua de fora de qualquer grupo.
#
# ATENÇÃO (03/09/2026, ACHADOS #89) — O CUSTO CAIU 24×, CORRIGIDO EM 16/09/2026.
# O encadeamento continua igual: qualquer query materializada com sucesso aqui
# dispara `calculadas.ts --todas` em seguida (`tools/snapshot/src/index.ts`), que
# recongela as SETE tabelas calculadas do zero, sempre, sem checagem de idade. O que
# mudou foi o preço. Em 03/09 eram ~50-65s por coluna de `Status Protocolo Dia` × 4 =
# ~4 minutos em cima de QUALQUER grupo bem-sucedido, e este bloco mandava dimensionar
# todo intervalo novo como "tempo de busca MAIS ~4 min". No dia seguinte, 04/09, o
# commit 9083221 (`packages/snapshot/src/nativas.ts`) trocou o DAX avaliado por linha
# por uma agregação e levou aquela tabela de 211s para 4,6s. O bloco não foi
# atualizado junto: a instrução de dimensionamento ficou doze dias mandando reservar
# um orçamento que já não existia.
#
# Medido ao vivo em 16/09/2026 — `npm run snapshot:calculadas -- --todas` contra o
# snapshot em disco, processo inteiro cronometrado de fora em 10.309 ms:
#
#   BASE DE ORIGEM ..............      6 ms     3 linhas
#   calendar ....................     12 ms     13.099 linhas
#   CALENDARIO AGENDAMENTO ......  3.787 ms     730 linhas   <- a maior fatia hoje
#   CALENDARIO CRIADO ...........      6 ms     365 linhas
#   CALENDARIO INSTALADO ........     12 ms     713 linhas
#   PROTOCOLOS ..................      2 ms     10 linhas
#   Status Protocolo Dia ........  2.934 ms     13.099 linhas
#                                  --------
#   total do processo ...........  9.852 ms
#
# `Status Protocolo Dia` sai por `[tradução nativa]` e não avalia uma linha de DAX.
# A maior fatia passou a ser `[DATA VIGENTE?]` de `CALENDARIO AGENDAMENTO` (3.671 ms
# das 730 linhas dela) — nenhuma das duas justifica reserva de minutos.
#
# **Ao dimensionar um intervalo novo: some ~10s, não ~4 min.** E o item dominante de
# um tick deixou de ser este encadeamento: em 16/09 o `frio` levou 190s, dos quais a
# busca de `protocolos-produtividade` (~162s) é a quase totalidade.

formato: 1

grupos:
  # ~11s de busca serial medido ao vivo em 02/09/2026 (contratos 2,9s +
  # protocolos-telefonia 7,4s + contratos-telefonia 0,9s + o resto <0,2s), mais o
  # congelamento das calculadas. protocolos-telefonia tem a armadilha do TMA
  # calculado com DateTime.LocalNow() (achado C do briefing da Frente 3) e por
  # isso fica em full-fetch, não em cadência mais rápida sozinha — mas cabe aqui
  # porque o full-fetch dela é barato.
  #
  # `backlog-instalacao` entrou em 03/09/2026 (ACHADOS #93): dbMaria, 58ms medido
  # ao vivo, 5.875 linhas sem erro. `backlog-agendado-futuro` (93.083 linhas) fica
  # fora porque seu passo M faz Table.NestedJoin com PROTOCOLOS GERAL (que está fora
  # de refresh até otimização SQL/M).
  quente:
    queries:
      - protocolos-telefonia
      - contratos
      - contratos-telefonia
      - consolidado-clientes
      - feriados
      - hora-atualizado
      - backlog-instalacao
    intervalo_minutos: 15
    incremental: false

  # ~35s de busca serial medido em 25/08/2026. troca-endereco, tecnicos-auxiliares,
  # retorno-prioritario, base-categorias-field são seguras para incremental "no
  # papel" mas isso nunca foi ligado (ACHADOS #80 só ligou protocolos-produtividade,
  # a única com política declarada) — ficam em full-fetch até ganharem política em
  # incremental.yaml. alocacao-patrimonio é lado direito de mesclagem de várias
  # queries do grupo quente e de protocolos-produtividade — cadência independente
  # dela é um risco de granularidade já registrado no briefing da Frente 3, não
  # resolvido aqui.
  medio:
    queries:
      - troca-endereco
      - instalacoes-reincidentes
      - tecnicos-auxiliares
      - retorno-prioritario
      - alocacao-patrimonio
      - base-categorias-field
      - reincidencia
    intervalo_minutos: 20
    incremental: false

  # `field-agenda-slot` (achado #87): mesma origem de `field-agenda`
  # (v_service_desk_slots_productivity_informative), sem os LEFT JOIN de
  # relato/skill — é o arquivo que atende a maioria das aberturas de
  # `agendamento-field` (ACHADOS #87/#88). Medido ao vivo em 03/09/2026:
  # 13,5s de busca+escrita (41.348 linhas) + ~10s de recongelamento das calculadas
  # que QUALQUER grupo bem-sucedido paga (ver ATENÇÃO acima — eram ~4 min até
  # 04/09/2026, hoje são 9,8s medidos). Sozinha, ela fecharia um tick em ~24s. O que
  # dimensiona este grupo hoje é `protocolos-produtividade`, mais abaixo: o tick
  # inteiro medido em 16/09/2026 foi de 190s, ~10,6% do intervalo de 30 min.
  # Sozinha no grupo: perfil de fonte e custo
  # diferentes de `quente`/`medio`, e um novo grupo aqui já significa mais
  # uma queda do cache de resposta inteiro por ciclo (armadilha registrada em
  # docs/DEPLOY.md) — não vale apertar o intervalo sem necessidade medida.
  # `field-agenda` (forma completa) continua de fora — 21min49s (achado #82).
  #
  # `clima-tempo` entrou em 09/09/2026 (ACHADOS #104): fonte web (Open-Meteo),
  # 7.267 ms medidos ao vivo, 1.869 linhas, 14 chamadas HTTP. Entrou AQUI e não
  # num grupo próprio porque grupo novo custa mais uma queda do cache de resposta
  # inteiro por ciclo (docs/DEPLOY.md), e 7,3s dentro de um tick de 190s medidos não
  # muda a margem do intervalo de 30 min.
  #
  # **Por que ela precisa de cadência, ao contrário de toda outra query.** As
  # demais ficam desatualizadas; esta fica VAZIA. A tabela tem previsão só de hoje
  # até ~16 dias à frente, e o visual de chuva de `agendamento-field` filtra
  # `Tipo = "Previsão"` — parada 17 dias, ela não tem uma linha de previsão e a
  # matriz esvazia sem erro. Foi o que estava acontecendo: o arquivo tinha 6 dias.
  #
  # O preço: 48 ticks/dia × 14 chamadas = ~672 pedidos/dia à Open-Meteo, para um
  # dado que muda poucas vezes ao dia. Cabe folgado no limite do serviço, mas se
  # um dia isso incomodar, o conserto é um grupo próprio de cadência horária — não
  # tirar daqui.
  # `protocolos-produtividade` entrou em 13/09/2026. Escolhido o `frio` e não outro
  # grupo por ser a query mais cara de todas: 162s de materialização ponta a ponta
  # (76.398 linhas), mais as calculadas. Num intervalo de 30 min isso é ~11% de ciclo
  # de trabalho; no `quente` (15 min) seria ~21%. Frescor de 30 min é folgado aqui --
  # é produtividade diária de instalação, não operação minuto a minuto.
  #
  # Não ganhou grupo próprio de propósito: grupo novo custa mais uma queda do cache de
  # resposta inteiro por ciclo (docs/DEPLOY.md).
  #
  # `incremental: false` por ora, apesar de ela ser a ÚNICA query com política em
  # `incremental.yaml`. A carga completa agora cabe no orçamento, e ligar a costura
  # incremental logo depois da reescrita do SQL empilharia risco sem necessidade -- a
  # costura ancora em duas linhas exatas daquele arquivo. Ligar depois é barato.
  frio:
    queries:
      - field-agenda-slot
      - clima-tempo
      - protocolos-produtividade
    intervalo_minutos: 30
    incremental: false
