- name: RankDataProtocolo
  type: null
  format: "0"
  source_column: null
  calculated: true
  dax: |-

    VAR ProtocoloAtual = 'FIELD AGENDA'[protocolo]
    VAR DataAtual = TRUNC('FIELD AGENDA'[Slot Agenda])
    VAR TabelaDatas =
        DISTINCT(
            SELECTCOLUMNS(
                FILTER(
                    'FIELD AGENDA',
                    'FIELD AGENDA'[protocolo] = ProtocoloAtual
                ),
                "Data", TRUNC('FIELD AGENDA'[Slot Agenda])
            )
        )
    RETURN
    RANKX(
        TabelaDatas,
        [Data],
        ,
        ASC,
        DENSE
    )
- name: RankAtualProtocolo
  type: null
  format: "0"
  source_column: null
  calculated: true
  dax: |-

    VAR ProtocoloAtual = 'FIELD AGENDA'[protocolo]
    RETURN
    CALCULATE(
        MAX('FIELD AGENDA'[RankDataProtocolo]),
        FILTER('FIELD AGENDA', 'FIELD AGENDA'[protocolo] = ProtocoloAtual)
    )
