- name: Status SLA
  type: null
  format: null
  source_column: null
  calculated: true
  dax: |-

    VAR Agora =
        NOW()

    VAR Prazo =
        'FIELD AGENDA'[Prazo SLA]

    RETURN
    IF (
        ISBLANK ( Prazo ),
        BLANK(),
        IF (
            Agora <= Prazo,
            "Dentro do Prazo",
            "Fora do Prazo"
        )
    )
