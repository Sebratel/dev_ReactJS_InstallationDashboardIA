- name: CategoriaProdutividade
  type: null
  format: null
  source_column: null
  calculated: true
  dax: |-

    VAR Texto = 'FIELD AGENDA'[ClassificacaoRelato]
    RETURN
    SWITCH(
        TRUE(),
        CONTAINSSTRING(Texto, "IMPROD"), "Improdutiva",
        CONTAINSSTRING(Texto, "PROD"), "Produtiva",
        BLANK()
    )
- name: Turno
  type: null
  format: null
  source_column: null
