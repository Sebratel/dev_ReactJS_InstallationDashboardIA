- name: INSTALADOR_PAD
  type: null
  format: null
  source_column: null
  calculated: true
  dax: |-

    VAR InstaladorMinusculo = LOWER([INSTALADOR]) // Começa padronizando o case

    VAR AcentosA = 
        SUBSTITUTE(
            SUBSTITUTE(
                SUBSTITUTE(
                    SUBSTITUTE(InstaladorMinusculo, "á", "a"),
                "à", "a"),
            "â", "a"),
        "ã", "a")

    VAR AcentosE = 
        SUBSTITUTE(
            SUBSTITUTE(AcentosA, "é", "e"),
        "ê", "e")

    VAR AcentosI = 
        SUBSTITUTE(
            SUBSTITUTE(AcentosE, "í", "i"),
        "î", "i")

    VAR AcentosO = 
        SUBSTITUTE(
            SUBSTITUTE(
                SUBSTITUTE(AcentosI, "ó", "o"),
                "ô", "o"),
            "õ", "o")

    VAR AcentosU = 
        SUBSTITUTE(
            SUBSTITUTE(AcentosO, "ú", "u"),
        "û", "u")

    VAR CedilhaC = 
        SUBSTITUTE(AcentosU, "ç", "c")

    RETURN
        CedilhaC
