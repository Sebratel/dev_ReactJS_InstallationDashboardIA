- name: "DATA INSTALAÇÃO"
  type: null
  format: Short Date
  source_column: null
  calculated: true
  dax: |-

    IF(
        ISBLANK('PROTOCOLOS PRODUTIVIDADE'[DATA ALOCAÇÃO]) && 
        'PROTOCOLOS PRODUTIVIDADE'[TIPO DE PROTOCOLO] = "TEC - Migração com troca de Equipamento" && 
        'PROTOCOLOS PRODUTIVIDADE'[EQUIPE] = "Financeiro" &&
        'PROTOCOLOS PRODUTIVIDADE'[DATA AGENDA] <= TODAY(), 
        'PROTOCOLOS PRODUTIVIDADE'[DATA AGENDA],
        IF(
            'PROTOCOLOS PRODUTIVIDADE'[TIPO DE PROTOCOLO] IN {
                "TEC - Troca de Endereço",
                "#HR - TEC - Troca de Endereço"
            }, 
            'PROTOCOLOS PRODUTIVIDADE'[DATA DA TROCA],
            'PROTOCOLOS PRODUTIVIDADE'[DATA ALOCAÇÃO]
        )
    )
- name: GESTOR
  type: string
