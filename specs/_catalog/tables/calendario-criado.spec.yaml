# GERADO automaticamente por tools/extractor a partir do PBIP.
# NÃO editar à mão sem registrar em docs/SPEC-DRIVEN.md.
spec: table
id: calendario-criado
name: CALENDARIO CRIADO
query_ref: null
table_dax: |-
  CALENDAR(
                      DATE(YEAR(MIN('PROTOCOLOS TELEFONIA'[DATA CRIADO])), 1, 1),
                      DATE(YEAR(MAX('PROTOCOLOS GERAL'[DATA CRIADO])), 12, 31))
columns:
- name: DATA CRIADO
  type: null
  format: Short Date
  source_column: "[Date]"
  calculated: false
  dax: null
- name: data_vigente
  type: null
  format: "0"
  source_column: null
  calculated: true
  dax: |-

    VAR DataCentral = TODAY()
    RETURN
        IF(
            'CALENDARIO CRIADO'[DATA CRIADO] <= DataCentral,
            1,
            0
        )
- name: PESO
  type: null
  format: null
  source_column: null
  calculated: true
  dax: |-

    VAR DiaDaSemana = WEEKDAY('CALENDARIO CRIADO'[DATA CRIADO], 2)
    VAR Feriados = 
        SWITCH(
            TRUE(),
            'CALENDARIO CRIADO'[DATA CRIADO] IN {DATE(2020,1,1), DATE(2020,4,10), DATE(2020,4,21), DATE(2020,5,1),
                                  DATE(2020,9,7), DATE(2020,10,12), DATE(2020,11,2), DATE(2020,11,15),
                                  DATE(2020,12,25), DATE(2021,1,1), DATE(2021,4,2), DATE(2021,4,21),
                                  DATE(2021,5,1), DATE(2021,9,7), DATE(2021,10,12), DATE(2021,11,2),
                                  DATE(2021,11,15), DATE(2021,12,25), DATE(2026,6,4)}, 
            1,
            0
        )
    RETURN
        IF(Feriados = 1 || DiaDaSemana = 7, 0, 
            IF(DiaDaSemana = 6, 0.5, 
                1
            )
        )
measure_count: 1
