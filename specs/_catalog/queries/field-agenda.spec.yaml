id: field-agenda
name: FIELD AGENDA
origin: table:FIELD AGENDA
source_type: odbc
datasource: dbVoalle
sql: |-
  SELECT 
      vsdspi.protocol AS "Protocolo",
      vsdspi.incident_type_title AS "Tipo de Protocolo",
      vsdspi.incident_status_title AS "Status Protocolo",
      vsdspi.region_title AS "Base",
      vsdspi.resource_name AS "Instalador",
      vsdspi.assignment_created AS "Data Criado",
      vsdspi.rescheduling_type AS "Reagenda",
      vsdspi.conclusion_date AS "Data finalizado atendimento app",
      vsdspi.first_attendance_history AS "Data primeiro Play app",
      vsdspi.last_attendance_history AS "Data ultimo play app",
      vsdspi.final_date AS "Prazo SLA",
      vsdspi.begin_date AS "Inicio relato",
      vsdspi.end_date AS "Fim relato",
      vsdspi.begin_date_slot AS "Slot Agenda",
      p.name as "Relator",
      s.title as "Skill",
      r.title AS "Descrição",
      r.description AS "Relato",
      r.beginning_date AS "Data Relato"
  FROM v_service_desk_slots_productivity_informative vsdspi
  LEFT JOIN reports r ON vsdspi.assignment_id = r.assignment_id
  left join people p on p.id = r.person_id
  left join person_skills ps on ps.person_id = p.id
  left join skills s on s.id = ps.skill_id 
  WHERE (
      vsdspi.region_title LIKE '%Base Canoas (Ativação)%'
      OR vsdspi.region_title LIKE '%Base São Leopoldo (Ativação)%'
  )
  AND (
      r.title NOT LIKE 'Execução:%'
      AND r.title NOT LIKE 'Manutenção de Solicitação%'
      AND r.title NOT LIKE '%Apontamento interno%'
      AND r.title NOT LIKE 'Manutençao de Solicitação%'
      AND r.title NOT LIKE 'Reabertura (Retrabalho)'
      AND r.title NOT LIKE 'Reabertura (Simples)%'
  )
  -- JANELA DESLIZANTE: divergência DE PROPÓSITO do relatório original, que corta
  -- em '2026-01-01' (ver o `m_expression` abaixo, que é o extraído do PBIP).
  -- Esta é a query mais pesada do corpus — grão (slot, relato) — e a última carga
  -- completa MORREU com ECONNRESET após 38 min. Perdida num reset em 26/08/2026 e
  -- restaurada em 27/08 por medição: ver docs/ACHADOS.md e docs/SPEC-DRIVEN.md.
  AND vsdspi.begin_date_slot >= (CURRENT_DATE - INTERVAL '3 months')
  ORDER BY vsdspi.assignment_created DESC;
