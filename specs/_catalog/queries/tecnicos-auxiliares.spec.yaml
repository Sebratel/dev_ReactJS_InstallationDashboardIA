id: tecnicos-auxiliares
name: TECNICOS AUXILIARES
origin: expression
source_type: odbc
datasource: dbVoalle
sql: |-
  with PERSONALIZAR as (
      select 
          r.tags as "PROTOCOLO:",
          a.assignment_type as "TIPO SOLICITACAO",
          p2.name as "TECNICO",
          p.name as "AUXILIAR",
          a.final_date as "CONCLUIDO EM:",
          row_number() over(partition by r.tags order by a.final_date desc) as PERSONA
      from reports r
      left join assignments a on a.id = r.assignment_id
      left join assignment_incidents ai on ai.assignment_id = a.id
      left join people p on p.id = r.person_id
      left join people p2 on p2.id = a.requestor_id
      left join incident_types i on i.id = ai.incident_type_id
      where a.corresponding_parent_id is not null
        and a.assignment_type = 'RAUX'
        and a.final_date >= '2026-01-01'
  )
  select *
  from PERSONALIZAR
  where PERSONA = 1
url: null
sheet: null
endpoints: null
