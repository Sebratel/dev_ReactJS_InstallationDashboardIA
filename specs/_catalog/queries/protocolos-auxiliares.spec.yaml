id: protocolos-auxiliares
name: PROTOCOLOS AUXILIARES
origin: expression
source_type: odbc
datasource: dbVoalle
sql: |-
  WITH PERSONALIZADO AS (
      SELECT 
          a.title AS "SOLICITACAO",
          ai.protocol AS "N°PROTOCOLO",
          s.start_date AS "DATA AGENDA",
          a.modified AS "DATA ENCERRADO",
          a.created AS "DATA CRIADO",
          is2.title AS "STATUS",
          p.city AS "CIDADE",
          p.neighborhood AS "BAIRRO",
          p.street AS "RUA",
          p.number AS "NUMERO PATRIMÔNIO",
          p.name AS "CLIENTE",
          p.phone AS "TELEFONE",
          t.title AS "EQUIPE",
          ac.lat AS "LATITUDE",
          ac.lng AS "LONGITUDE",
          p2.name AS "RESPONSÁVEL",
          it.title AS "TIPO DE PROTOCOLO",
          aap.title AS "PONTO DE ACESSO",
          aap.code AS "CODIGO",
          aap.slots_first_number AS "SLOT",
          aap.ports_first_number AS "PORTA",  
          as2.title AS "CTO",
          c.v_status AS "STATUS CONTRATO",
          c.v_stage AS "ESTAGIO CONTRATO",
          c.contract_number AS "NUMERO CONTRATO",
          csi.title AS "ITEM",
          sc.title AS "CONTEXTO",
          sp.title AS "PROBLEMA",
          as3.title AS "OLT",
          m.title AS "EQUIPAMENTO",
          ac.user AS "USUÁRIO",
          vu.name AS "CRIADO POR",
          ROW_NUMBER() OVER (
                      PARTITION BY a.title
                      -- MESMO desempate de `protocolos-geral` (decidido por Erick em 04/09/2026,
                      -- invertido em 13/09). As tres queries calculam as MESMAS colunas a partir
                      -- dos MESMOS joins; discordarem sobre qual linha e a certa seria um defeito
                      -- esperando para ser achado.
                      --
                      -- PRIMARIA e o contrato DAQUELE protocolo, nao `active`: LATITUDE, LONGITUDE,
                      -- CTO, PONTO DE ACESSO, CODIGO, OLT, EQUIPAMENTO, SLOT, PORTA e USUARIO saem
                      -- todas de `ac`, e quando o cliente tem varios enderecos a resposta por
                      -- definicao e o contrato que casa; `active` e heuristica.
                      ORDER BY ((ac.contract_id = cst.contract_id) IS TRUE) DESC,
                               (ac.active IS TRUE) DESC,
                               s.start_date DESC NULLS LAST,
                               ac.created DESC NULLS LAST, ac.id DESC NULLS LAST,
                               -- Piso de determinismo. Sem ele esta consulta devolvia valor
                               -- DIFERENTE a cada execucao: medido em 15/09/2026 dentro de uma
                               -- transacao REPEATABLE READ (banco congelado), 7.125 de 38.254 (18,6%) das chaves
                               -- mudavam sozinhas. Cada alias aqui multiplica a particao e nao
                               -- era ordenado por nada: `asp` (um contrato de autenticacao tem
                               -- varias portas de splitter), `s` (uma assignment tem varios
                               -- schedules), `pa` (quando `ac` nao casa, todos os enderecos do
                               -- cliente empatam) e `frt` (78,57 titulos por contrato; aqui so alimenta um CASE de nulo, mas multiplica igual).
                               asp.id DESC NULLS LAST, s.id DESC NULLS LAST,
                               pa.id DESC NULLS LAST, frt.id DESC NULLS LAST
                  ) AS PERSONA1,
          CASE 
              WHEN frt.title IS NULL THEN 'Pendente' 
              ELSE 'Cobrado' 
          END AS "STATUS FINANCEIRO"
      FROM assignment_incidents ai
      LEFT JOIN assignments a ON a.id = ai.assignment_id
      LEFT JOIN schedules s ON s.assignment_id = a.id
      LEFT JOIN incident_types it ON it.id = ai.incident_type_id
      LEFT JOIN incident_status is2 ON is2.id = ai.incident_status_id
      LEFT JOIN people p ON p.id = a.requestor_id
      LEFT JOIN teams t ON t.id = ai.team_id
      LEFT JOIN people_addresses pa ON pa.person_id = p.id
      LEFT JOIN authentication_contracts ac ON ac.people_address_id = pa.id
      LEFT JOIN people p2 ON p2.id = a.responsible_id
      LEFT JOIN authentication_access_points aap ON aap.id = ac.authentication_access_point_id
      LEFT JOIN contract_service_tags cst ON cst.id = ai.contract_service_tag_id
      LEFT JOIN contracts c ON cst.contract_id = c.id
      LEFT JOIN catalog_services_items csi ON csi.id = ai.catalog_service_item_id
      LEFT JOIN authentication_splitter_ports asp ON asp.authentication_contract_id = ac.id
      LEFT JOIN authentication_sites as3 ON as3.id = aap.authentication_site_id
      LEFT JOIN manufacturers m ON m.id = aap.manufacturer_id
      LEFT JOIN solicitation_problems sp ON sp.id = ai.solicitation_problem_id
      LEFT JOIN solicitation_classifications sc ON sc.id = ai.solicitation_classification_id
      LEFT JOIN authentication_splitters as2 ON as2.id = asp.authentication_splitter_id
      LEFT JOIN v_users vu ON vu.id = a.created_by
      LEFT JOIN financial_receivable_titles frt ON c.id = frt.contract_id
      WHERE it.id IN ('12', '1014', '1254', '1255', '1136', '249', '268', '1160', '1015', '15') -- Filtrando os tipos de protocolo
        AND a.created >= '2026-01-01'
  )
  SELECT DISTINCT 
      "SOLICITACAO", 
      "N°PROTOCOLO", 
      "DATA AGENDA", 
      "DATA CRIADO", 
      "DATA ENCERRADO", 
      "STATUS", 
      "CIDADE", 
      "BAIRRO",
      "RUA", 
      "NUMERO PATRIMÔNIO",
      "TELEFONE", 
      "CLIENTE", 
      "EQUIPE", 
      "LATITUDE", 
      "LONGITUDE", 
      "RESPONSÁVEL",
      "TIPO DE PROTOCOLO",
      "PONTO DE ACESSO",
      "CODIGO",
      "SLOT",
      "PORTA",
      "CTO",
      "STATUS CONTRATO",
      "ESTAGIO CONTRATO",
      "NUMERO CONTRATO",
      "ITEM",
      "CONTEXTO",
      "PROBLEMA",
      "OLT",
      "EQUIPAMENTO",
      "USUÁRIO",
      "CRIADO POR",
      "STATUS FINANCEIRO"
  FROM PERSONALIZADO
  WHERE PERSONA1 = 1;
