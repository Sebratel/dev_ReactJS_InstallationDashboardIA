id: contratos
name: CONTRATOS
origin: table:CONTRATOS
source_type: odbc
datasource: dbVoalle
sql: |-
  select
  	p.name "CLIENTE",
  	ac.user "USUÁRIO",
  	c.contract_number "NUMERO CONTRATO",
  	c.description "CONTRATO",
  	c.created "CRIADO",
  	cst.service_tag "ETIQUETA",
  	sp.title "PLANO",
  	ac.city "CIDADE",
  	cs.title "CATALOGO",
  	p.phone "TELEFONE",
  	ac.city "CIDADE",
  	ac.neighborhood "BAIRRO",
  	ac.street "RUA",
  	ac.street_number "NUMERO",
  	ac.complement "COMPLEMENTO",
  	ac.postal_code "CEP",
  	ac.state "ESTADO",
  	p.tx_id "CPF/CNPJ",
  	p.cell_phone_1 "TELEFONE CONTATO",
  	p.email "E-MAIL",
  	ac.lat "LATITUDE",
  	ac.lng "LONGITUDE",
          sp.id
  	from authentication_contracts ac
  	left join contracts c on c.id = ac.contract_id
  	left join contract_service_tags cst on cst.id = ac.service_tag_id
  	left join service_products sp on sp.id = ac.service_product_id
  	left join contract_service_tags_catalog_services cst2 on cst2.contract_service_tag_id = cst.id 
  	left join catalog_services cs on cs.id = cst2.catalog_service_id
  	left join people p on p.id = c.client_id
  	where cst2.deleted is not true
  	order by p.name asc
