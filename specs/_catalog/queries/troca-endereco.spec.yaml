id: troca-endereco
name: "TROCA ENDEREÇO"
origin: expression
source_type: odbc
datasource: dbVoalle
sql: |-
  WITH PERSONALIZADO AS (
      SELECT 
          p.name AS "TÉCNICO", 
          ai.protocol AS "PROTOCOLO", 
          r.final_date AS "DATA DA TROCA", 
          c.contract_number AS "CONTRATO",
          ROW_NUMBER() OVER (
              PARTITION BY ai.protocol 
              ORDER BY r.final_date DESC
          ) AS PERSONA1
      FROM assignments a
      LEFT JOIN assignment_incidents ai 
          ON ai.assignment_id = a.id
      LEFT JOIN reports r 
          ON r.assignment_id = a.id
      LEFT JOIN people p 
          ON p.id = r.person_id
      LEFT JOIN contract_service_tags cst 
          ON cst.id = ai.contract_service_tag_id
      LEFT JOIN contracts c 
          ON c.id = cst.contract_id
      LEFT JOIN incident_types it 
          ON it.id = ai.incident_type_id
      WHERE 
          DATE(r.final_date) >= '2026-01-01'
          AND it.id in ('15', '1256')
          AND (
              r.description LIKE '%O condomínio é adequado?%'
              OR r.description LIKE '%Foi feita a instalação?%'
          )
  )  -- <<< fecha a CTE aqui
  SELECT 
      * 
  FROM PERSONALIZADO
  WHERE PERSONA1 = 1;
