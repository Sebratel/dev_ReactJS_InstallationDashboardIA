id: clima-tempo
name: Clima/ Tempo
origin: table:Clima/ Tempo
source_type: web
datasource: web
sql: null
url: https://archive-api.open-meteo.com
endpoints:
- https://archive-api.open-meteo.com
- https://api.open-meteo.com
source_tables: []
m_expression: |-
  let
      cidades = {
          {"Porto Alegre",      "-30.0346", "-51.2177"},
          {"Canoas",            "-29.9178", "-51.1839"},
          {"Esteio",            "-29.8567", "-51.1758"},
          {"Sapucaia do Sul",   "-29.8333", "-51.1500"},
          {"São Leopoldo",      "-29.7608", "-51.1483"},
          {"Novo Hamburgo",     "-29.6783", "-51.1303"},
          {"Cachoeirinha",      "-29.9533", "-51.0939"}
      },

      OntemTexto = Date.ToText(Date.AddDays(Date.From(DateTime.LocalNow()), -1), "yyyy-MM-dd"),

      BuscarHistorico = (cidade as list) =>
      let
          nome = cidade{0},
          lat  = cidade{1},
          lon  = cidade{2},

          dados = Json.Document(
              Web.Contents(
                  "https://archive-api.open-meteo.com",
                  [
                      RelativePath = "/v1/archive",
                      Query = [
                          latitude    = lat,
                          longitude   = lon,
                          start_date  = "2026-01-01",
                          end_date    = OntemTexto,
                          daily       = "precipitation_sum",
                          timezone    = "America/Sao_Paulo"
                      ],
                      Headers = [#"Accept-Encoding" = "identity"]
                  ]
              )
          ),

          datas        = dados[daily][time],
          precipitacao = dados[daily][precipitation_sum],

          tabela    = Table.FromColumns(
              {datas, precipitacao, List.Repeat({null}, List.Count(datas))},
              {"Data", "Precipitacao_mm", "Probabilidade_Chuva_%"}
          ),
          comCidade = Table.AddColumn(tabela, "Cidade", each nome),
          comTipo   = Table.AddColumn(comCidade, "Tipo", each "Histórico")
      in
          comTipo,

      BuscarPrevisao = (cidade as list) =>
      let
          nome = cidade{0},
          lat  = cidade{1},
          lon  = cidade{2},

          dados = Json.Document(
              Web.Contents(
                  "https://api.open-meteo.com",
                  [
                      RelativePath = "/v1/forecast",
                      Query = [
                          latitude      = lat,
                          longitude     = lon,
                          daily         = "precipitation_sum,precipitation_probability_max",
                          timezone      = "America/Sao_Paulo",
                          forecast_days = "16"
                      ],
                      Headers = [#"Accept-Encoding" = "identity"]
                  ]
              )
          ),

          datas         = dados[daily][time],
          precipitacao  = dados[daily][precipitation_sum],
          probabilidade = dados[daily][precipitation_probability_max],

          tabela    = Table.FromColumns(
              {datas, precipitacao, probabilidade},
              {"Data", "Precipitacao_mm", "Probabilidade_Chuva_%"}
          ),
          comCidade = Table.AddColumn(tabela, "Cidade", each nome),
          comTipo   = Table.AddColumn(comCidade, "Tipo", each "Previsão")
      in
          comTipo,

      historicos = List.Transform(cidades, BuscarHistorico),
      previsoes  = List.Transform(cidades, BuscarPrevisao),

      tabelaHistorico = Table.Combine(historicos),
      tabelaPrevisao  = Table.Combine(previsoes),

      datasPrevisao = List.Transform(
          Table.ToRecords(Table.SelectColumns(tabelaPrevisao, {"Data", "Cidade"})),
          each [Data] & [Cidade]
      ),

      historicoFiltrado = Table.SelectRows(tabelaHistorico, each not List.Contains(
          datasPrevisao, [Data] & [Cidade]
      )),

      resultado = Table.Combine({historicoFiltrado, tabelaPrevisao}),

      comTipo = Table.TransformColumnTypes(resultado, {
          {"Data",                  type date},
          {"Precipitacao_mm",       type number},
          {"Probabilidade_Chuva_%", type number}
      }),

      comClassificacao = Table.AddColumn(comTipo, "Classificacao_Chuva", each
          if [Precipitacao_mm] = 0 then "Sem chuva"
          else if [Precipitacao_mm] < 5 then "Chuva fraca"
          else if [Precipitacao_mm] < 20 then "Chuva moderada"
          else "Chuva forte"
      ),
      #"Coluna Duplicada" = Table.DuplicateColumn(comClassificacao, "Classificacao_Chuva", "Classificacao_Chuva - Copiar"),
      #"Colunas Renomeadas" = Table.RenameColumns(#"Coluna Duplicada",{{"Classificacao_Chuva - Copiar", "Classificacao"}}),
      #"Valor Substituído" = Table.ReplaceValue(#"Colunas Renomeadas","Sem chuva","☀️",Replacer.ReplaceText,{"Classificacao"}),
      #"Valor Substituído1" = Table.ReplaceValue(#"Valor Substituído","Chuva fraca","🌧️",Replacer.ReplaceText,{"Classificacao"}),
      #"Valor Substituído2" = Table.ReplaceValue(#"Valor Substituído1","Chuva moderada","🌩️",Replacer.ReplaceText,{"Classificacao"}),
      #"Valor Substituído3" = Table.ReplaceValue(#"Valor Substituído2","Chuva forte","⛈️",Replacer.ReplaceText,{"Classificacao"}),
      #"Valor Substituído4" = Table.ReplaceValue(#"Valor Substituído3","Chuva fraca","Fraca",Replacer.ReplaceText,{"Classificacao_Chuva"}),
      #"Valor Substituído5" = Table.ReplaceValue(#"Valor Substituído4","Chuva moderada","Moderada",Replacer.ReplaceText,{"Classificacao_Chuva"}),
      #"Valor Substituído6" = Table.ReplaceValue(#"Valor Substituído5","Chuva forte","Forte",Replacer.ReplaceText,{"Classificacao_Chuva"}),
      #"Valor Substituído7" = Table.ReplaceValue(#"Valor Substituído6","🌧️","⛅",Replacer.ReplaceText,{"Classificacao"}),
      #"Valor Substituído8" = Table.ReplaceValue(#"Valor Substituído7","🌩️","🌧️",Replacer.ReplaceText,{"Classificacao"})
  in
      #"Valor Substituído8"
