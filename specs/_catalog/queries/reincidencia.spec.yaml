id: reincidencia
name: "REINCIDÊNCIA"
origin: "table:REINCIDÊNCIA"
source_type: odbc
datasource: dbVoalle
sql: |-
  WITH primeira_instalacao AS (
      SELECT
          cst.id AS service_tag_id,
          cst.service_tag,
          ai.protocol AS "Protocolo Instalação",
          it.title as "Tipo",
          p4.name AS cliente_nome,
          plis.created AS data_instalacao,
          ROW_NUMBER() OVER (PARTITION BY cst.id ORDER BY plis.created ASC) AS rn
      FROM patrimony_packing_list_items plis
      LEFT JOIN patrimony_packing_lists ppl ON ppl.id = plis.patrimony_packing_list_id
      LEFT JOIN assignments a ON a.id = ppl.assignment_id
      LEFT JOIN assignment_incidents ai ON ai.assignment_id = a.id
      LEFT JOIN incident_types it ON it.id = ai.incident_type_id
      LEFT JOIN people p4 ON p4.id = ppl.responsible_id
      LEFT JOIN contract_service_tags cst ON cst.id = ppl.contract_service_tag_id
      WHERE it.id IN ('12', '1014', '1254', '1255', '1136', '249', '275', '1011', '1015')
  ),
  primeiro_suporte AS (
      SELECT
          cst.id AS service_tag_id,
          ai.protocol,
          a.title AS titulo_protocolo,
          ai.beginning_service_date AS data_suporte,
          p.name AS cliente_nome,
          it.title AS protocol_type,
          ssc1.title AS categoria1,
          ssc2.title AS categoria2,
          ssc3.title AS categoria3,
          ssc4.title AS categoria4,
          ssc5.title AS categoria5,
          ss.title as solucao,
          ROW_NUMBER() OVER (PARTITION BY cst.id ORDER BY a.created ASC) AS rn
      FROM assignment_incidents ai
      LEFT JOIN assignments a ON a.id = ai.assignment_id
      LEFT JOIN contract_service_tags cst ON cst.id = ai.contract_service_tag_id 
      LEFT JOIN people p ON p.id = ai.client_id
      LEFT JOIN incident_status is2 ON is2.id = ai.incident_status_id
      LEFT JOIN catalog_services cs ON cs.id = ai.catalog_service_id
      LEFT JOIN teams t ON ai.team_id = t.id
      LEFT JOIN incident_types it ON it.id = ai.incident_type_id
      LEFT JOIN solicitation_category_matrices scm ON scm.id = ai.solicitation_category_matrix_id
      LEFT JOIN solicitation_service_categories ssc1 ON ssc1.id = scm.service_category_id_1
      LEFT JOIN solicitation_service_categories ssc2 ON ssc2.id = scm.service_category_id_2
      LEFT JOIN solicitation_service_categories ssc3 ON ssc3.id = scm.service_category_id_3
      LEFT JOIN solicitation_service_categories ssc4 ON ssc4.id = scm.service_category_id_4
      LEFT JOIN solicitation_service_categories ssc5 ON ssc5.id = scm.service_category_id_5
      left join solicitation_solutions ss on ss.id = ai.solicitation_solution_id 
      WHERE a.created >= '2026-01-01'
        AND (
          t.id IN ('1050', '65', '1065', '1064', '1063', '1062') OR
          cs.title IN ('Equipe tecnologia', 'Equipe reparo', 'Oper. Reparo', 'Oper. Tecnologia')
        )
        AND is2.title <> 'Cancelado'
  )
  SELECT
      pi."Protocolo Instalação",
      pi."Tipo",
      pi.service_tag,
      pi.cliente_nome,
      pi.data_instalacao,
      ps.data_suporte,
      ps.protocol,
      ps.protocol_type,
      ps.titulo_protocolo,
      ps.categoria1,
      ps.categoria2,
      ps.categoria3,
      ps.categoria4,
      ps.categoria5,
      ps.solucao,
      ps.data_suporte - pi.data_instalacao AS intervalo_suporte
  FROM primeira_instalacao pi
  JOIN primeiro_suporte ps ON ps.service_tag_id = pi.service_tag_id
  WHERE pi.rn = 1
    AND ps.rn = 1
    AND ps.data_suporte >= pi.data_instalacao
    AND ps.data_suporte <= pi.data_instalacao + INTERVAL '30 days'
  ORDER BY pi.data_instalacao DESC;
