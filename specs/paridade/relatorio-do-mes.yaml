# MANTIDO POR HUMANOS — gabarito de paridade.
#
# Abra a página no Power BI e escreva em `powerbi:` o número que aparece em cada
# card. `null` significa "ainda não conferido", e o programa diz isso em vez de
# fingir que passou.
#
# Quando o número DEVE dar diferente porque a gente decidiu assim, ponha o id da
# entrada de `specs/_catalog/divergencias.yaml` em `divergente:`. Aí bater vira
# falha — é o que impede uma divergência de ficar só no papel.
#
# AS SEIS MARCAS `divergente:` DESTE ARQUIVO foram derivadas, não escolhidas a dedo:
# são os cards cuja medida alcança `'CALENDARIO INSTALADO'[PESO]`, direta ou através de
# outra medida. O PESO mudou em 10/08/2026 (sábado e domingo passam a valer 0,5), então
# estes números TÊM de diferir do Power BI antigo.
#
# `#DIAS_ÚTEIS_TRABALHADOS` soma o PESO direto. `# BACKLOG` chega lá por dois saltos,
# via `# MEDIA INSTALADO BACKLOG`. Se algum deles acabar batendo com o Power BI, o
# harness acusa "deveria divergir e não diverge" — isso é um pedido de atenção, não
# necessariamente um bug: pode ser que a mudança de peso não mova aquele número
# específico depois do arredondamento.

pagina: relatorio-do-mes
conferido_em: null
por: null
tolerancia: 0.005

