# MANTIDO POR HUMANOS — gabarito de paridade.
#
# Abra a página no Power BI e escreva em `powerbi:` o número que aparece em cada
# card. `null` significa "ainda não conferido", e o programa diz isso em vez de
# fingir que passou.
#
# Quando o número DEVE dar diferente porque a gente decidiu assim, ponha o id da
# entrada de `specs/_catalog/divergencias.yaml` em `divergente:`. Aí bater vira
# falha — é o que impede uma divergência de ficar só no papel.

pagina: diario-instalacao
conferido_em: null
por: null
tolerancia: 0.005

cards:
  - visual: 05f793bc7a37cd6f4c05
    rotulo: "Hora mais recente"
    powerbi: null   # <-- o número que aparece na tela
  - visual: 0bb4d36b48b8c9a98010
    rotulo: "MÉDIA GERAL"
    powerbi: null   # <-- o número que aparece na tela
  - visual: 46d8ac88ac0e09adaaa0
    rotulo: "MÉDIA POR DIA"
    powerbi: null   # <-- o número que aparece na tela
  - visual: e51b24381944279c8bbe
    rotulo: "REALIZADOS"
    powerbi: null   # <-- o número que aparece na tela
  - visual: ea5c7143230acf5f95e9
    rotulo: "Data mais recente"
    powerbi: null   # <-- o número que aparece na tela
