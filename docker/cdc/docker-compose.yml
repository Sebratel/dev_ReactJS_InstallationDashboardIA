# Stack de CDC descartável — para validar o observador SEM tocar no Voalle.
#
# Não é infraestrutura de produção e não quer ser. É o mínimo que produz eventos
# Debezium de verdade, com o formato de envelope de verdade, para provar que
# `tools/cdc` funciona antes de alguém apontá-lo para o ERP.
#
#   docker compose -f docker/cdc/docker-compose.yml up -d
#   bash docker/cdc/registra-conector.sh
#   npm run cdc:observa -- --topicos='^voalle\.' --intervalo=15
#   bash docker/cdc/gera-mudancas.sh 200
#
# Derrubar tudo, inclusive os volumes:
#   docker compose -f docker/cdc/docker-compose.yml down -v
#
# ---------------------------------------------------------------------------
# O DETALHE QUE FAZ KAFKA EM DOCKER FUNCIONAR OU NÃO: dois listeners.
# ---------------------------------------------------------------------------
# O broker não devolve dado na conexão inicial — ele devolve o **endereço** em que
# o cliente deve falar com ele. Com um listener só, ou o Connect (dentro da rede)
# ou o Node (no Windows) recebe um endereço que não alcança, e trava sem erro claro.
#
#   INTERNAL://kafka:9093    é o que o Connect usa, dentro da rede do compose
#   EXTERNAL://localhost:9092 é o que o Node usa, do host
#
# É exatamente a armadilha que o Redis do Portainer mostra com `172.24.0.3`: IP de
# rede Docker não é alcançável de fora dela.

name: analytics-cdc

services:
  zookeeper:
    image: quay.io/debezium/zookeeper:2.7
    ports: ['2181:2181']
    # A imagem não tem `nc` — só o AdminServer HTTP (Jetty, porta 8080) responde ao
    # 4-letter word `ruok`. Medido em 18/08/2026: `echo ruok | nc ...` sempre falhava
    # com "nc: command not found", e o healthcheck ficava eternamente unhealthy —
    # travando `kafka`/`connect`, que dependem dele via `service_healthy`.
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8080/commands/ruok | grep -q "\"error\" : null"']
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: quay.io/debezium/kafka:2.7
    depends_on:
      zookeeper: { condition: service_healthy }
    ports: ['9092:9092']
    environment:
      ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ['CMD-SHELL', '/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9093 --list']
      interval: 10s
      timeout: 10s
      retries: 20

  # O Postgres de mentira. A imagem do Debezium já vem com `wal_level=logical` —
  # que no Voalle é justamente a mudança que exige restart do ERP.
  postgres:
    image: quay.io/debezium/example-postgres:2.7
    ports: ['55432:5432']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voalle_fake
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d voalle_fake']
      interval: 5s
      timeout: 5s
      retries: 20

  # Kafka Connect com o plugin Debezium. **É esta peça que lê o WAL** — Kafka
  # sozinho não captura nada, só transporta.
  connect:
    image: quay.io/debezium/connect:2.7
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    ports: ['8083:8083']
    environment:
      BOOTSTRAP_SERVERS: kafka:9093
      GROUP_ID: analytics-cdc-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8083/connectors || exit 1']
      interval: 10s
      timeout: 10s
      retries: 30
