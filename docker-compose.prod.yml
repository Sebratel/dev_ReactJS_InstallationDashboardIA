# Produção — arquivo SEPARADO do docker-compose.yml de desenvolvimento (que
# sobe infraestrutura de observação, não a aplicação). A tela NÃO é serviço
# próprio: a API já serve o build estático na mesma porta (docs/DEPLOY.md §3.2).
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api
#
# **`pull_policy: build` nos três serviços que saem do Dockerfile (22/09/2026,
# ACHADOS #148).** Sem ele, `up` sem `--build` reaproveita a imagem que houver —
# e a que havia era de 09/09. Ela rodou em 15, 16 e 22/09 regravando o snapshot
# com as specs de 09/09, em formato 1, por cima do formato 2 do host. Com isto o
# `up` sempre reconstrói (o cache de camada torna isso barato quando nada mudou).
#
# **O que isto NÃO cobre:** `restart: unless-stopped` religa o container com a
# imagem que ele já tem quando o Docker sobe no boot — não passa por `up`. Quem
# sobe esta stack numa estação de trabalho tem de derrubá-la (`down`) ao voltar
# a rodar a plataforma pelo `npm start`, senão são dois agendadores no mesmo
# `snapshot/` (DEPLOY.md §2.2).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # O último estágio do Dockerfile é o `cron`: sem `target`, este serviço
      # subia a imagem do cron e ficava reiniciando (medido em 25/09/2026).
      target: runtime
    pull_policy: build
    env_file:
      - .env
    # O CONTRATO DE MEMÓRIA, e os três números têm de andar juntos:
    #
    #   Dockerfile  --max-old-space-size=3072   heap do processo pai
    #   API_WORKER_HEAP_MB=768 × API_WORKERS=2  heap da piscina de DAX
    #   ------------------------------------------------------------
    #   4608 MB autorizados de heap
    #   mem_limit 6g -> 1536 MB de folga para o que NÃO é heap
    #                   (buffers do .jsonl.gz, runtime do Node, V8, pilhas)
    #
    # Medido em 04/09/2026 (`npm run probe:memoria-api`): as 10 páginas do menu
    # servem nesta faixa com RSS pico de 3137–3622 MB. O pai com 2048 MB estoura
    # na PRIMEIRA página, então 3072 não é folga — é piso.
    #
    # `backend/api/test/piscina-workers.test.ts` falha se alguém mexer num dos três
    # sem mexer nos outros. No Portainer, é `mem_limit` que aparece como o
    # "Memory limit" da stack — pedir menos que 6g é pedir OOM kill sob página
    # fria, e é falha que aparece como "às vezes a tela não abre".
    mem_limit: 6g
    environment:
      API_WORKERS: '2'
      API_WORKER_HEAP_MB: '768'
      # PORT declarada AQUI, não deixada para o .env — `environment:` vence
      # `env_file:`, e é isso que fecha a armadilha registrada em
      # docs/DEPLOY.md §3.5: o `.env.example` traz `PORT=3000` e o código sem
      # `PORT` usa 3100. Um `.env` de produção copiado do exemplo, com o
      # mapeamento e o Nginx em 3100, dava "502 sem motivo". Agora a porta que o
      # container escuta é a mesma que este arquivo mapeia, por construção — e
      # não por alguém ter conferido os dois no mesmo minuto.
      PORT: '3100'
      # NODE_ENV também AQUI, e por um defeito medido: o `Dockerfile` declara
      # `ENV NODE_ENV=production`, mas `env_file:` **sobrescreve o ENV da
      # imagem**. Medido dentro do container em 04/09/2026, com este mesmo
      # compose: `NODE_ENV=development`. A imagem se dizia produção e rodava em
      # modo de desenvolvimento — e todo comportamento condicionado a
      # `NODE_ENV === 'production'` ficava desligado, sem erro e sem log.
      NODE_ENV: production
      # Mata a API se o laço principal ficar parado 120 s, para o `restart` religar
      # (ACHADOS #157). Só aqui: no `npm start` ninguém religaria.
      VIGIA_TRAVAMENTO_S: '120'
      # DESLIGA o agendador que a API passou a ter dentro do processo em 19/09/2026
      # (backend/api/src/agendador.ts). AQUI, e só aqui — no host, `npm start` usa o
      # padrão, que é ligado, e é isso que tirou a tarefa do Agendador de Tarefas do
      # Windows do caminho.
      #
      # **Por que produção continua com o container `refresh` separado.** Não é
      # conservadorismo: é o `mem_limit` deste mesmo serviço. A API tem teto de 6g,
      # dimensionado com medição (`npm run probe:memoria-api`, RSS de pico 3137-3622 MB
      # nas 10 páginas do menu). Uma materialização dispara um filho com
      # `--max-old-space-size=8192`, e `protocolos-geral` já precisou de 12 GB. Esse
      # filho nasceria DENTRO do cgroup do container `api`, e o OOM killer levaria a
      # tela junto com a carga — trocar refresh atrasado por tela fora do ar.
      #
      # **E dois agendadores não podem coexistir**, que é a razão de isto ser
      # obrigatório e não uma preferência: os dois fariam read-modify-write no mesmo
      # `manifesto.json`, e um apagaria as tabelas que o outro acabou de registrar,
      # sem erro nenhum (ver o topo de backend/tools/refresh/src/tick.ts).
      AUTO_REFRESH: 'false'
      # Na rede interna do compose o serviço redis chama-se 'redis', não localhost.
      # A senha é a mesma REDIS_PASSWORD que autentica o container `redis` logo
      # abaixo (--requirepass) — as duas variam juntas, nunca uma sem a outra.
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}@redis:6379/0
    volumes:
      # O snapshot é dado de cliente (CPF/RG/endereço, ~371 MB) — nunca entra
      # na imagem. Aponte SNAPSHOT_DIR_HOST para onde o refresh agendado
      # (docs/DEPLOY.md §2.2) materializa no host.
      - ${SNAPSHOT_DIR_HOST:-./snapshot}:/repo/snapshot
    ports:
      # A porta do HOST é variável porque 3100 pode já estar ocupada — foi o
      # caso na primeira subida local (uma instância de `npm start` do próprio
      # projeto escutando ali). `API_PORT_HOST=3101 docker compose up` sobe a
      # stack sem matar nada. Dentro da rede do compose o Nginx continua
      # falando com `api:3100`, então mudar isto não afeta o proxy.
      #
      # Em produção, considere NÃO publicar esta porta: com o Nginx na frente,
      # publicá-la é uma entrada que não passa pelo proxy (nem pelo TLS, quando
      # existir). Fica publicada hoje porque é o que permite diagnosticar a API
      # sem o proxy no caminho.
      - '${API_PORT_HOST:-3100}:3100'
    depends_on:
      - redis
    # PID 1 é o `tini`, não o Node: o Linux não entrega ao PID 1 sinal sem tratador, e
    # sem isto o `docker stop` esperava 10 s e matava (ACHADOS #157).
    init: true
    # Explícito: o Compose v5.1.3 desta estação criava os contêineres com StopTimeout=1,
    # e o `docker stop` matava com SIGKILL no meio do desligamento (ACHADOS #157). 15 s
    # fica acima do teto de 8 s de `backend/api/src/desligamento.ts`.
    stop_grace_period: 15s
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3100/api/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sem teto o Redis cresce até o host faltar memória — `api` e `refresh` neste
    # mesmo arquivo têm `mem_limit` explícito, e este serviço não tinha nenhum.
    # 256mb é chute conservador, NÃO medição (não há `INFO memory` de produção
    # ainda) — ajuste depois de observar o uso real. `allkeys-lru` porque toda
    # chave que este projeto grava já sai com TTL (`Cache.set` recusa
    # `ttlSeconds<=0`, ver backend/packages/query-engine/src/cache-redis.ts): expulsar a
    # menos usada antes do TTL vencer é a mesma degradação que o disjuntor já
    # assume em outro lugar — cache que perde entrada não é cache que erra.
    # `requirepass` é EXIGIDO (sem default): sem porta publicada o Redis já não
    # é alcançável de fora, mas fica aberto para qualquer container que entrar
    # nesta mesma rede depois — e o que se guarda aqui é resposta calculada
    # sobre dado de cliente (CPF/RG/endereço, ver o comentário do volume do
    # snapshot no serviço `api`). `up` falhando por falta de REDIS_PASSWORD é a
    # mesma regra de `backend/api/src/portao-login.ts`: falha fechada, não em
    # silêncio.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    mem_limit: 512m
    volumes:
      - redis-dados:/data

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '80:80'
    # TLS é decisão de infraestrutura, fora deste repositório
    # (docs/DEPLOY.md §3.3) — descomente e monte o certificado quando existir.
    # - '443:443'
    restart: unless-stopped

  # Agendador Automático do Refresh Manager — materializa e atualiza o snapshot
  # periodicamente de 15 em 15 minutos em background (backend/specs/_catalog/refresh.yaml),
  # alimentando o volume compartilhado que a API lê, sem requerer crontab manual no host.
  refresh:
    build:
      context: .
      dockerfile: Dockerfile
      # O último estágio do Dockerfile é o `cron`: sem `target`, este serviço
      # subia a imagem do cron e ficava reiniciando (medido em 25/09/2026).
      target: runtime
    pull_policy: build
    env_file:
      - .env
    # Medido em 25/09/2026 (ACHADOS #153/#154): o contêiner inteiro chegou a 3,87 GB no
    # ciclo com as três cargas completas. O contrato é o mesmo da `api`: heap do filho
    # (REFRESH_MEMORIA_MB) + heap do pai (--max-old-space-size do `command`) + folga
    # de não-heap cabem no teto. Antes eram 8192 de heap num teto de 8g — zero folga,
    # e quem matava era o cgroup, sem mensagem.
    mem_limit: 6g
    environment:
      NODE_ENV: production
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-sa.json
      REFRESH_INTERVAL_MINUTOS: '15'
      REFRESH_MEMORIA_MB: '4096'
    volumes:
      - ${SNAPSHOT_DIR_HOST:-./snapshot}:/repo/snapshot
      # Credencial Google só-leitura: o `.env` traz o caminho do HOST, que não existe no
      # contêiner (ACHADOS #153). GOOGLE_CREDENCIAL_HOST = esse caminho, no servidor.
      - ${GOOGLE_CREDENCIAL_HOST:?defina GOOGLE_CREDENCIAL_HOST no .env - caminho no host do JSON da service account Google}:/run/secrets/google-sa.json:ro
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "--max-old-space-size=1024", "backend/tools/refresh/src/daemon.ts"]
    # PID 1 é o `tini`, não o Node: o Linux não entrega ao PID 1 sinal sem tratador, e
    # sem isto o `docker stop` esperava 10 s e matava (ACHADOS #157).
    init: true
    # Explícito: o Compose v5.1.3 desta estação criava os contêineres com StopTimeout=1,
    # e o `docker stop` matava com SIGKILL no meio do desligamento (ACHADOS #157). 15 s
    # fica acima do teto de 8 s de `backend/api/src/desligamento.ts`.
    stop_grace_period: 15s
    restart: unless-stopped

  # Snapshot diário COMPLETO — cron dentro do container, às 3h de Brasília (06:00 UTC; docker/cron/
  # crontab-snapshot-diario), separado da cadência de minutos do `refresh`
  # acima. Corrige alteração retroativa que a carga incremental não vê, e
  # materializa o catálogo inteiro (desde 02/10, com protocolos-produtividade; ver o
  # comentário do crontab).
  #
  # mem_limit 6g com --memoria=4096 no crontab: a mesma carga do `refresh` acima,
  # medida em 25/09/2026 (ACHADOS #154). Os 14g de antes vinham de "protocolos-geral
  # precisa de 12 GB", que caiu em 09/09 (af82774). Cada query roda em subprocesso
  # próprio e em série, então o pico é de UMA query por vez, nunca a soma de todas.
  snapshot-diario:
    build:
      context: .
      dockerfile: Dockerfile
      target: cron
    pull_policy: build
    env_file:
      - .env
    mem_limit: 6g
    environment:
      NODE_ENV: production
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-sa.json
    volumes:
      - ${SNAPSHOT_DIR_HOST:-./snapshot}:/repo/snapshot
      # Credencial Google só-leitura: o `.env` traz o caminho do HOST, que não existe no
      # contêiner (ACHADOS #153). GOOGLE_CREDENCIAL_HOST = esse caminho, no servidor.
      - ${GOOGLE_CREDENCIAL_HOST:?defina GOOGLE_CREDENCIAL_HOST no .env - caminho no host do JSON da service account Google}:/run/secrets/google-sa.json:ro
    depends_on:
      api:
        condition: service_healthy
    # PID 1 é o `tini`, não o Node: o Linux não entrega ao PID 1 sinal sem tratador, e
    # sem isto o `docker stop` esperava 10 s e matava (ACHADOS #157).
    init: true
    # Explícito: o Compose v5.1.3 desta estação criava os contêineres com StopTimeout=1,
    # e o `docker stop` matava com SIGKILL no meio do desligamento (ACHADOS #157). 15 s
    # fica acima do teto de 8 s de `backend/api/src/desligamento.ts`.
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  redis-dados:
