# Produção — arquivo SEPARADO do docker-compose.yml de desenvolvimento (que
# sobe infraestrutura de observação, não a aplicação). A tela NÃO é serviço
# próprio: a API já serve o build estático na mesma porta (docs/DEPLOY.md §3.2).
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api
#
# **`pull_policy: build` nos três serviços que saem do Dockerfile (22/09/2026,
# ACHADOS #148).** Sem ele, `up` sem `--build` reaproveita a imagem que houver —
# e a que havia era de 09/09. Ela rodou em 15, 16 e 22/09 regravando o snapshot
# com as specs de 09/09, em formato 1, por cima do formato 2 do host. Com isto o
# `up` sempre reconstrói (o cache de camada torna isso barato quando nada mudou).
#
# **O que isto NÃO cobre:** `restart: unless-stopped` religa o container com a
# imagem que ele já tem quando o Docker sobe no boot — não passa por `up`. Quem
# sobe esta stack numa estação de trabalho tem de derrubá-la (`down`) ao voltar
# a rodar a plataforma pelo `npm start`, senão são dois agendadores no mesmo
# `snapshot/` (DEPLOY.md §2.2).

# O login da tela entra no BUILD (o Vite embute a config no bundle), não no runtime — ver o
# `ARG` do estágio `build` no Dockerfile (PLANO-CARGA 3.1). Falha fechada como o
# variáveis obrigatórias: sem elas no `.env`, o `up` erra alto em vez de gerar outra imagem
# sem login, em silêncio. As três imagens recebem os mesmos valores para dividir o cache
# do estágio `build`.
x-args-da-tela: &args-da-tela
  VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?defina VITE_FIREBASE_API_KEY no .env - sem ela a tela sai sem login}
  VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?defina VITE_FIREBASE_AUTH_DOMAIN no .env}
  VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?defina VITE_FIREBASE_PROJECT_ID no .env}
  VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?defina VITE_FIREBASE_APP_ID no .env}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args: *args-da-tela
      # O último estágio do Dockerfile é o `cron`: sem `target`, este serviço
      # subia a imagem do cron e ficava reiniciando (medido em 25/09/2026).
      target: runtime
    pull_policy: build
    env_file:
      - .env
    # O CONTRATO DE MEMÓRIA, e os três números têm de andar juntos:
    #
    #   Dockerfile  --max-old-space-size=1536   heap do processo pai
    #   API_WORKER_HEAP_MB=512 × API_WORKERS=2  heap da piscina de DAX
    #   ------------------------------------------------------------
    #   2560 MB autorizados de heap
    #   mem_limit 3g -> 512 MB de folga para buffers, runtime, V8 e pilhas.
    #
    # Medido em 16/10/2026 no cgroup de 3 GB: o aquecimento completo ficou em
    # 1608 MB de RSS; 200 aberturas simultâneas passaram (p95 3,82 s na primeira
    # rajada e 256 ms com cache quente), com RSS pico de 1827 MB e sem OOM.
    #
    # `backend/api/test/piscina-workers.test.ts` falha se alguém mexer num dos três
    # sem mexer nos outros. No Portainer, é `mem_limit` que aparece como o
    # "Memory limit" da stack. Esta é a configuração validada pela sonda; mudar
    # qualquer um dos três números exige repetir a medição no cgroup.
    mem_limit: 3g
    environment:
      API_WORKERS: '2'
      API_WORKER_HEAP_MB: '512'
      # PORT declarada AQUI, não deixada para o .env — `environment:` vence
      # `env_file:`, e é isso que fecha a armadilha registrada em
      # docs/DEPLOY.md §3.5: o `.env.example` traz `PORT=3000` e o código sem
      # `PORT` usa 3100. Um `.env` de produção copiado do exemplo, com o
      # mapeamento da infraestrutura externa em 3100, dava "502 sem motivo". Agora a porta que o
      # container escuta é a mesma que este arquivo mapeia, por construção — e
      # não por alguém ter conferido os dois no mesmo minuto.
      PORT: '3100'
      # NODE_ENV também AQUI, e por um defeito medido: o `Dockerfile` declara
      # `ENV NODE_ENV=production`, mas `env_file:` **sobrescreve o ENV da
      # imagem**. Medido dentro do container em 04/09/2026, com este mesmo
      # compose: `NODE_ENV=development`. A imagem se dizia produção e rodava em
      # modo de desenvolvimento — e todo comportamento condicionado a
      # `NODE_ENV === 'production'` ficava desligado, sem erro e sem log.
      NODE_ENV: production
      # Mata a API se o laço principal ficar parado 120 s, para o `restart` religar
      # (ACHADOS #157). Só aqui: no `npm start` ninguém religaria.
      VIGIA_TRAVAMENTO_S: '120'
      # DESLIGA o agendador que a API passou a ter dentro do processo em 19/09/2026
      # (backend/api/src/agendador.ts). AQUI, e só aqui — no host, `npm start` usa o
      # padrão, que é ligado, e é isso que tirou a tarefa do Agendador de Tarefas do
      # Windows do caminho.
      #
      # **Por que produção continua com o container `refresh` separado.** Não é
      # conservadorismo: é o `mem_limit` deste mesmo serviço. A API tem teto de 3g,
      # validado em 200 aberturas simultâneas. Uma materialização dispara um filho separado. Esse
      # filho nasceria DENTRO do cgroup do container `api`, e o OOM killer levaria a
      # tela junto com a carga — trocar refresh atrasado por tela fora do ar.
      #
      # **E dois agendadores não podem coexistir**, que é a razão de isto ser
      # obrigatório e não uma preferência: os dois fariam read-modify-write no mesmo
      # `manifesto.json`, e um apagaria as tabelas que o outro acabou de registrar,
      # sem erro nenhum (ver o topo de backend/tools/refresh/src/tick.ts).
      AUTO_REFRESH: 'false'
      # Quem é quem em `pg_stat_activity` no Voalle (PLANO-CARGA 1.5): sem isto as três
      # pontas saíam como `analytics-platform`, e o custo de banco não tinha dono. Na API,
      # quem conecta é o poller de quase-realtime.
      VOALLE_APPLICATION_NAME: analytics-api-poller
      # O proxy é infraestrutura externa. Só confie no X-Real-IP quando ele estiver
      # configurado para sobrescrever esse header antes de chegar nesta API.
      CONFIA_PROXY: ${CONFIA_PROXY:-0}
      # Resultado calculado pode ser recriado do snapshot; 256 MB é um teto global,
      # repartido entre as workers, e mantém as rolagens já abertas rápidas.
      CACHE_VISUAL_MB: '256'
    volumes:
      # O snapshot é dado de cliente (CPF/RG/endereço, ~371 MB) — nunca entra
      # na imagem. Aponte SNAPSHOT_DIR_HOST para onde o refresh agendado
      # (docs/DEPLOY.md §2.2) materializa no host.
      - ${SNAPSHOT_DIR_HOST:-./snapshot}:/repo/snapshot
    ports:
      # O proxy externo do Misael aponta para esta porta. O bind continua local por
      # padrão para não expor a API sem TLS ou sem reescrever X-Real-IP.
      - '${API_BIND_HOST:-127.0.0.1}:${API_PORT_HOST:-3100}:3100'
    # PID 1 é o `tini`, não o Node: o Linux não entrega ao PID 1 sinal sem tratador, e
    # sem isto o `docker stop` esperava 10 s e matava (ACHADOS #157).
    init: true
    # Explícito: o Compose v5.1.3 desta estação criava os contêineres com StopTimeout=1,
    # e o `docker stop` matava com SIGKILL no meio do desligamento (ACHADOS #157). 15 s
    # fica acima do teto de 8 s de `backend/api/src/desligamento.ts`.
    stop_grace_period: 15s
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3100/api/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Agendador Automático do Refresh Manager — materializa e atualiza o snapshot
  # periodicamente de 15 em 15 minutos em background (backend/specs/_catalog/refresh.yaml),
  # alimentando o volume compartilhado que a API lê, sem requerer crontab manual no host.
  refresh:
    build:
      context: .
      dockerfile: Dockerfile
      args: *args-da-tela
      # O último estágio do Dockerfile é o `cron`: sem `target`, este serviço
      # subia a imagem do cron e ficava reiniciando (medido em 25/09/2026).
      target: runtime
    pull_policy: build
    env_file:
      - .env
    # Medido em 15/10/2026: `protocolos-geral` concluiu com heap de 1400 MB; o
    # cgroup alcançou 1234 MiB com a linha compacta do motor M. O cgroup separado
    # protege a API de OOM durante a carga, mas não transforma um host inteiro de
    # 3 GB em capacidade suficiente: valide a concorrência API + refresh no host.
    mem_limit: 1450m
    # A trava do snapshot usa hostname + PID. Mantê-lo estável permite ao
    # contêiner substituto reconhecer imediatamente um PID morto de deploy.
    hostname: dashboard-instalacao-refresh
    environment:
      NODE_ENV: production
      REFRESH_INTERVAL_MINUTOS: '15'
      REFRESH_MEMORIA_MB: '1400'
      # Uma conexão de fonte pendurada não segura a fila para sempre: o daemon
      # mata o grupo após 30 min, registra falha transitória e tenta novamente.
      REFRESH_TEMPO_MAXIMO_MINUTOS: '30'
      VOALLE_APPLICATION_NAME: analytics-refresh
    volumes:
      - ${SNAPSHOT_DIR_HOST:-./snapshot}:/repo/snapshot
      # A credencial do Google SAIU em 14/10/2026 (ACHADOS #209): nenhuma query lê mais
      # planilha — o n8n copia as três para o DB_InstallationDashboard a cada 15 min.
    depends_on:
      api:
        condition: service_healthy
    # Um relógio por grupo: se uma carga média ficar pendurada, `quente` continua
    # entrando na fila e a retomada de suspensão aborta o filho congelado.
    command: ["node", "--max-old-space-size=1024", "backend/tools/refresh/src/daemon.ts", "--por-grupo"]
    # PID 1 é o `tini`, não o Node: o Linux não entrega ao PID 1 sinal sem tratador, e
    # sem isto o `docker stop` esperava 10 s e matava (ACHADOS #157).
    init: true
    # Explícito: o Compose v5.1.3 desta estação criava os contêineres com StopTimeout=1,
    # e o `docker stop` matava com SIGKILL no meio do desligamento (ACHADOS #157). 15 s
    # fica acima do teto de 8 s de `backend/api/src/desligamento.ts`.
    stop_grace_period: 15s
    restart: unless-stopped

  # Snapshot diário COMPLETO — cron dentro do container, às 3h de Brasília (06:00 UTC; docker/cron/
  # crontab-snapshot-diario), separado da cadência de minutos do `refresh`
  # acima. Corrige alteração retroativa que a carga incremental não vê, e
  # materializa o catálogo inteiro (desde 02/10, com protocolos-produtividade; ver o
  # comentário do crontab).
  #
  # Mesmo teto de 1450m e heap de 1400 MB do `refresh`: os dois compartilham a
  # trava do snapshot, portanto uma materialização pesada nunca sobrepõe a outra.
  snapshot-diario:
    build:
      context: .
      dockerfile: Dockerfile
      args: *args-da-tela
      target: cron
    pull_policy: build
    env_file:
      - .env
    mem_limit: 1450m
    environment:
      NODE_ENV: production
      # Chega ao job pelo `/repo/.env.cron` que o entrypoint grava (docker/cron/entrypoint.sh).
      VOALLE_APPLICATION_NAME: analytics-snapshot-diario
    volumes:
      - ${SNAPSHOT_DIR_HOST:-./snapshot}:/repo/snapshot
      # A credencial do Google SAIU em 14/10/2026 (ACHADOS #209): nenhuma query lê mais
      # planilha — o n8n copia as três para o DB_InstallationDashboard a cada 15 min.
    depends_on:
      api:
        condition: service_healthy
    # PID 1 é o `tini`, não o Node: o Linux não entrega ao PID 1 sinal sem tratador, e
    # sem isto o `docker stop` esperava 10 s e matava (ACHADOS #157).
    init: true
    # Explícito: o Compose v5.1.3 desta estação criava os contêineres com StopTimeout=1,
    # e o `docker stop` matava com SIGKILL no meio do desligamento (ACHADOS #157). 15 s
    # fica acima do teto de 8 s de `backend/api/src/desligamento.ts`.
    stop_grace_period: 15s
    restart: unless-stopped
