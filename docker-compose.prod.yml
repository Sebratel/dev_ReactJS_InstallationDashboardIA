# Produção — arquivo SEPARADO do docker-compose.yml de desenvolvimento (que
# sobe infraestrutura de observação, não a aplicação). A tela roda no serviço
# `web`, separado da API, e é a única porta publicada no host.
#
# **Publicação direta, só contêineres (19/10/2026).** O serviço `web` publica a tela no
# host, sem proxy TLS dentro desta stack, como as outras stacks da Sebratel no Portainer.
# A API permanece privada na rede Docker. Passo a passo em docs/PORTAINER.md.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api
#
# **`pull_policy: build` nos três serviços que saem do Dockerfile (22/09/2026,
# ACHADOS #148).** Sem ele, `up` sem `--build` reaproveita a imagem que houver —
# e a que havia era de 09/09. Ela rodou em 15, 16 e 22/09 regravando o snapshot
# com as specs de 09/09, em formato 1, por cima do formato 2 do host. Com isto o
# `up` sempre reconstrói (o cache de camada torna isso barato quando nada mudou).
#
# **O que isto NÃO cobre:** `restart: unless-stopped` religa o container com a
# imagem que ele já tem quando o Docker sobe no boot — não passa por `up`. Quem
# sobe esta stack numa estação de trabalho tem de derrubá-la (`down`) ao voltar
# a rodar a plataforma pelo `npm start`, senão são dois agendadores no mesmo
# `snapshot/` (DEPLOY.md §2.2).

# O login da tela entra no BUILD (o Vite embute a config no bundle), não no runtime — ver o
# `ARG` do estágio `build` no Dockerfile (PLANO-CARGA 3.1). Falha fechada como o
# variáveis obrigatórias: sem elas no `.env`, o `up` erra alto em vez de gerar outra imagem
# sem login, em silêncio. As três imagens recebem os mesmos valores para dividir o cache
# do estágio `build`.
x-args-da-tela: &args-da-tela
  VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?defina VITE_FIREBASE_API_KEY no .env - sem ela a tela sai sem login}
  VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?defina VITE_FIREBASE_AUTH_DOMAIN no .env}
  VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?defina VITE_FIREBASE_PROJECT_ID no .env}
  VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?defina VITE_FIREBASE_APP_ID no .env}

# Log com teto, como no dashboard Comercial: o `refresh` escreve o dia todo, e o
# json-file sem limite enche o disco do host do Portainer em silêncio.
x-logs: &logs
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args: *args-da-tela
      # Explícito: enquanto o último estágio do Dockerfile era o `cron` (até 17/10/2026),
      # sem `target` este serviço subia a imagem do cron e ficava reiniciando (25/09/2026).
      target: runtime
    pull_policy: build
    # O CONTRATO DE MEMÓRIA, e os três números têm de andar juntos:
    #
    #   Dockerfile  --max-old-space-size=1024   heap do processo pai
    #   API_WORKER_HEAP_MB=512 × API_WORKERS=2  heap da piscina de DAX
    #   ------------------------------------------------------------
    #   2048 MB autorizados de heap
    #   mem_limit 2304m -> 256 MB de folga para buffers, runtime, V8 e pilhas (a mesma
    #   margem que sobrou no pico medido com uma worker: 1600 - 1344).
    #
    # **Duas workers desde 20/10/2026, e o motivo é o clique, não a vazão.** A piscina
    # guarda sempre uma worker para quem está usando (ACHADOS #163: um clique esperou
    # 17,6 s atrás de um aquecimento) — mas com uma worker só não há reserva, porque o
    # fundo nunca rodaria (`piscina-workers.ts`, `processaFila`). De 18 a 20/10 a stack
    # rodou com uma: cada refresh reaquecia até 13 páginas por baixo e o clique numa
    # combinação de filtro ainda não calculada esperava o aquecimento em curso. O Erick
    # mediu como "filtros demorando" no staging.
    #
    # Orçamento: a stack não passa de 3 GB contínuos (decisão do Erick, 20/10/2026).
    # Medido em 18/10 com uma worker: pico de cgroup de 1344,2 MiB (200 usuários). O pai
    # usa 34-42 MB de heap; a segunda worker soma até 512 MB. Com web 128m e redis 384m,
    # o contínuo fica perto de 2,5 GB (com o cache de 256 MB e o Redis cheios); o pico
    # do `refresh` é tratado lá.
    #
    # `backend/api/test/piscina-workers.test.ts` falha se alguém mexer num dos três
    # sem mexer nos outros. No Portainer, é `mem_limit` que aparece como o
    # "Memory limit" da stack. A sonda (`npm run probe:memoria-api`) ainda não rodou
    # com duas workers dentro do cgroup — o RSS real fica para conferir no staging.
    mem_limit: 2304m
    environment:
      # No Portainer, os segredos vivem nas variáveis da stack; não há `.env` no
      # repositório nem arquivo secreto para copiar ao host. Localmente, o Compose
      # lê o `.env` ignorado e preenche estas mesmas substituições.
      VOALLE_HOST: ${VOALLE_HOST:-}
      VOALLE_DATABASE: ${VOALLE_DATABASE:-}
      VOALLE_USER: ${VOALLE_USER:-}
      VOALLE_PASSWORD: ${VOALLE_PASSWORD:-}
      # Bancos SEM TLS, como o dashboard Comercial e as outras stacks (decisão do Misael,
      # 19/10/2026). Os dois servidores apresentam certificado autoassinado (ACHADOS #232).
      # Religar TLS é só voltar `*_SSL` para '1' — `config.ts` continua lendo as variáveis.
      VOALLE_SSL: '0'
      # A API usa a mesma conta MARIA_* do refresh. O banco de acessos é outro.
      MARIA_HOST: ${MARIA_HOST:-}
      MARIA_PORT: ${MARIA_PORT:-3306}
      MARIA_USER: ${MARIA_USER:-}
      MARIA_PASSWORD: ${MARIA_PASSWORD:-}
      ACESSO_DB_DATABASE: ${ACESSO_DB_DATABASE:-DB_InstallationDashboard}
      MARIA_SSL: '0'
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # O navegador fala HTTP com o contêiner `web` (nginx), que repassa à API; a API não
      # tem porta publicada. Os três andam juntos e a API recusa subir se discordarem
      # (`configuracao-producao.ts`): cookie `Secure` em HTTP não volta do navegador (login
      # em laço), e o `X-Real-IP` que o `web` sobrescreve é o único jeito de a API ver o
      # usuário — sem ele, todos chegam do IP do `web` e dividem um balde de rate limit.
      # Fixados aqui, e não nas variáveis da stack, para ninguém os trocar pela tela.
      PUBLICACAO: web-http
      COOKIE_SECURE: '0'
      API_WORKERS: '2'
      API_WORKER_HEAP_MB: '512'
      # PORT declarada AQUI, não deixada para o .env — `environment:` vence
      # `env_file:`, e é isso que fecha a armadilha registrada em
      # docs/DEPLOY.md §3.5: o `.env.example` traz `PORT=3000` e o código sem
      # `PORT` usa 3100. Um `.env` de produção copiado do exemplo, com o
      # mapeamento da infraestrutura externa em 3100, dava "502 sem motivo". Agora a porta que o
      # container escuta é a mesma que este arquivo mapeia, por construção — e
      # não por alguém ter conferido os dois no mesmo minuto.
      PORT: '3100'
      # NODE_ENV também AQUI, e por um defeito medido: o `Dockerfile` declara
      # `ENV NODE_ENV=production`, mas `env_file:` **sobrescreve o ENV da
      # imagem**. Medido dentro do container em 04/09/2026, com este mesmo
      # compose: `NODE_ENV=development`. A imagem se dizia produção e rodava em
      # modo de desenvolvimento — e todo comportamento condicionado a
      # `NODE_ENV === 'production'` ficava desligado, sem erro e sem log.
      NODE_ENV: production
      # Produção nunca herda o atalho do ambiente local. Mesmo que alguém
      # cadastre SEM_LOGIN=1 por engano nas variáveis do Portainer, este valor
      # declarado pelo serviço prevalece e mantém a autenticação Firebase ativa.
      # O único bypass permitido fica no overlay docker-compose.local.yml.
      SEM_LOGIN: '0'
      # Mata a API se o laço principal ficar parado 120 s, para o `restart` religar
      # (ACHADOS #157). Só aqui: no `npm start` ninguém religaria.
      VIGIA_TRAVAMENTO_S: '120'
      # DESLIGA o agendador que a API passou a ter dentro do processo em 19/09/2026
      # (backend/api/src/agendador.ts). AQUI, e só aqui — no host, `npm start` usa o
      # padrão, que é ligado, e é isso que tirou a tarefa do Agendador de Tarefas do
      # Windows do caminho.
      #
      # **Por que produção continua com o container `refresh` separado.** Não é
      # conservadorismo: a API tem teto próprio. Uma materialização dispara um filho separado. Esse
      # filho nasceria DENTRO do cgroup do container `api`, e o OOM killer levaria a
      # tela junto com a carga — trocar refresh atrasado por tela fora do ar.
      #
      # **E dois agendadores não podem coexistir**, que é a razão de isto ser
      # obrigatório e não uma preferência: os dois fariam read-modify-write no mesmo
      # `manifesto.json`, e um apagaria as tabelas que o outro acabou de registrar,
      # sem erro nenhum (ver o topo de backend/tools/refresh/src/tick.ts).
      AUTO_REFRESH: 'false'
      # Quem é quem em `pg_stat_activity` no Voalle (PLANO-CARGA 1.5): sem isto as três
      # pontas saíam como `analytics-platform`, e o custo de banco não tinha dono. Na API,
      # quem conecta é o poller de quase-realtime.
      VOALLE_APPLICATION_NAME: analytics-api-poller
      # A chave do rate limit é o `X-Real-IP` que o `web` escreve com `$remote_addr`
      # (`nginx.web.conf`, em toda location que repassa). Seguro só porque a API não tem
      # porta publicada: ninguém de fora fala com ela sem passar pelo `web`.
      CONFIA_PROXY: '1'
      # Diagnóstico da API não pode tornar o snapshot gravável.
      API_RUNTIME_DIR: /repo/runtime
      # Resultado calculado pode ser recriado do snapshot; teto global, repartido entre as
      # workers. 256 -> 128 em 17/10/2026 (ACHADOS #231): produção usava 49 MB. Lado ruim
      # quando morde: rolar de volta numa tabela grande recalcula a janela.
      CACHE_VISUAL_MB: '128'
      # Camada em memória do cache de respostas, no processo principal. 256 (padrão) -> 64
      # em 17/10/2026 (#231): produção usava 79 MB, e o que sai daqui volta do Redis em
      # milissegundos. Lado ruim: com o Redis fora do ar, o despejado é RECALCULADO.
      # 20/10/2026: 64 -> 256 MB junto com `AQUECE_FILTROS_ATE`. Cada valor de filtro
      # pré-calculado é uma resposta guardada (mais os visuais `sobDemanda` dela); com
      # 64 MB o LRU expulsava o pré-cálculo antes do clique. O pai usa 34-42 MB de heap
      # e tem teto de 1024 — 256 é o teto de `TETO_RESPOSTA_PADRAO_MB`.
      CACHE_RESPOSTA_MB: '256'
      # Pré-calcula cada valor dos filtros de até 40 valores, depois de cada carga
      # (ACHADOS #163). Estava desligado desde 14/10 por OOM — com o heap da piscina sem
      # teto. Agora a worker tem 512 MB, o fundo usa no máximo uma das duas e o clique
      # tem a outra. Religado a pedido do Erick ("tudo pré-carregado"); conferir o RSS da
      # `api` no Portainer depois do deploy.
      AQUECE_FILTROS_ATE: '40'
      # glibc abre até 8 arenas de malloc por núcleo, e cada thread (principal, 1 worker,
      # libuv, V8) segura memória devolvida na sua. 2 arenas: menos RSS preso, contenção
      # desprezível com 3 threads de JS. Afeta só o que é malloc (zlib do .jsonl.gz,
      # buffers), não o heap do V8. Ganho NÃO medido ainda (#231).
      MALLOC_ARENA_MAX: '2'
      # Redis DESTA stack (serviço `redis` abaixo), atrás do cache em memória: o que o
      # teto de `CACHE_RESPOSTA_MB` despeja volta daqui em vez de ser recalculado, e o
      # cache sobrevive ao restart da api. Decisão do Erick em 16/10/2026, no mesmo padrão
      # do antifraude (Redis próprio na stack). A senha vem do `.env`; use só [0-9a-f]
      # (`openssl rand -hex 24`), porque ela vai crua dentro da URL.
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD nas variaveis da stack}@redis:6379/0
    volumes:
      # O snapshot é dado de cliente (CPF/RG/endereço, ~371 MB) — nunca entra
      # na imagem. Aponte SNAPSHOT_DIR_HOST para onde o refresh agendado
      # (docs/DEPLOY.md §2.2) materializa no host.
      - ${SNAPSHOT_DIR_HOST:-./snapshot}:/repo/snapshot:ro
      - api-runtime:/repo/runtime
    # PID 1 é o `tini`, não o Node: o Linux não entrega ao PID 1 sinal sem tratador, e
    # sem isto o `docker stop` esperava 10 s e matava (ACHADOS #157).
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    # Explícito: o Compose v5.1.3 desta estação criava os contêineres com StopTimeout=1,
    # e o `docker stop` matava com SIGKILL no meio do desligamento (ACHADOS #157). 15 s
    # fica acima do teto de 8 s de `backend/api/src/desligamento.ts`.
    stop_grace_period: 15s
    restart: unless-stopped
    logging: *logs

    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3100/api/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # A única porta publicada: entrega o React e encaminha /api e /auth para a
  # API privada na rede Docker. A publicação direta segue o padrão do Comercial.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args: *args-da-tela
      target: web
    pull_policy: build
    # A tela tem teto explícito para o Portainer não herdar toda a memória do host.
    # Era 3g, herdado do serviço público de antes da separação web/API — mas aqui só
    # roda nginx (estático + proxy), que usa poucos MB. 128m devolve ~2,9 GB ao
    # orçamento de 3 GB contínuos da stack (20/10/2026).
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT_HOST:-3101}:8080'
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    restart: unless-stopped
    logging: *logs
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Agendador Automático do Refresh Manager — materializa e atualiza o snapshot
  # periodicamente de 15 em 15 minutos em background (backend/specs/_catalog/refresh.yaml),
  # alimentando o volume compartilhado que a API lê, sem requerer crontab manual no host.
  refresh:
    build:
      context: .
      dockerfile: Dockerfile
      args: *args-da-tela
      # Explícito: enquanto o último estágio do Dockerfile era o `cron` (até 17/10/2026),
      # sem `target` este serviço subia a imagem do cron e ficava reiniciando (25/09/2026).
      target: runtime
    pull_policy: build
    # Desde 17/10/2026 este contêiner faz TAMBÉM a carga completa das 3h (era o serviço
    # `snapshot-diario`, com cron e um segundo teto de 1450m). Um teto só basta: as duas
    # cargas dividem a trava do snapshot e nunca materializam juntas — a que chega espera
    # (`backend/packages/snapshot/src/trava.ts`). Ver `backend/tools/refresh/src/diario.ts`.
    #
    # `field-agenda` passou de 632 mil linhas em 20/10/2026 e o processo era morto pelo
    # cgroup de 1400 MiB antes de publicar o snapshot. Os 3 GB deixam folga para buffers
    # fora do heap durante a transformação, sem dividir o orçamento da API.
    mem_limit: 3g
    # **Orçamento do host (20/10/2026):** a stack não pode ocupar mais de 3 GB o tempo
    # todo; pico pode, desde que não afete as outras aplicações do servidor. Contínuo:
    # api ~2,1 GB + redis até 384m + web 128m + este daemon ocioso cabe
    # em 3 GB. Os 3 GB acima são PICO, só durante a transformação do `field-agenda`.
    # Para o pico não cair em cima de ninguém:
    # - `mem_reservation`: sob pressão de memória do host, o kernel recolhe primeiro
    #   o que este contêiner usa acima de 512m;
    # - `oom_score_adj`: se faltar memória mesmo assim, o OOM do host mata a carga
    #   (que tenta de novo no próximo ciclo), e não a API nem outra aplicação;
    # - `cpus` + `cpu_shares`: a carga usa no máximo um núcleo e, na disputa, a API
    #   (1024, o padrão) tem 4x a prioridade — o filtro não espera a transformação.
    mem_reservation: 512m
    oom_score_adj: 500
    cpus: '1.0'
    cpu_shares: 256
    # A trava do snapshot usa hostname + PID. Mantê-lo estável permite ao
    # contêiner substituto reconhecer imediatamente um PID morto de deploy.
    hostname: dashboard-instalacao-refresh
    environment:
      VOALLE_HOST: ${VOALLE_HOST:-}
      VOALLE_DATABASE: ${VOALLE_DATABASE:-}
      VOALLE_USER: ${VOALLE_USER:-}
      VOALLE_PASSWORD: ${VOALLE_PASSWORD:-}
      # Sem TLS, como a `api` (ver o comentário lá).
      VOALLE_SSL: '0'
      MARIA_HOST: ${MARIA_HOST:-}
      MARIA_PORT: ${MARIA_PORT:-3306}
      MARIA_DATABASE: ${MARIA_DATABASE:-}
      MARIA_USER: ${MARIA_USER:-}
      MARIA_PASSWORD: ${MARIA_PASSWORD:-}
      MARIA_SSL: '0'
      NODE_ENV: production
      REFRESH_INTERVAL_MINUTOS: '15'
      REFRESH_MEMORIA_MB: '2500'
      # Uma conexão de fonte pendurada não segura a fila para sempre: o daemon
      # mata o grupo após 30 min, registra falha transitória e tenta novamente.
      REFRESH_TEMPO_MAXIMO_MINUTOS: '30'
      VOALLE_APPLICATION_NAME: analytics-refresh
      # Ver o comentário na `api` (#231): o refresh descompacta e compacta .jsonl.gz o dia todo.
      MALLOC_ARENA_MAX: '2'
      # Carga completa (`--refazer`, toda query de refresh.yaml) todo dia neste horário
      # UTC: 06:00 = 03:00 em Brasília. Corrige alteração retroativa que a incremental não
      # vê e renova o teto de 7 dias dela. Vazio desliga.
      SNAPSHOT_DIARIO_UTC: '06:00'
    volumes:
      - ${SNAPSHOT_DIR_HOST:-./snapshot}:/repo/snapshot
      # A credencial do Google SAIU em 14/10/2026 (ACHADOS #209): nenhuma query lê mais
      # planilha — o n8n copia as três para o DB_InstallationDashboard a cada 15 min.
    depends_on:
      api:
        condition: service_healthy
      snapshot-permissao:
        condition: service_completed_successfully
    # Um relógio por grupo: se uma carga média ficar pendurada, `quente` continua
    # entrando na fila e a retomada de suspensão aborta o filho congelado.
    command: ["node", "--max-old-space-size=1024", "backend/tools/refresh/src/daemon.ts", "--por-grupo"]
    # PID 1 é o `tini`, não o Node: o Linux não entrega ao PID 1 sinal sem tratador, e
    # sem isto o `docker stop` esperava 10 s e matava (ACHADOS #157).
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    # Explícito: o Compose v5.1.3 desta estação criava os contêineres com StopTimeout=1,
    # e o `docker stop` matava com SIGKILL no meio do desligamento (ACHADOS #157). 15 s
    # fica acima do teto de 8 s de `backend/api/src/desligamento.ts`.
    stop_grace_period: 15s
    restart: unless-stopped
    logging: *logs

  # Dono da pasta do snapshot, acertado por contêiner (19/10/2026) — antes era passo manual
  # no host (`chown -R 1000:1000`). Quando `SNAPSHOT_DIR_HOST` não existe, o Docker cria a
  # pasta como root, e o `refresh` (uid 1000, sem root desde 13/10) não grava nada nela: a
  # tela subia vazia e o refresh falhava para sempre. Roda a cada `up`, sai, e só então o
  # refresh sobe. Sem rede, raiz somente leitura e só as duas capabilities que o `chown`
  # precisa (mudar o dono e atravessar pasta de outro dono).
  snapshot-permissao:
    image: busybox:1.37
    user: '0:0'
    command: ['chown', '-R', '1000:1000', '/repo/snapshot']
    volumes:
      - ${SNAPSHOT_DIR_HOST:-./snapshot}:/repo/snapshot
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    restart: 'no'
    logging: *logs

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logs
    user: "999:1000"
    # `requirepass` EXIGIDO, sem padrão: sem porta publicada ele já não é alcançável de
    # fora, mas fica aberto a qualquer container que entrar nesta rede — e o que se guarda
    # aqui é resposta calculada sobre dado de cliente. Falha fechada no `up`, não silêncio.
    # `allkeys-lru` porque toda chave deste projeto sai com TTL (`Cache.set` recusa
    # ttl<=0, `cache-redis.ts`): expulsar a menos usada é a degradação que o disjuntor já
    # assume. Sem persistência (`--save ''`, `--appendonly no`): é cache, refaz sozinho, e
    # gravar em disco só copiaria dado de cliente para mais um lugar.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?defina REDIS_PASSWORD nas variaveis da stack}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ''
      --appendonly no
    mem_limit: 384m
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    stop_grace_period: 15s

volumes:
  api-runtime:
