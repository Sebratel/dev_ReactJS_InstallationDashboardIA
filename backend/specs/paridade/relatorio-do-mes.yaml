# MANTIDO POR HUMANOS — gabarito de paridade.
#
# Abra a página no Power BI e escreva em `powerbi:` o número que aparece em cada
# card. `null` significa "ainda não conferido", e o programa diz isso em vez de
# fingir que passou.
#
# Quando o número DEVE dar diferente porque a gente decidiu assim, ponha o id da
# entrada de `backend/specs/_catalog/divergencias.yaml` em `divergente:`. Aí bater vira
# falha — é o que impede uma divergência de ficar só no papel.
#
# Os cards cuja medida alcança `'CALENDARIO INSTALADO'[PESO]` (direta ou através de
# outra medida) NÃO levam mais `divergente:`. Em 09/11/2026 a régua do PESO voltou a ser
# a do Power BI (sábado 1, domingo 0, feriado 0); a única divergência que sobrou é o
# 20/11 como feriado, que só mexe nesses números em novembro. Fora de novembro eles têm
# de BATER com o Power BI. Em novembro, DIAS ÚTEIS RESTANTES e DIAS TRABALHADOS dão um
# dia a menos que o Power BI depois de 20/11 — conferir à mão, sem o harness.
#
# `#DIAS_ÚTEIS_TRABALHADOS` soma o PESO direto. `# BACKLOG` chega lá por dois saltos,
# via `# MEDIA INSTALADO BACKLOG`.

