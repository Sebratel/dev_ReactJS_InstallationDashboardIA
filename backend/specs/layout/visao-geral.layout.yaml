improvements:
  - visual: b346badbabf75059fb86
    original: barChart
    virou: ranking-barra
    porque: >-
      barra horizontal com rótulo (EQUIPE) dentro da própria barra em vez de numa
      coluna de eixo à parte — elimina a coluna de rótulo que uma barra convencional
      reserva à esquerda. Ordenação por valor é só desenho; a medida é a mesma
      "Contagem de SOLICITACAO1" de sempre.
    numero_muda: false
  - visual: 7db40203ca467b8165c6
    original: clusteredBarChart
    virou: ranking-barra
    porque: >-
      pedido do usuário em 09/09/2026 ("esse gráfico mostrando todos os
      instaladores é obrigatório"): o clusteredBarChart paginava 10 categorias
      de eixo por vez (rótulo girado 45°, cabe pouco); ranking-barra lista uma
      linha por técnico, rótulo dentro da barra, ordenado do maior pro menor —
      mesma forma do "TOTAL POR INSTALADOR REFERÊNCIA" do BY. Resolve a FORMA;
      não resolve sozinho "ver as 94 categorias sem paginar" — o teto real de
      uma faixa de 3 colunas é ~15 linhas (`.v-grafico`, 430px), ver o
      comentário desta faixa acima. As demais continuam acessíveis pelo
      paginador (RankingBarra.tsx: "gráfico não rola, pagina" é regra da casa).
    numero_muda: false
