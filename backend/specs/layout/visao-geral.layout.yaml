# MANTIDO POR HUMANOS — a forma da tela. O número continua vindo da spec gerada.
#
# Gerado por `npm run layout:extrai` em 2026-08-28 a partir da
# forma que `visao-geral` desenha hoje (filtro padrão de abertura, sem clique). Editar à
# mão é o esperado — é o "contrato revisável" de docs/PLANO-LAYOUT-V1.md §1. Reextrair
# por cima de uma edição manual perde a edição; extraia só quando quiser voltar à forma
# derivada da heurística antiga.
pagina: visao-geral
base: backend/specs/dashboards/02-visao-geral.spec.yaml
kpis:
  # Ordem = a ordem da esquerda para a direita medida ao vivo no BY (09/09/2026):
  # TOTAIS, AGENDADOS, INSTALADOS, CLIENTES DISTINTOS — os dois primeiros pares
  # de x mais próximos na tela original. Não é a ordem em que o extractor listou.
  - visual: cbc30d7bc7375a004eac
    enfase: normal
  - visual: 71e5cb0109f72b45b16f
    enfase: normal
  - visual: f489778f1a41f78ed708
    enfase: normal
  - visual: 5eac559add4291af6196
    enfase: normal
faixas:
  # Ordem = a ordem vertical do BY: a tabela vem ANTES dos gráficos (medido ao
  # vivo em 09/09/2026, screenshot do usuário). O `layout:extrai` original tinha
  # invertido — herdava a ordem de z-index/id do PBIP, não a leitura de cima para
  # baixo de quem olha a tela.
  - titulo: Análise detalhada
    altura: tabela
    colunas:
      - visual: 704b7bcb68fd3e17cd30
        span: 12
        render: tableEx
  - titulo: Gráficos e tendências
    # TENTEI `matriz` aqui (até 900px) para dar mais linhas ao ranking de TÉCNICO
    # 1 (94 categorias) — não funciona: o teto real de 900px só vale para faixa
    # de UMA coluna (`.filas-largas` em estilo.css, que só ganha a variável
    # `--h-faixa-matriz`); numa faixa de 3 colunas como esta, `RankingBarra.tsx` e
    # `Grafico.tsx` ignoram até o próprio `altura` daqui — os dois fixam
    # `altura="grafico"` no `<Cartao>` por dentro, então o teto real é sempre o de
    # `.v-grafico` (430px), ~15 linhas. Ver conversa de 09/09/2026: mostrar as 94
    # de uma vez exige tirar TÉCNICO 1 desta faixa de 3 colunas (faixa própria,
    # span 12) — decisão de layout que ainda não foi tomada, então o `altura`
    # continua `grafico` e o valor real fica documentado aqui, não escondido.
    altura: grafico
    colunas:
      - visual: 7db40203ca467b8165c6
        span: 4
        render: ranking-barra
      - visual: b346badbabf75059fb86
        span: 4
        render: ranking-barra
      - visual: d9713da4535926b79bd8
        span: 4
        render: columnChart
ocultos:
