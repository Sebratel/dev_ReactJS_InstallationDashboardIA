    porque: >-
      card "Hora mais recente" duplica a informação que o cabeçalho já mostra
      ("dado de HH:MM:SS" / `sub` em App.tsx) — no BY é um texto pequeno de
      rodapé ("Atualizado em: ..."), não um KPI de negócio ao lado de
      PROTOCOLOS TOTAIS. Card ao vivo confirmava 6 KPIs onde o BY mostra 4
      (09/09/2026) — esta é a causa.
  - visual: 3b000fe189f5f6d62a62
