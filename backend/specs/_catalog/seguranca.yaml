# MANTIDO POR HUMANOS — o contrato de segurança da plataforma (docs/PLANO-SEGURANCA.md).
#
# Cada seção de primeiro nível é uma spec do plano (S1–S8) e só existe junto com o teste
# que a cobra, em `backend/api/test/spec-seguranca.test.ts`. O metateste de lá reprova
# seção sem teste: spec que ninguém confere é decoração.
#
# Mudar um valor aqui é diff de contrato: vai com a justificativa no commit.

# S3 — rota de máquina não sai pela porta pública.
rotas_de_maquina:
  # O nginx devolve 404 e a api recusa quando o pedido veio por proxy (traz `X-Real-IP`,
  # que o nginx sempre escreve). As ferramentas falam direto com 127.0.0.1:3100.
  porta_publica_bloqueia:
    - /auth/interno
  # Apagados pelo nginx antes de repassar: o cliente não escolhe o valor que a api lê.
  cabecalhos_apagados_no_proxy:
    - X-Aquecedor-Interno
  # Segredo que só pode entrar no bundle em `vite dev`. `ambiente` é a variável que o
  # `vite.config.ts` lê; `na_tela`, o nome que o `config.ts` usa. O build de produção
  # (imagem e `npm start`) nunca o embute — o token interno abre todas as abas. Até 14/10
  # embutia quando o build rodava sem VITE_FIREBASE_* (medido: o valor saía no .js).
  bundle_so_em_dev:
    - { ambiente: TOKEN_INTERNO, na_tela: VITE_TOKEN_INTERNO }

# S2 — sessão curta, que morre sem uso e cai junto com o acesso.
sessao:
  # Vencimento absoluto, contado do login. Era 12 até 14/10 (D1 do plano). A variável
  # SESSAO_TTL_HORAS do .env só ENCURTA: valor maior que este é ignorado.
  ttl_horas: 8
  # Sem nenhum pedido com o cookie nesse tempo, a sessão morre (D1). Um cookie roubado
  # e guardado para depois não serve.
  ociosidade_minutos: 120
  # A tela "Acessos" → remover pessoa derruba as sessões dela na hora.
  ao_remover_pessoa: derruba_sessoes
  # O mesmo cookie vindo de outro IP: grava `sessao_ip_mudou` e segue (D2). Derrubar
  # quebraria quem troca de rede (Wi-Fi ↔ cabo).
  troca_de_ip: registra
  # GET /api/admin/sessoes e POST /api/admin/sessoes/derruba — só admin.
  admin_ve_e_derruba: true
  # E-mail fora do domínio corporativo: o login não cria a sessão e, se mesmo assim ela
  # existir (defeito no login), cai no primeiro pedido e grava `sessao_fora_do_dominio`.
  # A lista do admin também não a mostra viva. Sem processo à parte: a conta é por pedido.
  fora_do_dominio: derruba

# S5 — filtro só em coluna que a página oferece.
filtros:
  # As colunas que a spec da página cita (segmentações, campos dos visuais, filtros da
  # página e dos visuais) mais a data padrão da aba (`filtros-padrao.ts`). É tudo de onde
  # a tela tira um `?filtro=`. Fora disso, o filtro só serviria de oráculo sim/não sobre
  # coluna que a aba não mostra (auditoria SEC-006).
  permitidos: derivados_da_pagina
  # observar: passa, e grava `filtro_fora_da_pagina` (uma vez por pessoa, aba e coluna).
  # bloquear: 400. Muda para bloquear depois de uma semana de observar sem caso legítimo
  # (D6 do plano), com a contagem registrada no ACHADOS.
  modo: observar

# S6 — dado pessoal que nenhuma tela usa não é carregado.
dados_sensiveis:
  # Nome de coluna que conta como dado pessoal (sem diferenciar maiúscula). Toda coluna
  # do modelo que casar tem de estar em `colunas` — inventário fechado: coluna pessoal
  # nova não entra calada. `npm run seguranca:inventario` diz onde cada uma é usada.
  padrao_de_nome: 'CPF|CNPJ|\bRG\b|E-?MAIL|TELEFONE|CELULAR|\bCEP\b|COMPLEMENTO|\bRUA\b|ENDERE|BAIRRO|LOGRADOURO|NASCIMENTO|LATITUDE|LONGITUDE|CLIENTE|^NUMERO$'
  # Coluna listada que continua no modelo tem de ter uso (página, DAX, relacionamento,
  # catálogo, M ou código — o inventário é conservador), ou uma `excecao` com o motivo.
  # `removida_em` registra o que saiu: se voltar sem uso, o teste reprova de novo.
  regra: so_carrega_se_usada
  colunas:
    - { tabela: CONTRATOS, coluna: CLIENTE, classe: nome }
    - { tabela: CONTRATOS, coluna: TELEFONE, classe: contato, removida_em: 2026-10-14 }
    - { tabela: CONTRATOS, coluna: BAIRRO, classe: endereco, removida_em: 2026-10-14 }
    - { tabela: CONTRATOS, coluna: RUA, classe: endereco, removida_em: 2026-10-14 }
    - { tabela: CONTRATOS, coluna: LATITUDE, classe: endereco, removida_em: 2026-10-14 }
    - { tabela: CONTRATOS, coluna: LONGITUDE, classe: endereco, removida_em: 2026-10-14 }
    - { tabela: CONTRATOS, coluna: NUMERO, classe: endereco, removida_em: 2026-10-14 }
    - { tabela: CONTRATOS, coluna: COMPLEMENTO, classe: endereco, removida_em: 2026-10-14 }
    - { tabela: CONTRATOS, coluna: CEP, classe: endereco, removida_em: 2026-10-14 }
    - { tabela: CONTRATOS, coluna: CPF/CNPJ, classe: documento, removida_em: 2026-10-14 }
    - { tabela: CONTRATOS, coluna: TELEFONE CONTATO, classe: contato, removida_em: 2026-10-14 }
    - { tabela: CONTRATOS, coluna: E-MAIL, classe: contato, removida_em: 2026-10-14 }
    - { tabela: CONTRATOS TELEFONIA, coluna: CLIENTE, classe: nome }
    - tabela: CONTRATOS TELEFONIA
      coluna: TELEFONE CONTRATO
      classe: contato
      excecao: >-
        Sem uso, mas a query tem DISTINCT/GROUP BY: tirar a coluna pode fundir linhas
        (contrato com dois números vira uma) e mudar contagem em tela. Medir as duas
        contagens antes de decidir (ACHADOS #218).
    - { tabela: INSTALAÇÕES REINCIDENTES, coluna: cliente, classe: nome }
    - { tabela: PROTOCOLOS GERAL, coluna: CLIENTE, classe: nome }
    - { tabela: PROTOCOLOS GERAL, coluna: TELEFONE, classe: contato }
    - { tabela: PROTOCOLOS GERAL, coluna: RUA, classe: endereco }
    - { tabela: PROTOCOLOS GERAL, coluna: BAIRRO, classe: endereco }
    - { tabela: PROTOCOLOS GERAL, coluna: LATITUDE, classe: endereco }
    - { tabela: PROTOCOLOS GERAL, coluna: LONGITUDE, classe: endereco }
    - { tabela: PROTOCOLOS PRODUTIVIDADE, coluna: CLIENTE, classe: nome }
    - { tabela: PROTOCOLOS PRODUTIVIDADE, coluna: TELEFONE, classe: contato }
    - { tabela: PROTOCOLOS PRODUTIVIDADE, coluna: RUA, classe: endereco }
    - { tabela: PROTOCOLOS PRODUTIVIDADE, coluna: BAIRRO, classe: endereco }
    - { tabela: PROTOCOLOS PRODUTIVIDADE, coluna: LATITUDE, classe: endereco }
    - { tabela: PROTOCOLOS PRODUTIVIDADE, coluna: LONGITUDE, classe: endereco }
    - { tabela: PROTOCOLOS TELEFONIA, coluna: CLIENTE, classe: nome }
    - { tabela: PROTOCOLOS TELEFONIA, coluna: TELEFONE, classe: contato }
    - { tabela: PROTOCOLOS TELEFONIA, coluna: RUA, classe: endereco }
    - { tabela: PROTOCOLOS TELEFONIA, coluna: BAIRRO, classe: endereco }
    - { tabela: PROTOCOLOS TELEFONIA, coluna: LATITUDE, classe: endereco }
    - { tabela: PROTOCOLOS TELEFONIA, coluna: LONGITUDE, classe: endereco }
    - { tabela: PROTOCOLOS TELEFONIA, coluna: NUMERO, classe: endereco }
    - { tabela: REINCIDÊNCIA, coluna: cliente_nome, classe: nome }
    - { tabela: RETORNO PRIORITARIO, coluna: cliente_nome_instalacao, classe: nome }
