# GERADO por backend/tools/snapshot/src/gera-relatos-do-dia.ts — NÃO vem do PBIP.
# NÃO editar à mão: `npm run gera:relatos-do-dia` (docs/SPEC-DRIVEN.md, 26/10/2026).
#
# Os valores distintos de Descrição, ClassificacaoRelato e CategoriaProdutividade na
# janela inteira da agenda — a agregada `valores-do-relato` de ao-vivo.yaml sem período. É
# de onde a API lista os seletores de relato sem carregar a agenda completa
# (docs/DECISAO-AO-VIVO.md, passo 3; `valores_dos_seletores` em projecao.yaml).
id: valores-do-relato
name: VALORES DO RELATO
origin: expression
source_type: odbc
datasource: dbVoalle
sql: |-
  SELECT
      r.title AS "Descrição",
      (CASE WHEN r.description ILIKE '%PROD%' THEN (CASE
              WHEN r.description ILIKE '%2.015 - REL - IMPRODUTIVO - Fechamento de Instalação de Fibra%' THEN '2.015 - REL - IMPRODUTIVO - Fechamento de Instalação de Fibra'
              WHEN r.description ILIKE '%2.04 - REL - PRODUTIVA - Fechamento de Instalação de Fibra%' THEN '2.04 - REL - PRODUTIVA - Fechamento de Instalação de Fibra'
              WHEN r.description ILIKE '%INST.001 - IMPROD - INVIABILIDADE INFRA CLIENTE%' THEN 'INST.001 - IMPROD - INVIABILIDADE INFRA CLIENTE'
              WHEN r.description ILIKE '%INST.002 - IMPROD - CLI CANCELA AGENDA (SEM VISITA)%' THEN 'INST.002 - IMPROD - CLI CANCELA AGENDA (SEM VISITA)'
              WHEN r.description ILIKE '%INST.003 - IMPROD - CLI CANCELA AGENDA (COM VISITA)%' THEN 'INST.003 - IMPROD - CLI CANCELA AGENDA (COM VISITA)'
              WHEN r.description ILIKE '%INST.004 - IMPROD - REAGENDA POR CHUVA (SEM VISITA)%' THEN 'INST.004 - IMPROD - REAGENDA POR CHUVA (SEM VISITA)'
              WHEN r.description ILIKE '%INST.005 - IMPROD - REAGENDA POR CHUVA (COM VISITA)%' THEN 'INST.005 - IMPROD - REAGENDA POR CHUVA (COM VISITA)'
              WHEN r.description ILIKE '%INST.006 - IMPROD - CLI SOL REAGENDAMENTO%' THEN 'INST.006 - IMPROD - CLI SOL REAGENDAMENTO'
              WHEN r.description ILIKE '%INST.007 - IMPROD - ERRO DO OPERACIONAL (SEM VISITA)%' THEN 'INST.007 - IMPROD - ERRO DO OPERACIONAL (SEM VISITA)'
              WHEN r.description ILIKE '%INST.008 - IMPROD - ERRO COMERCIAL (SEM VISITA)%' THEN 'INST.008 - IMPROD - ERRO COMERCIAL (SEM VISITA)'
              WHEN r.description ILIKE '%INST.009 - IMPROD - ERRO COMERCIAL (COM VISITA)%' THEN 'INST.009 - IMPROD - ERRO COMERCIAL (COM VISITA)'
              WHEN r.description ILIKE '%INST.010 - IMPROD - REAGENDADO PELO TÉCNICO%' THEN 'INST.010 - IMPROD - REAGENDADO PELO TÉCNICO'
              WHEN r.description ILIKE '%INST.011 - IMPROD - INVIABILIDADE TÉCNICA – INST%' THEN 'INST.011 - IMPROD - INVIABILIDADE TÉCNICA – INST'
              WHEN r.description ILIKE '%INST.012 - IMPROD - INVIÁVEL - CLI FORA DA ÁREA%' THEN 'INST.012 - IMPROD - INVIÁVEL - CLI FORA DA ÁREA'
              WHEN r.description ILIKE '%INST.013 - IMPROD - INVIÁVEL - INTERNA DO CLI%' THEN 'INST.013 - IMPROD - INVIÁVEL - INTERNA DO CLI'
              WHEN r.description ILIKE '%INST.014 - IMPROD - REAGENDADO PELO TÉCNICO (SEM VISITA)%' THEN 'INST.014 - IMPROD - REAGENDADO PELO TÉCNICO (SEM VISITA)'
              WHEN r.description ILIKE '%INST.015 - IMPROD - INVIÁVEL - CTO SEM PORTA LIVRE%' THEN 'INST.015 - IMPROD - INVIÁVEL - CTO SEM PORTA LIVRE'
              WHEN r.description ILIKE '%INST.016 - IMPROD - RESP AUSENTE/MENOR NO LOCAL%' THEN 'INST.016 - IMPROD - RESP AUSENTE/MENOR NO LOCAL'
              WHEN r.description ILIKE '%INST.017 - IMPROD - ERRO OPERACIONAL%' THEN 'INST.017 - IMPROD - ERRO OPERACIONAL'
              WHEN r.description ILIKE '%INST.018 - IMPROD - PEDÊNCIA ÁREA DE RISCO%' THEN 'INST.018 - IMPROD - PEDÊNCIA ÁREA DE RISCO'
              WHEN r.description ILIKE '%INST.019 - IMPROD - SST - RISCO%' THEN 'INST.019 - IMPROD - SST - RISCO'
              WHEN r.description ILIKE '%INST.020 - IMPROD - CLI SOLICITA CANCELAR CONTRATAÇÃO%' THEN 'INST.020 - IMPROD - CLI SOLICITA CANCELAR CONTRATAÇÃO'
              WHEN r.description ILIKE '%INST.021 - IMPROD - ACESSO NEGADO%' THEN 'INST.021 - IMPROD - ACESSO NEGADO'
              WHEN r.description ILIKE '%MAN.001 - IMPROD - AGUARDANDO RETORNO INFRA%' THEN 'MAN.001 - IMPROD - AGUARDANDO RETORNO INFRA'
              WHEN r.description ILIKE '%MAN.002 - IMPROD - REAGENDA CLI (COM VISITA)%' THEN 'MAN.002 - IMPROD - REAGENDA CLI (COM VISITA)'
              WHEN r.description ILIKE '%MAN.003 - IMPROD - REAGENDA CLI (SEM VISITA)%' THEN 'MAN.003 - IMPROD - REAGENDA CLI (SEM VISITA)'
              WHEN r.description ILIKE '%MAN.004 - IMPROD - REAGENDA POR CHUVA (COM VISITA) - MAN%' THEN 'MAN.004 - IMPROD - REAGENDA POR CHUVA (COM VISITA) - MAN'
              WHEN r.description ILIKE '%MAN.005 - IMPROD - REAGENDA POR CHUVA (SEM VISITA) - MAN%' THEN 'MAN.005 - IMPROD - REAGENDA POR CHUVA (SEM VISITA) - MAN'
              WHEN r.description ILIKE '%MAN.006 - IMPROD - REAGENDADO PELO TÉCNICO (COM VISITA)%' THEN 'MAN.006 - IMPROD - REAGENDADO PELO TÉCNICO (COM VISITA)'
              WHEN r.description ILIKE '%MAN.007 - IMPROD - REAGENDADO PELO TÉCNICO (SEM VISITA) - MAN%' THEN 'MAN.007 - IMPROD - REAGENDADO PELO TÉCNICO (SEM VISITA) - MAN'
              WHEN r.description ILIKE '%MAN.008 - IMPROD - CLI AUSENTE/SEM CONTATO%' THEN 'MAN.008 - IMPROD - CLI AUSENTE/SEM CONTATO'
              WHEN r.description ILIKE '%MAN.009 - IMPROD - CANCELA A PEDIDO DO CLIENTE%' THEN 'MAN.009 - IMPROD - CANCELA A PEDIDO DO CLIENTE'
              WHEN r.description ILIKE '%MAN.010 - IMPROD - PENDÊNCIA DE ENDEREÇO%' THEN 'MAN.010 - IMPROD - PENDÊNCIA DE ENDEREÇO'
              WHEN r.description ILIKE '%MAN.011 - IMPROD - INVIABILIDADE NO CLIENTE%' THEN 'MAN.011 - IMPROD - INVIABILIDADE NO CLIENTE'
              WHEN r.description ILIKE '%MAN.012 - IMPROD - INVIABILIDADE TÉCNICA - MAN%' THEN 'MAN.012 - IMPROD - INVIABILIDADE TÉCNICA - MAN'
              WHEN r.description ILIKE '%MAN.013 - IMPROD - NÃO FOI PARA CX DO TÉCNICO%' THEN 'MAN.013 - IMPROD - NÃO FOI PARA CX DO TÉCNICO'
              WHEN r.description ILIKE '%OPER.001 - IMPROD – OPERACIONAL NÃO COLOCOU NA CAIXA DO TÉCNICO%' THEN 'OPER.001 - IMPROD – OPERACIONAL NÃO COLOCOU NA CAIXA DO TÉCNICO'
              WHEN r.description ILIKE '%OPER.002 - IMPROD – ERRO DO BACKOFFICE (SEM VISITA)%' THEN 'OPER.002 - IMPROD – ERRO DO BACKOFFICE (SEM VISITA)'
              ELSE NULL END) END) AS "ClassificacaoRelato",
      (CASE WHEN r.description ILIKE '%PROD%' THEN (CASE
              WHEN r.description ILIKE '%2.015 - REL - IMPRODUTIVO - Fechamento de Instalação de Fibra%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%2.04 - REL - PRODUTIVA - Fechamento de Instalação de Fibra%' THEN 'Produtiva'
              WHEN r.description ILIKE '%INST.001 - IMPROD - INVIABILIDADE INFRA CLIENTE%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.002 - IMPROD - CLI CANCELA AGENDA (SEM VISITA)%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.003 - IMPROD - CLI CANCELA AGENDA (COM VISITA)%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.004 - IMPROD - REAGENDA POR CHUVA (SEM VISITA)%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.005 - IMPROD - REAGENDA POR CHUVA (COM VISITA)%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.006 - IMPROD - CLI SOL REAGENDAMENTO%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.007 - IMPROD - ERRO DO OPERACIONAL (SEM VISITA)%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.008 - IMPROD - ERRO COMERCIAL (SEM VISITA)%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.009 - IMPROD - ERRO COMERCIAL (COM VISITA)%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.010 - IMPROD - REAGENDADO PELO TÉCNICO%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.011 - IMPROD - INVIABILIDADE TÉCNICA – INST%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.012 - IMPROD - INVIÁVEL - CLI FORA DA ÁREA%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.013 - IMPROD - INVIÁVEL - INTERNA DO CLI%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.014 - IMPROD - REAGENDADO PELO TÉCNICO (SEM VISITA)%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.015 - IMPROD - INVIÁVEL - CTO SEM PORTA LIVRE%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.016 - IMPROD - RESP AUSENTE/MENOR NO LOCAL%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.017 - IMPROD - ERRO OPERACIONAL%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.018 - IMPROD - PEDÊNCIA ÁREA DE RISCO%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.019 - IMPROD - SST - RISCO%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.020 - IMPROD - CLI SOLICITA CANCELAR CONTRATAÇÃO%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%INST.021 - IMPROD - ACESSO NEGADO%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%MAN.001 - IMPROD - AGUARDANDO RETORNO INFRA%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%MAN.002 - IMPROD - REAGENDA CLI (COM VISITA)%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%MAN.003 - IMPROD - REAGENDA CLI (SEM VISITA)%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%MAN.004 - IMPROD - REAGENDA POR CHUVA (COM VISITA) - MAN%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%MAN.005 - IMPROD - REAGENDA POR CHUVA (SEM VISITA) - MAN%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%MAN.006 - IMPROD - REAGENDADO PELO TÉCNICO (COM VISITA)%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%MAN.007 - IMPROD - REAGENDADO PELO TÉCNICO (SEM VISITA) - MAN%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%MAN.008 - IMPROD - CLI AUSENTE/SEM CONTATO%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%MAN.009 - IMPROD - CANCELA A PEDIDO DO CLIENTE%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%MAN.010 - IMPROD - PENDÊNCIA DE ENDEREÇO%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%MAN.011 - IMPROD - INVIABILIDADE NO CLIENTE%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%MAN.012 - IMPROD - INVIABILIDADE TÉCNICA - MAN%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%MAN.013 - IMPROD - NÃO FOI PARA CX DO TÉCNICO%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%OPER.001 - IMPROD – OPERACIONAL NÃO COLOCOU NA CAIXA DO TÉCNICO%' THEN 'Improdutiva'
              WHEN r.description ILIKE '%OPER.002 - IMPROD – ERRO DO BACKOFFICE (SEM VISITA)%' THEN 'Improdutiva'
              ELSE NULL END) END) AS "CategoriaProdutividade"
  FROM (
      WITH protocolos_do_periodo AS (
          SELECT DISTINCT ai.protocol
            FROM service_desk_slots sds
            JOIN assignment_incidents ai ON ai.assignment_id = sds.pre_reserved_assignment_id
           WHERE sds.begin_date >= (CURRENT_DATE - INTERVAL '3 months')
             AND sds.begin_date <  'infinity'::date
             AND sds.begin_date >= (CURRENT_DATE - INTERVAL '3 months')
      ),
      candidatos AS (
          SELECT DISTINCT ai.assignment_id AS id
            FROM assignment_incidents ai
           WHERE ai.protocol IN (SELECT protocol FROM protocolos_do_periodo)
      ),
      fah AS (
          SELECT h.* FROM fsm_attendance_history h
           WHERE h.reserved_assignment_id IN (SELECT id FROM candidatos)
      )
      SELECT a.id AS assignment_id,
             ai.protocol,
             it.title AS incident_type_title,
             a.final_date,
             inc.title AS incident_status_title,
             r.title AS region_title,
             f.begin_date,
             f.end_date,
             f.rescheduling_type,
             f.begin_date_slot,
             f.first_attendance_history,
             f.last_attendance_history,
             p.name AS resource_name,
             a.created AS assignment_created,
             ( SELECT h2.begin_date
                 FROM fsm_attendance_history h2
                WHERE h2.reserved_assignment_id = f.reserved_assignment_id
                  AND h2.identifier_attendance = f.identifier_attendance
                  AND h2.routing_status = ANY (ARRAY[6, 8])
                ORDER BY h2.begin_date DESC
                LIMIT 1) AS conclusion_date
        FROM ( SELECT fah.region_id,
                      fah.begin_date,
                      fah.end_date,
                      fah.identifier_attendance,
                      fah.rescheduling_type,
                      first_value(fah.begin_date_slot) OVER (PARTITION BY fah.reserved_assignment_id, fah.identifier_attendance ORDER BY fah.begin_date DESC) AS begin_date_slot,
                      fah.routing_status,
                      lag(fah.routing_status) OVER (PARTITION BY fah.reserved_assignment_id ORDER BY fah.begin_date, fah.routing_status) AS previous_routing_status,
                      min(fah.begin_date) OVER (PARTITION BY fah.reserved_assignment_id, fah.identifier_attendance ORDER BY fah.begin_date) AS first_attendance_history,
                      max(fah.end_date) OVER (PARTITION BY fah.reserved_assignment_id, fah.identifier_attendance ORDER BY fah.end_date DESC) AS last_attendance_history,
                      fah.resource_id,
                      fah.reserved_assignment_id
                 FROM fah
                 LEFT JOIN ( SELECT DISTINCT ON (ff.reserved_assignment_id, ff.identifier_attendance)
                                    ff.reserved_assignment_id, ff.identifier_attendance, ff.begin_date_slot
                               FROM fah ff
                              ORDER BY ff.reserved_assignment_id, ff.identifier_attendance, ff.begin_date DESC
                           ) fah_begin_date_slot
                        ON fah_begin_date_slot.reserved_assignment_id = fah.reserved_assignment_id
                       AND fah_begin_date_slot.identifier_attendance = fah.identifier_attendance
                WHERE fah.routing_status = ANY (ARRAY[0, 4, 6, 8])
                  AND EXISTS ( SELECT 1 FROM service_desk_slots sds
                                WHERE sds.pre_reserved_assignment_id = fah.reserved_assignment_id
                                  AND sds.begin_date = fah_begin_date_slot.begin_date_slot)
                GROUP BY fah.shift, fah.region_id, fah.routing_status, fah.reserved_date, fah.resource_id, fah.begin_date,
                         fah.end_date, fah.identifier_attendance, fah.rescheduling_type, fah.begin_date_slot,
                         fah.reserved_skills, fah.reserved_assignment_id, fah.activation_type
             ) f
        JOIN assignments a ON a.id = f.reserved_assignment_id
        JOIN assignment_incidents ai ON a.id = ai.assignment_id
        JOIN regions r ON f.region_id = r.id
        JOIN incident_types it ON ai.incident_type_id = it.id
        JOIN incident_status inc ON ai.incident_status_id = inc.id
        LEFT JOIN people p ON f.resource_id = p.id
       WHERE f.routing_status <> f.previous_routing_status OR f.previous_routing_status IS NULL
  ) vsdspi
  LEFT JOIN reports r ON vsdspi.assignment_id = r.assignment_id
  left join people p on p.id = r.person_id
  left join person_skills ps on ps.person_id = p.id
  left join skills s on s.id = ps.skill_id 
  WHERE (
      vsdspi.region_title LIKE '%Base Canoas (Ativação)%'
      OR vsdspi.region_title LIKE '%Base São Leopoldo (Ativação)%'
  )
  AND (
      r.title NOT LIKE 'Execução:%'
      AND r.title NOT LIKE 'Manutenção de Solicitação%'
      AND r.title NOT LIKE '%Apontamento interno%'
      AND r.title NOT LIKE 'Manutençao de Solicitação%'
      AND r.title NOT LIKE 'Reabertura (Retrabalho)'
      AND r.title NOT LIKE 'Reabertura (Simples)%'
  )
  -- JANELA DESLIZANTE: divergência DE PROPÓSITO do relatório original, que corta
  -- em '2026-01-01' (ver o `m_expression` abaixo, que é o extraído do PBIP).
  -- Esta é a query mais pesada do corpus — grão (slot, relato) — e a última carga
  -- completa MORREU com ECONNRESET após 38 min. Perdida num reset em 26/08/2026 e
  -- restaurada em 27/08 por medição: ver docs/ACHADOS.md e docs/SPEC-DRIVEN.md.
  AND vsdspi.begin_date_slot >= (CURRENT_DATE - INTERVAL '3 months')
  GROUP BY 1, 2, 3;
