m_expression: |-
  let
      // MIGRACAO DE 16/09/2026 (ACHADOS #112). Os 46 passos que moravam aqui viraram o
      // `sql:` desta spec. A partir desta linha o M so faz o que o SQL NAO PODE fazer.
      //
      // `Odbc.Query` IGNORA os dois argumentos: `runQueries` busca `spec.sql` pelo Query
      // Engine antes de avaliar e injeta o resultado como `Fonte` (runner.ts, "as funcoes
      // de fonte devolvem a tabela ja buscada"). O que estava escrito aqui era uma COPIA
      // do SQL -- e ela ja tinha ficado para tras do original. Duas fontes da verdade
      // para a mesma consulta, sendo que uma nunca roda: ficou so o ponteiro.
      Fonte = Odbc.Query("dsn=dbVoalle", "o SQL desta query e o campo `sql:` desta spec"),

      // O UNICO passo que NAO PODE ir para o SQL, e o motivo esta em functions.ts:
      // `DateTime.LocalNow()` devolve `ctx.agora`, o relogio INJETADO pela plataforma --
      // nao o do processo, nao o do banco. Mandar isto para o PostgreSQL entregaria o
      // relogio a ele, e `diaDoCalculo` faz parte da chave de cache: a mesma pergunta
      // deixaria de ter a mesma resposta, e nada acusaria.
      #"DATA HOJE" = Table.AddColumn(Fonte, "DATA HOJE", each DateTime.LocalNow()),
      // `type date` corta a hora. Sem isto TMA contaria fracao de dia contra datas que
      // ja vem cortadas do SQL, e o erro apareceria como um dia a mais ou a menos.
      #"DATA HOJE em data" = Table.TransformColumnTypes(#"DATA HOJE",{{"DATA HOJE", type date}}),

      // TMA depende de DATA HOJE, entao fica aqui junto.
      //
      // No M eram tres passos -- a duracao numa coluna `PERSONALIZAÇÃO`, `Duration.Days`
      // dela, e o `Table.RemoveColumns` que apagava a coluna intermediaria. A coluna
      // intermediaria nunca foi resultado: era so onde a conta descansava.
      //
      // A comparacao com "Finalizado" e SENSIVEL A CAIXA, e ja custou caro uma vez: ate
      // 25/08/2026 este `if` comparava com "FINALIZADO", nunca casava, e TMA contava
      // HOJE - DATA CRIADO tambem para as encerradas (mediana de 366 dias). As 38 linhas
      // de "Finalizado Pendência Financeira" seguem contando como pendentes, de proposito.
      #"TMA" = Table.AddColumn(#"DATA HOJE em data", "TMA",
          each Duration.Days(
              if [SITUAÇÃO] = "Finalizado" then [DATA MODIFICADO] - [DATA CRIADO]
              else [DATA HOJE] - [DATA CRIADO]), Int64.Type),

      // DATA ENCERRADO nao depende do relogio e caberia no SQL. Fica aqui por UM motivo,
      // e vale escreve-lo: a ordem das colunas e observavel no snapshot, e no M ela e a
      // ULTIMA. Se saisse do SQL viria antes de DATA HOJE e de TMA, e a migracao teria
      // mudado a forma da tabela alem do conteudo -- justamente o que ela promete nao fazer.
      #"DATA ENCERRADO" = Table.AddColumn(#"TMA", "DATA ENCERRADO",
          each if [SITUAÇÃO] = "Finalizado" then [DATA MODIFICADO] else null)
  in
      #"DATA ENCERRADO"
