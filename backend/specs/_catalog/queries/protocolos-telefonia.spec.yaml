id: protocolos-telefonia
name: PROTOCOLOS TELEFONIA
origin: table:PROTOCOLOS TELEFONIA
source_type: odbc
datasource: dbVoalle
sql: |-
  WITH PERSONALIZADO AS (
  	select 
  		a.title "SOLICITACAO",
  		ai.protocol "N°PROTOCOLO",
  		s.start_date "DATA AGENDA",
  		a.modified "DATA ENCERRRADO",
  		a.created "DATA CRIADO",
  		is2.title "STATUS",
  		p.city "CIDADE",
  		p.neighborhood "BAIRRO",
  		p.street "RUA",
  		p.number "NUMERO",
  		p.name "CLIENTE",
  		p.phone "TELEFONE",
  		t.title "EQUIPE",
  		ac.lat "LATITUDE",
  		ac.lng "LONGITUDE",
  		p2.name "RESPONSÁVEL",
  		it.title "TIPO DE PROTOCOLO",
  		aap.title "PONTO DE ACESSO",
  		aap.code "CODIGO",
  		aap.slots_first_number "SLOT",
  		aap.ports_first_number "PORTA",  
  		as2.title "CTO",
  		c.v_status "STATUS CONTRATO",
  		c.contract_number "NUMERO CONTRATO",
  		csi.title "ITEM",
  		sc.title "CONTEXTO",
  		sp.title "PROBLEMA",
  		as3.title "OLT",
  		m.title "EQUIPAMENTO",
  		ac.user "USUÁRIO",
  		vu.name "CRIADO POR:",
  		frt.title "TÍTULO RECEBÍVEL",
  		case when p2.outsourced is true then 'TERCEIRO' else 'EFETIVO' end "POSIÇÃO",
  		ROW_NUMBER() OVER (
  					PARTITION BY a.title
  					-- MESMO desempate de `protocolos-geral` (decidido por Erick em 04/09/2026,
  					-- invertido em 13/09). As tres queries calculam as MESMAS colunas a partir
  					-- dos MESMOS joins; discordarem sobre qual linha e a certa seria um defeito
  					-- esperando para ser achado.
  					--
  					-- PRIMARIA e o contrato DAQUELE protocolo, nao `active`: LATITUDE, LONGITUDE,
  					-- CTO, PONTO DE ACESSO, CODIGO, OLT, EQUIPAMENTO, SLOT, PORTA e USUARIO saem
  					-- todas de `ac`, e quando o cliente tem varios enderecos a resposta por
  					-- definicao e o contrato que casa; `active` e heuristica.
  					ORDER BY ((ac.contract_id = cst.contract_id) IS TRUE) DESC,
  					         (ac.active IS TRUE) DESC,
  					         s.start_date DESC NULLS LAST,
  					         ac.created DESC NULLS LAST, ac.id DESC NULLS LAST,
  					         -- Piso de determinismo. Sem ele esta consulta devolvia valor
  					         -- DIFERENTE a cada execucao: medido em 15/09/2026 dentro de uma
  					         -- transacao REPEATABLE READ (banco congelado), 372 de 655 (56,8%) das chaves
  					         -- mudavam sozinhas. Cada alias aqui multiplica a particao e nao
  					         -- era ordenado por nada: `asp` (um contrato de autenticacao tem
  					         -- varias portas de splitter), `s` (uma assignment tem varios
  					         -- schedules), `pa` (quando `ac` nao casa, todos os enderecos do
  					         -- cliente empatam) e `frt` (78,57 titulos por contrato, e TITULO RECEBIVEL divergia em 47,6%).
  					         asp.id DESC NULLS LAST, s.id DESC NULLS LAST,
  					         pa.id DESC NULLS LAST, frt.id DESC NULLS LAST
  				) AS PERSONA1
  		from assignment_incidents ai
  		left join assignments a on a.id = ai.assignment_id
  		left join schedules s on s.assignment_id = a.id
  		left join incident_types it on it.id = ai.incident_type_id
  		left join incident_status is2 on is2.id = ai.incident_status_id
  		left join people p on p.id = a.requestor_id
  		left join teams t on t.id = ai.team_id
  		left join people_addresses pa on pa.person_id = p.id
  		left join authentication_contracts ac on ac.people_address_id = pa.id
  		left join people p2 on p2.id = a.responsible_id
  		left join authentication_access_points aap on aap.id = ac.authentication_access_point_id
  	    LEFT JOIN contract_service_tags cst ON cst.id = ai.contract_service_tag_id
  	    LEFT JOIN contracts c ON cst.contract_id = c.id
  		left join catalog_services_items csi on csi.id = ai.catalog_service_item_id
  		left join authentication_splitter_ports asp on asp.authentication_contract_id = ac.id
  		left join authentication_sites as3 on as3.id = aap.authentication_site_id
  		left join manufacturers m on m.id = aap.manufacturer_id
  		left join solicitation_problems sp on sp.id = ai.solicitation_problem_id
  		left join solicitation_classifications sc on sc.id = ai.solicitation_classification_id
  		left join authentication_splitters as2 on as2.id = asp.authentication_splitter_id 
  		left join v_users vu on vu.id = a.created_by
  		left join financial_receivable_titles frt on c.id = frt.contract_id
  		where (it.id = '1011'or --- TEC - Instalação Telefonia
  			   it.id = '275' OR
  			   it.id = '269') --- TEC - Instalação Telefonia com Portabilidade - Telefonia
  	and a.created >= (DATE_TRUNC('year', CURRENT_DATE) - INTERVAL '1 year')),
  	-- `base` e EXATAMENTE o SELECT DISTINCT que existia aqui antes da migracao de
  	-- 16/09/2026: as MESMAS 33 colunas da fonte, com o MESMO DISTINCT. Nao e zelo, e
  	-- o que mantem a contagem de linhas. O DISTINCT tem de rodar sobre as colunas da
  	-- FONTE: se as derivadas entrassem neste nivel, duas linhas que hoje diferem so
  	-- em CODIGO virariam uma so depois de CODIGO colapsar em POP/VLAN. Derivar vem
  	-- DEPOIS, no SELECT de fora.
  	base AS (
      SELECT distinct "SOLICITACAO",
      				"N°PROTOCOLO",
      				"DATA AGENDA",
      				"DATA CRIADO",
      				"DATA ENCERRRADO",
      				"STATUS",
      				"CIDADE",
      				"BAIRRO" ,
      				"RUA",
      				"NUMERO",
      				"TELEFONE",
      				"CLIENTE",
      				"EQUIPE",
      				"LATITUDE",
      				"LONGITUDE",
      				"RESPONSÁVEL",
      				"TIPO DE PROTOCOLO",
      				"PONTO DE ACESSO",
      				"CODIGO",
      				"SLOT",
      				"PORTA",
      				"CTO",
      				"STATUS CONTRATO",
      				"NUMERO CONTRATO",
      				"ITEM",
      				"CONTEXTO",
      				"PROBLEMA",
      				"OLT",
      				"EQUIPAMENTO",
      				"USUÁRIO",
      				"CRIADO POR:",
      				"POSIÇÃO",
      				"TÍTULO RECEBÍVEL"
  	FROM PERSONALIZADO
  	WHERE PERSONA1= 1
  	),
  	-- O mapa CIDADE -> SIGLA (ACHADO #114) aparece UMA VEZ nesta query, aqui.
  	--
  	-- No M tambem era uma so: a cadeia produzia "SIGLA CIDADE" e `INDICE 2` LIA essa
  	-- coluna (`Text.Combine({[BAIRRO], [SIGLA CIDADE]}, "/")`). Este CTE existe para
  	-- que a migracao PRESERVE isso. A traducao direta, coluna a coluna, punha a cadeia
  	-- inteira dentro de `INDICE 2` tambem -- foi o que este arquivo fez no primeiro
  	-- rascunho, e e o que `protocolos-produtividade` tem hoje (duas copias, uma por
  	-- ramo). Sair de uma copia para duas seria a migracao PIORANDO justamente o
  	-- problema que ela existe para resolver.
  	--
  	-- `Replacer.ReplaceText` substitui SUBSTRING, e as nove chamadas sao encadeadas:
  	-- a ORDEM decide o resultado se um dia uma cidade for substring de outra. Ela e a
  	-- ordem do catalogo, e `siglas-cidade.test.ts` compara as duas.
  	derivado AS (
  	    SELECT base.*,
  	        replace(replace(replace(replace(replace(replace(replace(replace(replace(
  	            initcap("CIDADE"),
  	            'Canoas','CAN'), 'São Leopoldo','SLE'), 'Novo Hamburgo','NHO'),
  	            'Sapucaia Do Sul','SPS'), 'Nova Santa Rita','NSR'), 'Brochier','BROCHIER'),
  	            'Esteio','EIO'), 'Triunfo','TRF'), 'Porto Alegre','POA')
  	                                                      AS "SIGLA CIDADE"
  	    FROM base
  	)
  -- ─────────────────────────────────────────────────────────────────────────────
  -- Os 46 passos de M viraram este SELECT (migracao de 16/09/2026, ACHADOS #112).
  --
  -- A ORDEM DAS COLUNAS ABAIXO E A ORDEM QUE O M PRODUZIA -- a do passo
  -- `Colunas Reordenadas1`, com SITUACAO no fim. Ela e observavel no snapshot, e
  -- reproduzi-la aqui e o que permite provar a migracao coluna a coluna com
  -- `npm run probe:compara-materializacao`.
  --
  -- FICARAM EM M, e so elas: DATA HOJE, TMA e DATA ENCERRADO. `DATA HOJE` e
  -- `DateTime.LocalNow()`, que nesta plataforma devolve o relogio INJETADO
  -- (`ctx.agora`) -- traze-lo para ca entregaria o relogio ao PostgreSQL, e
  -- `diaDoCalculo` esta na chave de cache. TMA depende de DATA HOJE. DATA ENCERRADO
  -- so fica junto porque sem ela a ordem das tres ultimas colunas mudaria.
  --
  -- CADA EXPRESSAO ABAIXO FOI CONFERIDA CONTRA O AVALIADOR, nao contra o Power
  -- Query: sao programas diferentes, e num ponto eles discordavam (ACHADOS #126).
  SELECT
      "SOLICITACAO",
      "N°PROTOCOLO",
      -- `type date` no M CORTA A HORA, e a hora vira coluna propria (DateTime.Time).
      -- A extracao da hora acontece ANTES do corte nos dois casos -- por isso as duas
      -- saem da MESMA coluna da fonte, que ainda e timestamp aqui.
      --
      -- `timestamp without time zone` chega ao M lido como UTC literal
      -- (`parseSemFuso`), e `DateTime.Time`/`type date` usam getters UTC. Logo
      -- `::time` e `::date` batem digito a digito. Se algum dia a coluna virar
      -- `timestamptz`, esta equivalencia cai.
      --
      -- O `DATE '1899-12-30' +` DAS HORAS NAO E ENFEITE, e foi o comparador que o
      -- exigiu: `DateTime.Time` devolve um `MTime`, e `toDatasetRows` o converte
      -- para **`Date` sobre 1899-12-30** -- a convencao do Power BI, em que hora e
      -- fracao de dia sobre a mesma epoca do numero de serie de data (value.ts,
      -- `EPOCH_MS`). Um `::time` puro chega como STRING, e a coluna trocava de tipo
      -- no snapshot: `date` virava `string` em 640 de 640 linhas. Contagem igual,
      -- valor com a mesma cara, tipo diferente -- exatamente a familia de defeito
      -- que esta migracao podia introduzir sem nenhum sintoma.
      "DATA AGENDA"::date                                   AS "DATA AGENDA",
      DATE '1899-12-30' + "DATA AGENDA"::time               AS "HORA AGENDA",
      "DATA CRIADO"::date                                   AS "DATA CRIADO",
      DATE '1899-12-30' + "DATA CRIADO"::time               AS "HORA CRIADO",
      -- o M renomeia DATA ENCERRRADO (com os tres R da fonte) para DATA MODIFICADO
      "DATA ENCERRRADO"::date                               AS "DATA MODIFICADO",
      "STATUS",

      -- Text.Proper: "PORTO ALEGRE" -> "Porto Alegre".
      --
      -- `initcap` NAO e Text.Proper: o Postgres abre palavra em QUALQUER caractere
      -- nao-alfanumerico, e o nosso Text.Proper abre so em espaco, "-" e "/". Onde
      -- eles discordam: `D'AVILA` vira "D'Avila" no initcap e "D'avila" no M, e
      -- `(SEDE)` vira "(Sede)" contra "(sede)".
      --
      -- Medido na fonte viva em 16/09/2026: 8 CIDADEs distintas e 110 BAIRROs, e
      -- **zero** divergencia entre os dois. initcap fica, por ser uma expressao em vez
      -- de uma varredura caractere a caractere -- mas com a condicao escrita: no dia
      -- em que entrar um bairro com apostrofo ou parentese, esta linha passa a mentir.
      initcap("CIDADE")                                     AS "CIDADE",
      initcap("BAIRRO")                                     AS "BAIRRO",
      "RUA",
      "NUMERO",
      "TELEFONE",
      "CLIENTE",
      "EQUIPE",
      "LATITUDE",
      "LONGITUDE",
      -- Text.Upper e depois nulo -> "SEM INFORMAÇÃO" (26 linhas em 16/09). Em CAIXA
      -- ALTA, ao contrario das seis de baixo -- e do M, nao e deslize a copiar.
      COALESCE(upper("RESPONSÁVEL"), 'SEM INFORMAÇÃO')      AS "RESPONSÁVEL",
      COALESCE("PONTO DE ACESSO", 'Sem Informação')         AS "PONTO DE ACESSO",

      -- CODIGO dividia-se por "-" em POP e VLAN (Table.SplitColumn).
      -- Medido em 16/09: das 563 linhas com CODIGO nao-nulo, **nenhuma** tem hifen.
      -- Entao POP e o codigo inteiro, e VLAN e 'Sem Informação' nas 655. As duas
      -- expressoes cobrem o caso com hifen mesmo assim: a fonte pode mudar, e um NULL
      -- calado aqui vira "Sem Informação" na tela sem ninguem ver.
      --
      -- NAO e `NULLIF(split_part(...), '')`: no M, CODIGO = '' (vazio, nao nulo) da
      -- POP = '' e nao 'Sem Informação'. So o NULO e substituido.
      CASE WHEN "CODIGO" IS NULL THEN 'Sem Informação'
           ELSE split_part("CODIGO", '-', 1) END            AS "POP",
      -- VLAN: no M a 2a parte vira Int64 e depois "VLAN " & Text.From(_). Sem 2a
      -- parte ela e nula, e `"VLAN " & null` e null em M -- dai o 'Sem Informação'.
      CASE WHEN "CODIGO" IS NULL OR strpos("CODIGO", '-') = 0 THEN 'Sem Informação'
           ELSE 'VLAN ' || split_part("CODIGO", '-', 2) END AS "VLAN",
      "SLOT",
      "PORTA",

      -- CTO = Text.BeforeDelimiter(Text.AfterDelimiter(_, "-", 1), "-"), ou seja o
      -- TERCEIRO campo da divisao por hifen.
      --
      -- O `>= 3` nao e paranoia: `Text.BeforeDelimiter` devolve VAZIO, nao o texto
      -- inteiro, quando o delimitador nao aparece. Com exatamente 2 hifens o M da ''
      -- e `split_part(...,3)` daria o ultimo campo. Medido em 16/09: 0 linhas nessa
      -- faixa -- mas `protocolos-produtividade` escreve a forma simples, e e essa
      -- diferenca que um dia separa as duas.
      --
      -- Ate 16/09/2026 esta coluna saia do SEGUNDO campo, porque o avaliador aceitava
      -- o "1" e o jogava fora (ACHADOS #126). 550 de 550 linhas mudaram de valor.
      CASE WHEN "CTO" IS NULL THEN NULL
           WHEN length("CTO") - length(replace("CTO", '-', '')) >= 3
                THEN split_part("CTO", '-', 3)
           ELSE '' END                                      AS "CTO",
      "STATUS CONTRATO",
      "NUMERO CONTRATO",
      COALESCE("ITEM",        'Sem Informação')             AS "ITEM",
      COALESCE("CONTEXTO",    'Sem Informação')             AS "CONTEXTO",
      COALESCE("PROBLEMA",    'Sem Informação')             AS "PROBLEMA",
      COALESCE("OLT",         'Sem Informação')             AS "OLT",
      COALESCE("EQUIPAMENTO", 'Sem Informação')             AS "EQUIPAMENTO",
      "USUÁRIO",
      "TIPO DE PROTOCOLO",

      -- calculada uma vez no CTE `derivado`, la em cima
      "SIGLA CIDADE",

      -- INDICE 2 = Text.Combine({BAIRRO, SIGLA CIDADE}, "/"), com as duas correcoes
      -- literais que o M aplica depois. LE "SIGLA CIDADE" em vez de refazer o mapa.
      --
      -- Os COALESCE existem porque `Text.Combine` TRATA NULO COMO VAZIO: com BAIRRO
      -- nulo o M devolve "/POA", e `NULL || '/' || 'POA'` devolveria NULL -- a coluna
      -- inteira sumiria em vez de ficar meia. Sao 0 linhas hoje, e e justamente por
      -- isso que no dia em que deixarem de ser ninguem estaria olhando.
      replace(replace(
          COALESCE(initcap("BAIRRO"), '') || '/' || COALESCE("SIGLA CIDADE", ''),
          'Centro - Assentamento /NSR','Centro - Assentamento/NSR'),
          'Duque De Caxias /SLE','Duque De Caxias/SLE')     AS "INDICE 2",
      "CRIADO POR:",
      "POSIÇÃO",
      "TÍTULO RECEBÍVEL",

      -- SITUAÇÃO, com as tres saidas do M na mesma ordem.
      --
      -- `IS DISTINCT FROM` e nao `<>`: em M, `null <> "Cancelado"` e **true**, e em
      -- SQL `NULL <> 'Cancelado'` e NULL -- que nao e verdadeiro, e a linha cairia no
      -- ELSE. Sao 0 linhas com STATUS CONTRATO nulo hoje.
      CASE WHEN "STATUS" = 'Encerrado'
                AND "STATUS CONTRATO" IS DISTINCT FROM 'Cancelado'
                AND "TÍTULO RECEBÍVEL" IS NOT NULL THEN 'Finalizado'
           WHEN "STATUS" = 'Encerrado'
                AND "STATUS CONTRATO" IS DISTINCT FROM 'Cancelado'
                AND "TÍTULO RECEBÍVEL" IS NULL THEN 'Finalizado Pendência Financeira'
           ELSE 'Pendente' END                              AS "SITUAÇÃO"

  FROM derivado
  -- `Table.SelectRows(each [STATUS] <> "Cancelado")`. De novo `IS DISTINCT FROM`: com
  -- `<>` puro, uma linha de STATUS nulo seria DESCARTADA aqui, e no M ela FICA. Hoje
  -- sao 15 canceladas e 0 nulas -- 655 linhas viram 640.
  WHERE "STATUS" IS DISTINCT FROM 'Cancelado'
