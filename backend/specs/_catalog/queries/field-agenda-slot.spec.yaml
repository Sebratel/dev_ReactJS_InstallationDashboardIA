# MANTIDO POR HUMANOS — este arquivo NÃO existe no PBIP, e `npm run extract` não o
# sobrescreve (não há nada para extrair: é uma forma alternativa, decidida aqui).
# É o grão de SLOT de `field-agenda` — mesma origem (`vsdspi`), sem os `LEFT JOIN`
# de `reports`/`people`/`skills` que multiplicam cada slot por (relato × skill).
# Registrado em docs/SPEC-DRIVEN.md. Ver docs/DECISAO-GRAO-FIELD-AGENDA.md,
# backend/specs/_catalog/projecao.yaml (bloco `grao_reduzido`) e ACHADOS #82/#85/#86/#87.
#
# **Preservar a EXISTÊNCIA da linha é o que torna este corte seguro.** O `LEFT
# JOIN` de `field-agenda.spec.yaml` com `reports` é, na prática, um `INNER JOIN`:
# o filtro `WHERE r.title NOT LIKE ...` rejeita a linha quando `r.title` é nulo, e
# "slot sem relato qualificado" desaparece da tabela hoje. Tirar o `JOIN` sem
# preservar essa exigência traria slot A MAIS aqui do que na forma completa,
# calado — por isso o `EXISTS` abaixo repete os mesmos seis filtros.
spec: query
id: field-agenda-slot
name: FIELD AGENDA SLOT
origin: table:FIELD AGENDA
source_type: odbc
datasource: dbVoalle
sql: |-
  SELECT
      vsdspi.protocol AS "Protocolo",
      vsdspi.incident_type_title AS "Tipo de Protocolo",
      vsdspi.incident_status_title AS "Status Protocolo",
      vsdspi.region_title AS "Base",
      vsdspi.resource_name AS "Instalador",
      vsdspi.assignment_created AS "Data Criado",
      vsdspi.rescheduling_type AS "Reagenda",
      vsdspi.conclusion_date AS "Data finalizado atendimento app",
      vsdspi.first_attendance_history AS "Data primeiro Play app",
      vsdspi.last_attendance_history AS "Data ultimo play app",
      vsdspi.final_date AS "Prazo SLA",
      vsdspi.begin_date AS "Inicio relato",
      vsdspi.end_date AS "Fim relato",
      vsdspi.begin_date_slot AS "Slot Agenda"
  FROM v_service_desk_slots_productivity_informative vsdspi
  WHERE (
      vsdspi.region_title LIKE '%Base Canoas (Ativação)%'
      OR vsdspi.region_title LIKE '%Base São Leopoldo (Ativação)%'
  )
  AND EXISTS (
      SELECT 1 FROM reports r
       WHERE r.assignment_id = vsdspi.assignment_id
         AND r.title NOT LIKE 'Execução:%'
         AND r.title NOT LIKE 'Manutenção de Solicitação%'
         AND r.title NOT LIKE '%Apontamento interno%'
         AND r.title NOT LIKE 'Manutençao de Solicitação%'
         AND r.title NOT LIKE 'Reabertura (Retrabalho)'
         AND r.title NOT LIKE 'Reabertura (Simples)%'
  )
  AND vsdspi.begin_date_slot >= (CURRENT_DATE - INTERVAL '3 months')
  ORDER BY vsdspi.assignment_created DESC;
url: null
sheet: null
endpoints: null
source_tables:
- reports
- v_service_desk_slots_productivity_informative
