id: instalacoes-reincidentes
name: "INSTALAÇÕES REINCIDENTES"
origin: "table:INSTALAÇÕES REINCIDENTES"
source_type: odbc
datasource: dbVoalle
sql: |-
  WITH instalacoes AS (
      SELECT
          cst.id AS service_tag_id,
          c.id AS contract_id,
          c.contract_number AS contrato,
          ai.protocol AS protocolo_instalacao,
          it.title AS tipo_instalacao,
          p4.name AS cliente,
          plis.out_date AS data_instalacao,
          plis.created AS data_hora_saida,
          p3.name AS tecnico_responsavel,
          a.modified AS _marca_instalacao
      FROM patrimony_packing_list_items plis
      LEFT JOIN patrimony_packing_lists ppl 
          ON ppl.id = plis.patrimony_packing_list_id
      LEFT JOIN assignments a 
          ON a.id = ppl.assignment_id
      LEFT JOIN assignment_incidents ai 
          ON ai.assignment_id = a.id
      LEFT JOIN incident_types it 
          ON it.id = ai.incident_type_id
      LEFT JOIN contract_service_tags cst 
          ON cst.id = ppl.contract_service_tag_id
      LEFT JOIN contracts c 
          ON c.id = cst.contract_id
      LEFT JOIN people p4 
          ON p4.id = ppl.responsible_id
      LEFT JOIN people p3 
          ON p3.id = plis.person_allocator_id
      WHERE it.id IN ('12', '1014', '1254', '1255', '1136', '249', '275', '1011', '1015')
        AND plis.out_date >= DATE_TRUNC('year', CURRENT_DATE)
  ),
  manutencoes AS (
      SELECT
          c.id AS contract_id,
          cst.id AS service_tag_id,
          ai.protocol AS protocolo_manutencao,
          it.title AS tipo_manutencao,
          cs.title AS catalogo,
          t.title AS equipe,
          ssc1.title AS categoria_1,
          ssc2.title AS categoria_2,
          ssc3.title AS categoria_3,
          ssc4.title AS categoria_4,
          ssc5.title AS categoria_5,
          a.title AS descricao_manutencao,
          a.created AS data_manutencao,
          a.modified AS _marca_manutencao
      FROM assignment_incidents ai
      LEFT JOIN assignments a 
          ON a.id = ai.assignment_id
      LEFT JOIN contract_service_tags cst 
          ON cst.id = ai.contract_service_tag_id
      LEFT JOIN contracts c 
          ON c.id = cst.contract_id
      LEFT JOIN incident_status is2 
          ON is2.id = ai.incident_status_id
      LEFT JOIN incident_types it 
          ON it.id = ai.incident_type_id
      LEFT JOIN teams t 
          ON t.id = ai.team_id
      LEFT JOIN solicitation_category_matrices scm 
          ON scm.id = ai.solicitation_category_matrix_id
      LEFT JOIN catalog_services cs 
          ON cs.id = scm.catalog_service_id
      LEFT JOIN solicitation_service_categories ssc1 
          ON ssc1.id = scm.service_category_id_1
      LEFT JOIN solicitation_service_categories ssc2 
          ON ssc2.id = scm.service_category_id_2
      LEFT JOIN solicitation_service_categories ssc3 
          ON ssc3.id = scm.service_category_id_3
      LEFT JOIN solicitation_service_categories ssc4 
          ON ssc4.id = scm.service_category_id_4
      LEFT JOIN solicitation_service_categories ssc5 
          ON ssc5.id = scm.service_category_id_5
     WHERE a.created >= DATE_TRUNC('year', CURRENT_DATE)
        AND is2.title <> 'Cancelado'
        AND ai.incident_type_id IN ('1174', '1160', '1149', '1124', '1125', '1105', '1267', '1269', '1271', '1272')
        AND t.id IN ('1050', '65', '1065', '1064', '1063', '1062', '1085')
  ),
  reincidencias AS (
      SELECT
          i.*,
          m.protocolo_manutencao,
          m.tipo_manutencao,
          m.catalogo,
          m.equipe,
          m.categoria_1,
          m.categoria_2,
          m.categoria_3,
          m.categoria_4,
          m.categoria_5,
          m.descricao_manutencao,
          m.data_manutencao,
          m._marca_manutencao,
          ROW_NUMBER() OVER (
              PARTITION BY i.protocolo_instalacao
              ORDER BY m.data_manutencao ASC
          ) AS rn
      FROM instalacoes i
      LEFT JOIN manutencoes m
          ON m.contract_id = i.contract_id
         AND m.data_manutencao >= i.data_instalacao
         AND m.data_manutencao <= i.data_instalacao + INTERVAL '30 days'
  )
  SELECT
      protocolo_instalacao,
      tipo_instalacao,
      contrato,
      cliente,
      data_instalacao,
      data_hora_saida,
      tecnico_responsavel,
      protocolo_manutencao,
      tipo_manutencao,
      catalogo,
      equipe,
      categoria_1,
      categoria_2,
      categoria_3,
      categoria_4,
      categoria_5,
      descricao_manutencao,
      data_manutencao,
      CASE 
          WHEN protocolo_manutencao IS NOT NULL THEN 'SIM'
          ELSE 'NÃO'
      END AS reincidente_30d,
      CASE
          WHEN data_manutencao IS NOT NULL THEN
              FLOOR(EXTRACT(EPOCH FROM (data_manutencao - data_instalacao)) / 86400)
      END AS dias_para_reincidencia,
      _marca_instalacao,
      _marca_manutencao
  FROM reincidencias
  WHERE rn = 1 OR rn IS NULL
  ORDER BY data_instalacao DESC;
