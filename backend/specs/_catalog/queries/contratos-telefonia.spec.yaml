id: contratos-telefonia
name: CONTRATOS TELEFONIA
origin: table:CONTRATOS TELEFONIA
source_type: odbc
datasource: dbVoalle
sql: |-
  select distinct
  	p.name "CLIENTE",
  	c.description "DESCRICAO",
  	c.contract_number "NUMERO CONTRATO",
  	ci.description "TELEFONIA",
  	c.v_status "STATUS CONTRATO",
  	pn.phone "TELEFONE CONTRATO"
  	from contract_phone_billings cpb
  	left join contract_items ci on ci.id = cpb.contract_item_id
  	left join contracts c on c.id = cpb.contract_id
  	left join people p on p.id = c.client_id
  	left join phone_numbers pn on pn.id = ci.phone_number_id
  	where c.v_status not like 'Cancelado'
