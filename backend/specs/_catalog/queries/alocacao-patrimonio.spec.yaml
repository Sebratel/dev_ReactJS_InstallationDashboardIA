id: alocacao-patrimonio
name: "ALOCAÇÃO PATRIMONIO"
origin: expression
source_type: odbc
datasource: dbVoalle
sql: |-
  select 
  	a.title "SOLICITACAO",
  	ai.protocol "N°PROTOCOLO",
  	p.title "EQUIPAMENTO",
  	p.tag_number "PATRIMONIO",
  	p.serial_number "SERIAL",
  	plis.out_date "DATA SAIDA",
  	plis.created "DATA HORA SAIDA",
  	plis.returned "STATUS RETORNO",
  	plis.returned_date "DATA DO RETORNO",
  	p2.name "RESPONSAVEL",
  	p3.name "ALOCADO POR:",
  	p4.name "CLIENTE",
  	as2.title "SITE",
  	p4.city "CIDADE",
  	aap.title "PONTO DE ACESSO",
  	sp.title "PROBLEMA",
          case when p3.outsourced is true then 'TERCEIRO' else 'EFETIVO' END "POSIÇÃO"
  	from patrimony_packing_list_items plis
  	left join patrimony_packing_lists ppl on ppl.id = plis.patrimony_packing_list_id
  	left join assignments a on a.id = ppl.assignment_id
  	left join assignment_incidents ai on ai.assignment_id = a.id
  	left join incident_types it on it.id = ai.incident_type_id
  	left join patrimonies p on p.id = plis.patrimony_id
  	left join people p2 on p2.id = plis.created_by
  	left join people p3 on p3.id = plis.person_allocator_id
  	left join people p4 on p4.id = ppl.responsible_id
  	left join authentication_sites as2 on as2.id = ppl.authentication_site_id
  	left join authentication_access_points aap on aap.id = ppl.authentication_access_point_id
  	left join solicitation_problems sp on sp.id = ai.solicitation_problem_id 
  	where (it.id = '12'or --- TEC - Instalação de Fibra
  			it.id = '1254' or --- #HR - TEC - Instalação de Fibra
  			it.id = '1255' or --- #HR - TEC - Instalação de Fibra
  		   	it.id = '1014'or --- TEC - Instalação de Fibra – CORPORATIVO
  		   	it.id = '1136'or --- TEC - Instalação de Fibra - Cortesia
  		 	it.id = '249'or --- TEC - Instalação de Rádio
  		 	it.id = '15'or --- TEC - Troca de Endereço
                     it.id = '279'or --- TEC - Instalação de Roteador (Wi-fi) e Migração de Plano
  		   it.id = '1015') --- TEC - Instalação de Radio – CORPORATIVO)
  	--and p.tag_number like '178254'
  -- 25/09/2026: desde 2025, como protocolos-geral; o corte no ano corrente deixava instalado de 2025 sem data (ACHADOS #152)
  AND plis.out_date >= (DATE_TRUNC('year', CURRENT_DATE) - INTERVAL '1 year')
url: null
sheet: null
endpoints: null
source_tables:
- assignment_incidents
- assignments
- authentication_access_points
- authentication_sites
- incident_types
- patrimonies
- patrimony_packing_list_items
- patrimony_packing_lists
- people
- solicitation_problems
