sql: "SELECT TRIM(s.name) AS `NOME`, s.lider AS `GESTOR` FROM (SELECT sc.id, sc.name, COALESCE(NULLIF(TRIM(sc.supervisor_name), ''), NULLIF(TRIM(sc.coordinator_name), ''), NULLIF(TRIM(sc.manager_name), '')) AS lider, ROW_NUMBER() OVER (PARTITION BY TRIM(sc.name) ORDER BY sc.termination_date IS NULL DESC, COALESCE(NULLIF(TRIM(sc.supervisor_name), ''), NULLIF(TRIM(sc.coordinator_name), ''), NULLIF(TRIM(sc.manager_name), '')) IS NOT NULL DESC, sc.admission_date DESC, sc.id DESC) AS ordem FROM API_WebDeveloper.db_senior_collaborators AS sc WHERE TRIM(sc.name) <> '') AS s WHERE s.ordem = 1 ORDER BY s.id"
