# EDITADA À MÃO de novo em 23/10/2026 (docs/SPEC-DRIVEN.md, ACHADOS #237), decisão do
# Misael: o GESTOR sai da Senior (`API_WebDeveloper.db_senior_collaborators`, que o fluxo
# n8n "Senior G5 — Sync Colaboradores" preenche), não mais da planilha. Duas regras:
#   - UM registro por nome: a Senior tem 131 nomes repetidos (readmissão, duas empresas),
#     e a mescla de `protocolos-produtividade` é por nome — repetido multiplicaria linha.
#     Vale o ativo (`termination_date` nulo), depois o que tem líder, depois a admissão
#     mais nova;
#   - GESTOR = o líder imediato na árvore da Senior: supervisor; sem supervisor, o
#     coordenador; sem os dois, o gerente.
# O filtro do M nos três nomes da planilha ("Luis Aranda", "Pablo Borges", "Stefany
# Souza") saiu: a Senior escreve o nome completo em maiúsculas, e o gestor de cada
# instalador passa a ser quem ela diz.
