  #
  # `protocolos-geral` e `backlog-agendado-futuro` entraram em 16/09/2026 (ver a
  # entrada 3 acima, e ACHADOS #130).
  #
  # **O grupo inteiro foi medido DEPOIS de entrarem, e não estimado somando.** Rodada
  # ao vivo em 16/09, exatamente como `rodaGrupo` dispara (um processo, `--refazer`):
  #
  #   protocolos-geral .......... 25.485 ms      reincidencia .........  7.699 ms
  #   backlog-agendado-futuro ... 23.094 ms      retorno-prioritario ..  5.925 ms
  #   alocacao-patrimonio .......  2.246 ms      troca-endereco .......  1.265 ms
  #   instalacoes-reincidentes ...  2.096 ms     tecnicos-auxiliares ..    848 ms
  #   base-categorias-field ......  1.736 ms     calculadas ...........  8.237 ms
  #                                              ---------------------------------
  #                                              TOTAL do grupo ....... 81 s
  #
  # A soma dos custos isolados dava ~162 s e superestimava por um fator de 2: um grupo
  # é UM processo, e `protocolos-geral` e `backlog-agendado-futuro` fazem `NestedJoin`
  # com a MESMA `GESTORES EQUIPES`, buscada uma vez só. Isso continua verdade.
  #
  # **MAS OS 81 s DURARAM UM DIA. Medido de novo em 17/09, mesmas nove queries:**
  #
  #   protocolos-geral ......... 158.516 ms   (6,2× o de ontem)
  #   backlog-agendado-futuro ...  86.735 ms   (3,8×)
  #   base-categorias-field .....  58.670 ms   (33,8× — 226.688 linhas, o maior do grupo)
  #   reincidencia ..............  13.076 ms   (1,7×)
  #   retorno-prioritario .......   9.647 ms   (1,6×)
  #   instalacoes-reincidentes ..   8.938 ms   (4,3×)
  #   alocacao-patrimonio .......   5.238 ms   (2,3×)
  #   tecnicos-auxiliares .......   2.884 ms   (3,4×)
  #   troca-endereco ............   1.541 ms   (1,2× — quase parado)
  #   carga .....................   3.389 ms
  #   calculadas ................  10.876 ms
  #                               ----------
  #   TOTAL do grupo ............ 361 s        (o daemon registrou 430 s no mesmo dia)
  #
  # **361 s em 1.200 s de ciclo: 30%.** Com os 430 s do daemon, 36%. Repare na coluna
  # de razões: quem quase não mudou é pequeno, quem explodiu é grande. É a assinatura
  # de banda, não de regressão — ver o bloco ATENÇÃO de 17/09 no topo do arquivo.
  #
  # **A lição de 16/09 ("ao dimensionar um grupo, meça o grupo") estava certa e era
  # insuficiente.** Medir o grupo elimina o erro de somar partes; não elimina o de
  # medir uma vez. Quando o termo dominante é um recurso que não é nosso, uma medição
  # é uma fotografia — e esta envelheceu em vinte e quatro horas.
  #
  # **CONSEQUÊNCIA PARA A CADÊNCIA, e é a parte com dente.** Os grupos rodam em SÉRIE
  # (`tick.ts`) dentro de uma janela de 900 s. Em 17/09 eu escrevi aqui que um tick
  # cheio custava "~664 s, ou 733 s com os números do daemon" — **e isso foi somar
  # amostras, exatamente o erro que o parágrafo acima condena.** O
  # `refresh-historico.log` tem os ticks REAIS, e eles são menores:
  #
  #   tick 1 (16/09)  quente  29s + medio  49s + frio 209s = 286 s   32% da janela
  #   tick 2 (17/09)  quente  94s + medio 430s .......... = 524 s   58%
  #   tick 3 (17/09)  quente 102s + medio 309s + frio 189s = 601 s   67%  <- o pior
  #   tick 4 (17/09)  quente  88s ....................... =  88 s   10%
  #   tick 5 (17/09)  medio  284s + frio 205s + quente 59s = 547 s   61%
  #   tick 6 (17/09)  medio  306s ....................... = 306 s   34%
  #
  # **O pior tick observado é 601 s: 67% da janela, não 81%.** A folga é menor do que
  # parece pela média (média de grupo em `--historico`: quente 74,5 s, medio 275,6 s,
  # frio 201,2 s) e maior do que a minha soma de piores casos. Nem um nem outro: leia
  # o histórico.
  #
  # Estourando, o daemon PULA o disparo seguinte (`emExecucao` em `daemon.ts`) — e
  # pular não é falha: `estaVencido` mede idade do último SUCESSO, o
  # `refresh-status.json` continua verde, e a cadência real cai pela metade sem nada
  # acender. Desde 17/09 isso vira um evento `ciclo-pulado` no
  # `snapshot/refresh-historico.log`; leia com `npm run refresh:daemon -- --historico`.
  # Nenhum foi registrado ainda — o evento nasceu depois dos seis ticks acima.
  #
  # **Por que aqui e não no `quente`.** Com a conta antiga (~162 s) a escolha já era
  # esta; com 81 s a margem melhorou; com 361 s ela é o argumento principal. O `quente` existe para ser barato o bastante
  # para rodar de 15 em 15 min, e o que se compraria apertando são cinco minutos de
  # frescor numa tabela de protocolo de instalação — que não é operação minuto a
  # minuto. Se a operação disser que 20 min é demais, mover a linha de grupo é a
  # mudança inteira; mas meça o `quente` com ela dentro antes de confiar num número,
  # porque o efeito de compartilhamento acima depende de quem está junto.
  #
  # `backlog-agendado-futuro` vem junto de propósito: o M dela faz
  # `Table.NestedJoin` com PROTOCOLOS GERAL, e as duas no mesmo grupo é o que mantém
  # as duas com a mesma idade. Grupos diferentes dariam a ela um lado direito mais
  # velho ou mais novo que o próprio arquivo, a depender da ordem dos ticks.
  #
  # `capacidade-equipe` e `apuracao-premiacao` ENTRARAM EM 18/09/2026, e o motivo é o
  # mesmo do #130: elas não estavam em grupo nenhum, e não por decisão — por omissão.
  # O snapshot das duas era de **15/09**, três dias parado, e entre elas alimentam
  # três das quatorze telas (`capacidade-equipe` → `agendamento-field` e
  # `relatorio-do-mes`; `apuracao-premiacao` → `premiacao-instalacao`).
  #
  # Medido em 18/09 com o grupo inteiro, um processo, `--refazer` — as duas juntas
  # custam **5,4 s**, e o grupo com ONZE queries ficou MENOR do que com nove ontem,
  # porque a banda melhorou (ver o bloco ATENÇÃO no topo):
  #
  #   protocolos-geral ......... 107.402 ms      alocacao-patrimonio ..  4.827 ms
  #   backlog-agendado-futuro ..  64.014 ms      capacidade-equipe ....  3.754 ms  <- nova
  #   troca-endereco ...........  33.194 ms      apuracao-premiacao ...  1.607 ms  <- nova
  #   tecnicos-auxiliares ......  15.442 ms      carga ................  3.128 ms
  #   base-categorias-field ....  14.468 ms      calculadas ........... 11.172 ms
  #   reincidencia .............   9.699 ms      -----------------------------------
  #   retorno-prioritario ......   8.396 ms      TOTAL do grupo ....... 286 s
  #   instalacoes-reincidentes .   5.477 ms                            (24% de 1.200 s)
  #
  # `gestores-equipes` e `quadro-funcional` entraram em 16/10/2026: desde 14/10 as
  # duas leem o DB_InstallationDashboard, alimentado pelo n8n, e não carregam mais
  # CPF/RG. Embora sejam dependências M de outras queries deste grupo, precisam de
  # carimbo próprio para não ficar sem vigia entre o snapshot diário. Medidas isoladas:
  # 2.240 ms (20.053 linhas) + 608 ms (540 linhas), custo irrelevante no grupo de ~290 s.
  medio:
    queries:
      - alocacao-patrimonio
      - base-categorias-field
      - protocolos-geral
      - backlog-agendado-futuro
      - protocolos-produtividade
      - clima-tempo
      - gestores-equipes
      - quadro-funcional
    intervalo_minutos: 30
    incremental: false

  # `field-agenda-slot` (achado #87): mesma origem de `field-agenda`
  # (v_service_desk_slots_productivity_informative), sem os LEFT JOIN de
  # relato/skill — é o arquivo que atende a maioria das aberturas de
  # `agendamento-field` (ACHADOS #87/#88). Medido ao vivo em 03/09/2026:
  # 13,5s de busca+escrita (41.348 linhas) + ~10s de recongelamento das calculadas
  # que QUALQUER grupo bem-sucedido paga (ver ATENÇÃO acima — eram ~4 min até
  # 04/09/2026, hoje são 9,8s medidos). Sozinha, ela fecharia um tick em ~24s. O que
  # dimensiona este grupo hoje é `protocolos-produtividade`, mais abaixo: o tick
  # inteiro medido em 16/09/2026 deu 190s e 209s em duas passadas, ~11% do intervalo
  # de 30 min.
  # Sozinha no grupo: perfil de fonte e custo
  # diferentes de `quente`/`medio`, e um novo grupo aqui já significa mais
  # uma queda do cache de resposta inteiro por ciclo (armadilha registrada em
  # docs/DEPLOY.md) — não vale apertar o intervalo sem necessidade medida.
  # `field-agenda` (forma completa) continua de fora — 21min49s (achado #82).
  #
  # `clima-tempo` entrou em 09/09/2026 (ACHADOS #104): fonte web (Open-Meteo),
  # 7.267 ms medidos ao vivo, 1.869 linhas, 14 chamadas HTTP. Entrou AQUI e não
  # num grupo próprio porque grupo novo custa mais uma queda do cache de resposta
  # inteiro por ciclo (docs/DEPLOY.md), e 7,3s dentro de um tick de 190s medidos não
  # muda a margem do intervalo de 30 min.
  #
  # **Por que ela precisa de cadência, ao contrário de toda outra query.** As
  # demais ficam desatualizadas; esta fica VAZIA. A tabela tem previsão só de hoje
  # até ~16 dias à frente, e o visual de chuva de `agendamento-field` filtra
  # `Tipo = "Previsão"` — parada 17 dias, ela não tem uma linha de previsão e a
  # matriz esvazia sem erro. Foi o que estava acontecendo: o arquivo tinha 6 dias.
  #
  # O preço: 48 ticks/dia × 14 chamadas = ~672 pedidos/dia à Open-Meteo, para um
  # dado que muda poucas vezes ao dia. Cabe folgado no limite do serviço, mas se
  # um dia isso incomodar, o conserto é um grupo próprio de cadência horária — não
  # tirar daqui.
  # `protocolos-produtividade` entrou em 13/09/2026. Escolhido o `frio` e não outro
  # grupo por ser a query mais cara de todas: 162s de materialização ponta a ponta
  # (76.398 linhas), mais as calculadas. Num intervalo de 30 min isso é ~11% de ciclo
  # de trabalho; no `quente` (15 min) seria ~21%. Frescor de 30 min é folgado aqui --
  # é produtividade diária de instalação, não operação minuto a minuto.
  #
  # Não ganhou grupo próprio de propósito: grupo novo custa mais uma queda do cache de
  # resposta inteiro por ciclo (docs/DEPLOY.md).
  #
  # `incremental` desligada para ela por ora (a lista do grupo abaixo só cita a
  # `field-agenda`, desde 01/10), apesar de ela ter sido a primeira query com política em
  # `incremental.yaml`. A carga completa agora cabe no orçamento, e ligar a costura
  # incremental logo depois da reescrita do SQL empilharia risco sem necessidade -- a
  # costura ancora em duas linhas exatas daquele arquivo. Ligar depois é barato.
  #
  # `protocolos-auxiliares` ENTROU EM 18/09/2026 (ACHADOS #135), E NAO FOI POR CUSTO.
  # Ela era a UNICA query com poll de quase-realtime (`realtime-poll.yaml`, 12 s) e
  # nenhum grupo de refresh atras. Parecia coberta -- e o poll de fato da frescor --
  # mas ele produz um OVERLAY por cima do snapshot, e a janela dele comeca no
  # ARRANQUE DA API (`novoDelta(agora)` em `poller-realtime.ts`), nao na marca do
  # snapshot. Linha cujo carimbo caia entre as duas nao esta em lugar nenhum.
  #
  # Para as outras cinco queries polidas, essa fresta se fecha sozinha em 15 a 30 min
  # -- o grupo refaz o arquivo e a marca alcanca o arranque. Sem grupo, ela so cresce.
  # Medido em 18/09: snapshot de 16/09 14:32, API subida em 17/09 13:49, **495 linhas
  # na fresta** (263 delas linhas novas que simplesmente faltavam no arquivo).
  #
  # **FECHADA NA ORIGEM EM 02/10/2026:** a primeira busca do poller parte do `geradoEm` do
  # manifesto (`#partida`), não do arranque. O grupo continua como rede de segurança.
  #
  # Ela veio para o `frio` e nao para o `quente` de proposito: quem da frescor e o
  # poll; o grupo so precisa fazer a marca alcancar o arranque, e 30 min basta para
  # isso. Medido em 18/09, o grupo inteiro com ela dentro (um processo, `--refazer`):
  #
  #   protocolos-produtividade .. 143.711 ms      carga ...........  4.070 ms
  #   protocolos-auxiliares .....  33.913 ms      calculadas ...... 11.970 ms
  #   field-agenda-slot .........  13.532 ms      ------------------------------
  #   clima-tempo ...............   6.860 ms      TOTAL do grupo .. 213 s
  #
  # 213 s em 1.800 s: 11,8%. Sem ela o grupo media 209 s -- a margem deste grupo era
  # a maior dos tres, e continua sendo. `backend/api/test/ancora-do-poll.test.ts` passou
  # a reprovar se alguem puser uma query em poll sem grupo de novo.
  # `field-agenda` (a forma COMPLETA) entrou em 22/09/2026 — ver a entrada 4 do
  # bloco de exclusões acima, que foi reescrita no mesmo dia. Resumo: ela estava
  # fora por causa dos 21min49s do #82, e esse número morreu no #86 (mesmo dia,
  # três achados abaixo). Medida hoje, ponta a ponta:
  #
  #   busca no banco ......... 226.954 ms   86,8%   <- o gargalo agora é este
  #   avaliação de M ..........  2.768 ms    1,1%
  #   toDatasetRows ...........    674 ms    0,3%
  #   7 colunas calculadas ....  26.001 ms    9,9%   (eram 958.194 ms)
  #   escreve() ...............   4.574 ms    1,7%
  #                            ----------
  #   TOTAL .................. 261.454 ms   4 min 21 s
  #
  # 213 s (o grupo hoje) + 261 s = 474 s em 1.800 s: **26%**. A margem continua
  # sendo a maior dos três grupos, que é por que ela veio para cá e não para o
  # `medio`.
  #
  # **A banda de rede é o risco, não o cálculo.** A busca sozinha variou 18% entre
  # duas medidas do MESMO dia (226.954 ms dentro do materializador, 192.467 ms
  # isolada, ~360 MB nas duas). Com o espectro que este arquivo já registra (0,62 a
  # 3,52 MB/s, spread de 5,7×), a carga desta query é uma BANDA de ~130 s a ~900 s.
  # No pior caso ela sozinha come metade do intervalo. Se o grupo começar a estourar,
  # o remédio já está desenhado: incremental por `assignment_id` (35 s medidos), que
  # exige antes o `piso_de_janela` em `mescla()` — esta é a primeira query do corpus
  # com recorte DESLIZANTE na fonte, e sem essa regra o arquivo cresce para sempre.
  #
  # **LIGADA EM 01/10/2026 (ACHADOS #165), e só ela.** O `piso_de_janela` foi feito
  # (`incremental.ts`, `mescla`), a política está em `incremental.yaml`, e a carga
  # completa do mesmo dia levou 375 s. A lista abaixo liga a incremental SÓ em
  # `field-agenda`: `protocolos-produtividade` também tem política e continua inteira
  # pelo motivo de sempre (ver acima). A cada 7 dias (`idade_maxima_dias`) a própria
  # incremental recusa e faz a completa — é o que pega cadastro renomeado e linha
  # apagada na fonte sem rastro de data.
  frio:
    queries:
      - field-agenda
      - protocolos-auxiliares
      - protocolos-telefonia
      - troca-endereco
      - tecnicos-auxiliares
      - retorno-prioritario
      - instalacoes-reincidentes
      - reincidencia
    intervalo_minutos: 60
    incremental: [field-agenda]
