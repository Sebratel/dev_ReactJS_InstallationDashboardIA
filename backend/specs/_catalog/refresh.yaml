# Cadência do refresh automático — MANTIDO POR HUMANOS, como incremental.yaml e
# cache-policies.yaml: "de quanto em quanto tempo" é decisão, não extração, e
# `npm run extract` nunca deveria sobrescrever isto.
#
# Cada grupo roda em SÉRIE dentro de um mesmo tick do Refresh Manager
# (backend/tools/refresh/src/index.ts) — nunca em paralelo com outro grupo do mesmo tick.
# Ver o docstring de index.ts para o porquê (read-modify-write do manifesto).
#
# Query que não aparece em grupo nenhum aqui NÃO tem refresh automático — continua
# só no passe manual (`npm run snapshot -- --todas`). Fonte que alimenta tela entra
# em grupo somente depois de uma medição isolada. `backlog-instalacao`/
# `backlog-agendado-futuro` (2 das 7) foram
#      medidas ao vivo em 03/09/2026 (ACHADOS #93) — 58-60ms cada, entraram no
#      grupo `quente` abaixo. `clima-tempo` (a 7ª, fonte web) foi medida ao vivo
#      em 09/09/2026: **7.267 ms**, 1.869 linhas, 14 chamadas à Open-Meteo — e
#      entrou no grupo `frio` (ACHADOS #104). Ela é a ÚNICA query cujo conteúdo
#      caduca sozinha: a previsão é uma janela de ~16 dias que anda todo dia, e
#      sem cadência ela envelhece até o visual de previsão esvaziar. Estava 6
#      dias parada quando isso foi descoberto.
#   2. `protocolos-produtividade` — **RESOLVIDO em 13/09/2026, entrou no grupo
#      `frio` abaixo.** Estava fora por ACHADOS #81 ("SQL e M calculam as mesmas 3
#      colunas, e o full-fetch passou do teto de 600s"), e `grupos.ts` tinha uma
#      trava recusando o arquivo inteiro se ela aparecesse. As duas causas caíram:
#      o M ficou só com o join de GESTOR, e o SQL saiu de "não termina em 600s"
#      para 142,7s. O que custava não era o fanout de `financial_receivable_titles`
#      (78,57 títulos por contrato, medido) e sim o `regexp_replace` dentro do `ON`
#      do CTE `mesclado`: sem estatística sobre a expressão o planejador estimava
#      `rows=2` contra 70 mil reais e escolhia Nested Loop — dois regexps por PAR
#      de linhas. `AS MATERIALIZED` nas CTEs `unificado`/`auxiliar` resolveu.
#      Materialização ponta a ponta medida: **162s, 76.398 linhas**.
#      A trava em `grupos.ts` continua existindo, com a lista vazia.
#   3. `protocolos-geral` — **RESOLVIDO em 16/09/2026, entrou no grupo `medio`
#      abaixo, junto de `backlog-agendado-futuro`.** Esta entrada dizia que o M dela
#      faz `Table.NestedJoin` com `GESTORES EQUIPES` (dbMaria) e que o pacote
#      `mysql2` não estava instalado nem declarado, então qualquer query que
#      tocasse dbMaria crashava com `ERR_MODULE_NOT_FOUND` (ACHADOS #83) — "fora
#      daqui até o pacote existir".
#
#      **O pacote existe desde 02/09/2026**, commit 6391988, do MESMO DIA em que o
#      achado foi registrado. O bloqueio que o sucedeu — estourar o heap com 8192 MB
#      — caiu em 09/09, commit af82774, cujo título é literalmente "protocolos-geral
#      volta a caber em 8 GB" (`guardaPassos: false`: o motor de M parou de manter
#      uma cópia inteira da tabela por passo do `let`). A condição de saída escrita
#      aqui foi cumprida duas vezes, com catorze e sete dias de antecedência, e
#      ninguém voltou para apagar a frase.
#
#      O preço de não voltar: `PROTOCOLOS GERAL` alimenta **12 das 14 telas** e não
#      tem poll de quase-realtime (ver `realtime-poll.yaml`, que a exclui pela mesma
#      premissa morta). Ela ficou sem cadência nenhuma — o arquivo em disco só mudava
#      quando alguém digitava o comando, e em 16/09 estava com 20 h.
#
#      Medido ao vivo em 16/09/2026, `--refazer --sem-calculadas`:
#        protocolos-geral .......... 79.966 ms   95.278 linhas × 63 colunas
#        backlog-agendado-futuro ... 32.524 ms   95.949 linhas ×  4 colunas
#        protocolos-auxiliares ..... 60.127 ms   38.087 linhas × 46 colunas
#   4. `field-agenda` — **SAIU DA LISTA DE EXCLUSÃO EM 22/09/2026.** Está no grupo
#      `frio`; ver o comentário lá embaixo, com a medição de hoje.
#
#      **Esta entrada ficou 20 dias mandando excluir por um número morto**, e o
#      registro fica aqui porque o erro é de forma, não de conta. Ela dizia: *"21
#      minutos e 49 segundos ponta a ponta (ACHADOS #82) — nenhuma cadência de
#      minutos é segura enquanto isso não for remedido"*. Foi remediado **no mesmo
#      dia**, pelo #86, três achados abaixo do #82 no mesmo arquivo: as colunas
#      `RankDataProtocolo`/`RankAtualProtocolo` passaram a ser calculadas por grão
#      reduzido, e os 958.194 ms viraram 26.001 ms. A condição de saída estava
#      cumprida desde 02/09 e ninguém voltou para apagar a frase — exatamente o que
#      a entrada de `protocolos-geral` logo acima já denuncia de si mesma.
#
#      Medido em 22/09/2026, ponta a ponta: **261.454 ms (4 min 21 s)** para
#      634.351 linhas × 26 colunas. E o perfil INVERTEU: a busca no banco é 86,8%
#      do relógio, e as 7 colunas calculadas são 9,9%.
#
#      Duas coisas que a narrativa deste repositório ainda erra sobre esta query, e
#      que foram medidas em 22/09 (ver ACHADOS):
#        - o `LEFT JOIN person_skills` **não multiplica nada**: `skill` tem 2
#          valores distintos e 422.177 nulos em 634.351 linhas, e todo relator tem
#          exatamente 1 skill. Quem multiplica é `reports` (relato). O #2, o #86 e
#          `DECISAO-GRAO-FIELD-AGENDA.md` atribuem a inflação a skill;
#        - a coluna cara hoje é `ClassificacaoRelato` (17,3 s, os 45
#          `CONTAINSSTRING`), não os dois `Rank` — que juntos são 4,3 s, 7%.
#
#      `field-agenda-slot` (achado #87 — mesma origem, sem os `LEFT JOIN` de
#      relato/skill) continua no mesmo grupo, emparelhada por
#      `backend/tools/snapshot/src/index.ts`.
#
# ATENÇÃO (03/09/2026, ACHADOS #89) — O CUSTO CAIU 24×, CORRIGIDO EM 16/09/2026.
# O encadeamento continua igual: qualquer query materializada com sucesso aqui
# dispara `calculadas.ts --todas` em seguida (`backend/tools/snapshot/src/index.ts`), que
# recongela as SETE tabelas calculadas do zero, sempre, sem checagem de idade. O que
# mudou foi o preço. Em 03/09 eram ~50-65s por coluna de `Status Protocolo Dia` × 4 =
# ~4 minutos em cima de QUALQUER grupo bem-sucedido, e este bloco mandava dimensionar
# todo intervalo novo como "tempo de busca MAIS ~4 min". No dia seguinte, 04/09, o
# commit 9083221 (`backend/packages/snapshot/src/nativas.ts`) trocou o DAX avaliado por linha
# por uma agregação e levou aquela tabela de 211s para 4,6s. O bloco não foi
# atualizado junto: a instrução de dimensionamento ficou doze dias mandando reservar
# um orçamento que já não existia.
#
# Medido ao vivo em 16/09/2026 — `npm run snapshot:calculadas -- --todas` contra o
# snapshot em disco, processo inteiro cronometrado de fora em 10.309 ms:
#
#   BASE DE ORIGEM ..............      6 ms     3 linhas
#   calendar ....................     12 ms     13.099 linhas
#   CALENDARIO AGENDAMENTO ......  3.787 ms     730 linhas   <- a maior fatia hoje
#   CALENDARIO CRIADO ...........      6 ms     365 linhas
#   CALENDARIO INSTALADO ........     12 ms     713 linhas
#   PROTOCOLOS ..................      2 ms     10 linhas
#   Status Protocolo Dia ........  2.934 ms     13.099 linhas
#                                  --------
#   total do processo ...........  9.852 ms
#
# `Status Protocolo Dia` sai por `[tradução nativa]` e não avalia uma linha de DAX.
# A maior fatia passou a ser `[DATA VIGENTE?]` de `CALENDARIO AGENDAMENTO` (3.671 ms
# das 730 linhas dela) — nenhuma das duas justifica reserva de minutos.
#
# **Ao dimensionar um intervalo novo: some ~10s, não ~4 min.** E o item dominante de
# um tick deixou de ser este encadeamento: em 16/09 o `frio` levou 190s e 209s em dois
# ticks medidos, dos quais a busca de `protocolos-produtividade` (~162s) é a quase
# totalidade. As calculadas são ~5% desse tempo.
#
# ═══════════════════════════════════════════════════════════════════════════════
# ATENÇÃO (17/09/2026, ACHADOS #134) — TODO NÚMERO DE GRUPO DESTE ARQUIVO É UMA
# DIVISÃO POR UMA BANDA QUE VARIA 5×, E NENHUM DELES DIZ ISSO.
#
# Em 16/09 o `quente` levou 28,6 s. Em 17/09, com as MESMAS sete queries, a mesma
# spec de cada uma e a mesma ordem, levou 94,1 s, 105,7 s e 81,0 s em três passadas.
# Nada no repositório mudou entre as duas medições. O `medio` foi de 81 s para 361 s
# e 430 s pelo mesmo motivo.
#
# ONDE O TEMPO ESTÁ, medido em `contratos` (a maior fatia do `quente`) com
# `npm run probe:custo-contratos`:
#
#   plano do servidor ........    232 ms   <- o banco faz o join inteiro nisto
#   transporte das linhas ... 16.621 ms
#   ordenação ............... 10.628 ms   <- `order by p.name asc`, do topo do SQL
#
# O banco NÃO está lento. `select 1` tem mediana de 12 ms de ida e volta (pior caso
# 98 ms), e 10 MB gerados no servidor e NÃO entregues levam 72 ms — 139 MB/s. Os
# mesmos 10 MB ENTREGUES, numa única linha de uma única coluna (portanto sem nenhum
# trabalho por linha no driver), levam 6.926 ms: **1,44 MB/s.** Em outra passada,
# 50 MB a 1,16 MB/s; noutra, 2,24 MB/s. É o fio, e ele varia.
#
# E `contratos` não cresceu: 86.395 linhas em 02/09 contra 87.907 hoje, +1,7%. A
# spec dela está intocada desde o primeiro commit.
#
# **A REGRA QUE SUBSTITUI TODAS AS ESTIMATIVAS DESTE ARQUIVO:**
#
#     custo de um grupo ≈ bytes que ele traz ÷ banda do momento (~1 a 2 MB/s)
#
# Por isso as queries pequenas quase não mudaram entre 16/09 e 17/09
# (`troca-endereco` 1.265 → 1.541 ms) e as grandes explodiram
# (`base-categorias-field`, 226.688 linhas, 1.736 → 58.670 ms). Não é degradação
# uniforme: é o termo proporcional a bytes multiplicando, e o termo fixo parado. É
# essa assinatura que identifica o problema como link, e não como query.
#
# **O QUE FAZER COM ISSO, em ordem de proveito:**
#   1. Trazer menos bytes. É o único eixo que a plataforma controla. Coluna que
#      ninguém lê custa a cada tick — `CONTRATOS[CIDADE2]` é literalmente
#      `ac.city` pedido duas vezes no mesmo SELECT (ACHADOS #47).
#   2. Política em `incremental.yaml`. Só `protocolos-produtividade` tem uma; as
#      outras 21 buscam inteiro toda vez, e é inteiro que sai caro a 1,5 MB/s.
#   3. Afrouxar cadência. É o último recurso, não o primeiro: paga-se em frescor.
#
# **O QUE NÃO ADIANTA:** reescrever SQL (o plano é 232 ms), trocar driver (o custo
# aparece igual com UMA linha), aumentar memória, mexer em índice.
#
# **E ANTES DE CONFIAR EM QUALQUER NÚMERO ABAIXO:** rode
# `npm run probe:custo-contratos -- --banda`. Se der ~1 MB/s, os números deste
# arquivo estão otimistas por um fator de 2 a 5. Medir o grupo uma vez não basta
# quando o termo dominante é um recurso que não é nosso — foi exatamente esse o
# erro cometido aqui em 16/09, e ele durou um dia.
#
# SEGUNDA AMOSTRA, 18/09/2026 — e ela é a confirmação, não a repetição:
#
#                              17/09 (carga)   17/09 (livre)   18/09 (sob carga)
#   1 MB ...................      1,09 MB/s       2,76 MB/s        3,52 MB/s
#   10 MB ..................      0,76 MB/s       1,82 MB/s        3,21 MB/s
#   50 MB ..................      0,62 MB/s       1,16 MB/s        2,78 MB/s
#   10 MB numa linha só ....           —          1,44 MB/s        3,07 MB/s
#   ida e volta (mediana) ..             12 ms         12 ms           10 ms
#
# **2,4× mais rápido hoje, e a medição de hoje foi feita COM o grupo `medio`
# rodando** — ou seja, contra contenção, e ainda assim melhor. A latência não mudou
# (10-12 ms), o servidor não mudou (105-139 MB/s gerando sem entregar). Só a banda.
# Spread total observado até aqui: **5,7× entre a pior e a melhor amostra.**
#
# Consequência prática, medida no mesmo dia: `protocolos-geral` 158.516 → 107.402 ms,
# `base-categorias-field` 58.670 → 14.468 ms, `backlog-agendado-futuro` 86.735 →
# 64.014 ms. E `troca-endereco` foi na direção contrária, 1.541 → 33.194 ms, numa
# query de 5.410 linhas — prova de que a banda não é a única fonte de variância e de
# que UMA amostra não descreve nada aqui.
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# ANTES DE TRATAR UM NÚMERO DO HISTÓRICO COMO CUSTO DE GRUPO: A MÁQUINA DORMIU?
# (21/09/2026, ACHADOS #143)
#
# Nenhum número abaixo explica um `duracaoMs` de 8.272.913 ms. Esse é o `medio` de
# 19/09 — 2h17min num grupo de 286 s medidos —, e ele não mediu custo nenhum: mediu o
# tempo em que o processo filho ficou CONGELADO pela Espera S0 do Windows, que
# suspende processo Win32 e mantém a rede de pé. Ao acordar, o socket com o banco
# estava morto e o filho saiu com código 1. O banner leu isso como
# "cargas falharam" e citou as onze queries deste grupo, nenhuma com defeito.
#
# Entre 18 e 21/09/2026 foram 25 falhas: 5 atravessaram um sono (até 10h46min de
# "duração"), ~8 nasceram de 1 s a 110 s depois de a máquina acordar, e ~5 continuam
# sem causa conhecida. A plataforma agora detecta suspensão, mata o filho congelado,
# classifica como `carga-interrompida` em vez de falha e espera 60 s depois de acordar
# antes de começar qualquer coisa. Ver `backend/api/src/agendador.ts`.
#
# PARA MEDIR CUSTO DE GRUPO: descarte qualquer amostra cujo evento `maquina-suspensa`
# caia dentro da janela dela. `npm run refresh:daemon -- --historico` imprime as
# suspensões numa seção própria.
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# REORGANIZADO EM 02/10/2026 — SNAPSHOT DE MADRUGADA + POLLER + INCREMENTAL
# (docs/PLANO-MESTRE.md; docs/PLANO-CARGA.md §3)
#
# O dia deixou de ser "tudo de 15 em 15 a 30 em 30 min". A carga de referência é o
# snapshot completo das 03:00 de Brasília (`docker/cron/crontab-snapshot-diario`, com
# as 23 queries). De dia, cada query fica onde o custo e o frescor pedem:
#
#   quente  15 min  as baratas que mudam de dia e não têm poll (< ~17 s cada)
#   medio   30 min  as pesadas que alimentam o número principal, juntas porque o M
#                   de `backlog-agendado-futuro` junta com PROTOCOLOS GERAL (mesma
#                   idade, ver o comentário do `medio`), e `alocacao-patrimonio` vai
#                   com elas pelo mesmo motivo
#   frio    60 min  as 8 do poller (`realtime-poll.yaml`). Quem dá frescor a elas é o
#                   poll; a hora é REDE DE SEGURANÇA até um dia útil provar o poller
#                   contra a carga (PLANO-MESTRE, passo 5). Depois, saem daqui.
#
# Por que agora: o poller sozinho custava 38,6 min de banco por hora (medido em
# 02/10, `/api/saude` porQuery) e o refresh ~21 — e desde 02/10 a primeira busca do
# poller parte da carga em disco (`#partida` em `poller-realtime.ts`), então um
# reinício da API não abre mais a fresta descrita no comentário do `frio` abaixo.
#
# Conta (médias das cargas de 02/10): quente ~32 s × 4 + medio ~320 s × 2 + frio
# ~131 s × 1 ≈ 15 min/h de banco, contra ~21 antes. Pior tick (os três juntos)
# ≈ 512 s em 900 s, abaixo dos 601 s já observados (ver o comentário do `medio`).
#
# **Os comentários de cada grupo abaixo são o histórico das medições da composição
# ANTERIOR** (quem estava em qual grupo e por quê). As regras deles continuam valendo:
# grupo novo derruba o cache inteiro por ciclo; custo é bytes ÷ banda; meça o grupo.
# ═══════════════════════════════════════════════════════════════════════════════

formato: 1

grupos:
