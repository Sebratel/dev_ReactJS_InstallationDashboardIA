# CIDADE -> SIGLA: a tradução que o modelo aplica, e os cinco lugares onde ela vive.
#
# ARQUIVO HUMANO. `npm run extract` não o toca.
# Guardado por `backend/packages/semantic-model/test/siglas-cidade.test.ts`.
#
# ─────────────────────────────────────────────────────────────────────────────
# POR QUE ESTE ARQUIVO EXISTE
#
# Ele **não é lido por nenhum motor**, e isso é deliberado: as substituições estão
# escritas dentro das `m_expression` e dentro do SQL, onde o Power Query original as
# escreveu. Reescrever cinco queries de produção para lerem daqui é sessão própria,
# com regravação de golden contra o banco real (achado #112).
#
# O que este arquivo é: a **declaração de que as cinco cópias são a mesma coisa**, e
# o teste que quebra quando uma delas divergir. Antes dele, acrescentar uma cidade
# nova ou corrigir uma sigla exigia editar cinco lugares em duas linguagens — e
# esquecer um **não dava erro**: dava dois relatórios discordando sobre a mesma
# cidade, com número plausível dos dois lados.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠ A ORDEM É PARTE DA DEFINIÇÃO
#
# `Replacer.ReplaceText` substitui **substring**, não valor inteiro, e as nove
# chamadas são encadeadas: cada uma recebe o resultado da anterior. Trocar a ordem
# pode mudar o resultado se uma cidade for substring de outra (hoje nenhuma é — mas a
# propriedade não está garantida por nada além do dado de hoje). O SQL de
# `protocolos-produtividade` encadeia `replace()` na MESMA ordem, de propósito, e o
# comentário lá diz isso.
#
# Por isso o teste compara a lista **ordenada**, não o conjunto.

cidade_para_sigla:
  - de: Canoas
    para: CAN
  - de: São Leopoldo
    para: SLE
  - de: Novo Hamburgo
    para: NHO
  - de: Sapucaia Do Sul
    para: SPS
  - de: Nova Santa Rita
    para: NSR
  - de: Brochier
    para: BROCHIER      # a única que não encurta — é assim no original
  - de: Esteio
    para: EIO
  - de: Triunfo
    para: TRF
  - de: Porto Alegre
    para: POA           # aplicada sobre "SIGLA CIDADE", não sobre "CIDADE - Copiar"

# As duas correções literais aplicadas DEPOIS, sobre `INDICE 2` (= BAIRRO & "/" &
# SIGLA CIDADE). Existem porque o bairro de origem tem um espaço sobrando no fim, e o
# original preferiu consertar o resultado a consertar a entrada. Andam junto com o
# mapa nas cinco cópias, então são guardadas aqui também.
correcoes_indice_2:
  - de: "Centro - Assentamento /NSR"
    para: "Centro - Assentamento/NSR"
  - de: "Duque De Caxias /SLE"
    para: "Duque De Caxias/SLE"

# ─────────────────────────────────────────────────────────────────────────────
# ONDE ESTÃO AS CÓPIAS
#
# Camada M (`Table.ReplaceValue`, uma chamada por par):
#   backend/specs/_catalog/queries/protocolos-geral.spec.yaml
#   backend/specs/_catalog/queries/protocolos-auxiliares.spec.yaml
#   backend/specs/_catalog/queries/protocolos-telefonia.spec.yaml
#
# SQL (`replace()` encadeado, DUAS vezes no mesmo arquivo — uma para "SIGLA CIDADE",
# outra dentro de "INDICE 2"):
#   backend/specs/_catalog/queries/protocolos-produtividade.spec.yaml
#
# Esta última é a query que migrou de M para SQL em 10/09/2026 e hoje tem ZERO
# `Table.ReplaceValue`. É o caminho que as outras três devem seguir (achado #112); até
# lá, são quatro arquivos e cinco blocos.

# ─────────────────────────────────────────────────────────────────────────────
# O SEXTO LUGAR, DE OUTRA NATUREZA
#
# `backend/specs/_catalog/tables/protocolos-geral.spec.yaml` tem DAX com as siglas escritas à
# mão, em duas colunas calculadas:
#
#   EQUIPES TEMPORARIAS -> "BASE (NHO/SLE/SPS)", "BASE (EIO/CAN)"
#   GRUPO               -> "Equipe de Reparo EIO/CAN", "Equipe de Tecnologia NHO/SLE/SPS"
#
# **Não é o mesmo mapa** — ali a sigla é rótulo de agrupamento e nome de equipe, não
# tradução de cidade. Mas DEPENDE dele: mudar a sigla de uma cidade aqui sem mexer
# naqueles `IF` deixa o rótulo apontando para uma sigla que não existe mais. O teste
# afirma essa dependência em uma direção só (toda sigla citada no DAX existe neste
# mapa); o contrário não vale, porque nem toda cidade tem base.
#
# E em `GRUPO` a comparação é com o NOME DA EQUIPE, string livre cadastrada no Voalle
# — se lá alguém renomear "Equipe de Reparo EIO/CAN", o `IF` para de casar em silêncio
# e o protocolo cai em "OUTROS". Isso este arquivo não protege; está registrado aqui
# para não ser descoberto duas vezes.

decidido: 2026-09-15
por: "Claude, sob a autorização do Erick de decidir sem perguntar (12/08/2026)"
