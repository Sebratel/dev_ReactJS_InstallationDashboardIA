# GERADO automaticamente por backend/tools/extractor a partir do PBIP.
# NÃO editar à mão sem registrar em docs/SPEC-DRIVEN.md.
spec: measures
table: RETORNO PRIORITARIO
id: retorno-prioritario
measures:
- name: TempoDifFormatado
  format: null
  display_folder: null
  dax: |-
    VAR dtInst = SELECTEDVALUE('RETORNO PRIORITARIO'[data_instalacao])
    VAR dtAbre = SELECTEDVALUE('RETORNO PRIORITARIO'[data_abertura])
    VAR TotalMinutes = DATEDIFF(dtInst, dtAbre, MINUTE)
    VAR Days = QUOTIENT(TotalMinutes, 1440)
    VAR Hours = QUOTIENT(MOD(TotalMinutes, 1440), 60)
    VAR Minutes = MOD(TotalMinutes, 60)
    RETURN
    IF(
        ISBLANK(dtInst) || ISBLANK(dtAbre) || TotalMinutes < 0,
        BLANK(),
        Days & "d " & Hours & "h " & Minutes & "min"
    )
- name: TempoDif_Minutos
  format: "0"
  display_folder: null
  dax: |-
    VAR dtInst = SELECTEDVALUE('RETORNO PRIORITARIO'[data_instalacao])
    VAR dtAbre = SELECTEDVALUE('RETORNO PRIORITARIO'[data_abertura])
    RETURN
    IF(
        ISBLANK(dtInst) || ISBLANK(dtAbre),
        BLANK(),
        DATEDIFF(dtInst, dtAbre, MINUTE)
    )
- name: TempoDifFormatado2
  format: null
  display_folder: null
  dax: |-
    VAR m = [TempoDif_Minutos]
    VAR Days = QUOTIENT(m, 1440)
    VAR Hours = QUOTIENT(MOD(m, 1440), 60)
    VAR Minutes = MOD(m, 60)
    RETURN
    IF(
        ISBLANK(m) || m < 0,
        BLANK(),
        Days & "d " & Hours & "h " & Minutes & "min"
    )
