spec: table
id: calendario-instalado
name: CALENDARIO INSTALADO
query_ref: null
table_dax: |-
  CALENDAR(
                      MIN('PROTOCOLOS GERAL'[DATA INSTALAÇÃO]),
                      DATE(2026,12,31))
columns:
- name: DATA INSTALADO
  type: null
  format: Short Date
  source_column: "[Date]"
  calculated: false
  dax: null
- name: DATA_VIGENTE_INSTALADO
  type: null
  format: null
  source_column: null
  calculated: true
  dax: "IF('CALENDARIO INSTALADO'[DATA INSTALADO] <= TODAY(), \"Sim\", \"Não\")"
- name: DentroDoIntervalo
  type: null
  format: "0"
  source_column: null
  calculated: true
  dax: |-

    VAR DataCentral = TODAY()
    VAR DataFinal = DataCentral + 7
    RETURN
        IF(
            'CALENDARIO INSTALADO'[DATA INSTALADO] >= DataCentral && 
            'CALENDARIO INSTALADO'[DATA INSTALADO] <= DataFinal,
            1,
            0
        )
- name: PESO
  type: null
  format: null
  source_column: null
  calculated: true
  dax: |-

    VAR DataAtual = TODAY() 
    VAR MesAtual = MONTH(DataAtual)
    VAR AnoAtual = YEAR(DataAtual)
    VAR Feriado = 
        NOT(ISBLANK(LOOKUPVALUE(FERIADOS[Feriado], FERIADOS[Data], 'CALENDARIO INSTALADO'[DATA INSTALADO])))

    RETURN 
            IF(Feriado, 0,
                SWITCH(
                    'CALENDARIO INSTALADO'[DIA_SEMANA], 
                    "domingo", 0,
                    --"sábado", 0.5, -- Cerqueira afirmou que o sábado era 100% 19/05/2025 12:00
                    1
                )
            )
- name: DIA_SEMANA
  type: null
  format: null
  source_column: null
  calculated: true
  dax: "FORMAT('CALENDARIO INSTALADO'[DATA INSTALADO], \"dddd\")"
measure_count: 2
