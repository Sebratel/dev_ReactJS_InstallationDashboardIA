- name: "DATA INSTALAÇÃO"
  type: null
  format: Short Date
  source_column: null
  calculated: true
  dax: |-

    IF(
        ISBLANK('PROTOCOLOS GERAL'[DATA ALOCAÇÃO]) && 
        'PROTOCOLOS GERAL'[TIPO DE PROTOCOLO] = "TEC - Migração com troca de Equipamento" && 
        'PROTOCOLOS GERAL'[EQUIPE] = "Financeiro" &&
        'PROTOCOLOS GERAL'[DATA AGENDA] <= TODAY(), 
        'PROTOCOLOS GERAL'[DATA AGENDA],
        IF(
            'PROTOCOLOS GERAL'[TIPO DE PROTOCOLO] IN {
                "TEC - Troca de Endereço",
                "#HR - TEC - Troca de Endereço"
            }, 
            'PROTOCOLOS GERAL'[DATA DA TROCA],
            'PROTOCOLOS GERAL'[DATA ALOCAÇÃO]
        )
    )
