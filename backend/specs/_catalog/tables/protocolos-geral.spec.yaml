- name: TMA
  type: null
  format: null
  source_column: null
  calculated: true
  dax: |-

    VAR DataCriado = 'PROTOCOLOS GERAL'[DATA CRIADO]
    VAR DataEncerramento = 'PROTOCOLOS GERAL'[DATA INSTALAÇÃO]
    VAR DataAtual = 'PROTOCOLOS GERAL'[DATA ENCERRADO]
    VAR Stats = 'PROTOCOLOS GERAL'[STATUS]
    VAR DiferencaDias = 
        IF(
            OR(Stats = "Encerrado", Stats = "Cancelado") && ISBLANK(DataEncerramento),
            BLANK(),
            IF(
                ISBLANK(DataEncerramento),
                DATEDIFF(DataCriado, DataAtual, DAY),
                DATEDIFF(DataCriado, DataEncerramento, DAY)
            )
        )
    RETURN
        FORMAT(DiferencaDias, "0") & " Dias"
- name: TMA_DIAS
  type: null
  format: "0"
  source_column: null
  calculated: true
  dax: |-

    VAR DataCriado = 'PROTOCOLOS GERAL'[DATA CRIADO]
    VAR DataEncerramento = 'PROTOCOLOS GERAL'[DATA INSTALAÇÃO]
    VAR DataAtual = TODAY()
    VAR DiferencaDias = 
        IF(
            ISBLANK(DataEncerramento),
            DATEDIFF(DataCriado, DataAtual, DAY),
            DATEDIFF(DataCriado, DataEncerramento, DAY)
        )
    RETURN
    DiferencaDias
- name: TMA_HORA_AGENDA
  type: null
  format: null
  source_column: null
  calculated: true
  dax: |-

    VAR DataCriado = 'PROTOCOLOS GERAL'[DATA CRIADO]
    VAR DataAgendamento = 'PROTOCOLOS GERAL'[DATA AGENDA]
    VAR DataEncerramento = 'PROTOCOLOS GERAL'[DATA INSTALAÇÃO]
    VAR DataAtual = NOW()
    VAR DiferencaMinutos = 
        IF(
            ISBLANK(DataEncerramento),
            IF(
                ISBLANK(DataAgendamento),
                DATEDIFF(DataCriado, DataAtual, MINUTE),
                DATEDIFF(DataCriado, DataAgendamento, MINUTE)
            ),
            DATEDIFF(DataCriado, DataEncerramento, MINUTE)
        )
    VAR Horas = INT(DiferencaMinutos / 60)
    VAR Minutos = MOD(DiferencaMinutos, 60)
    RETURN
    Horas & " Horas " & Minutos & " Minutos"
