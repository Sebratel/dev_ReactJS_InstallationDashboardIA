- name: Base Dia
  type: null
  format: null
  source_column: null
  calculated: true
  dax: |-

    VAR ProtocoloAtual =
        'Status Protocolo Dia'[protocolo]

    VAR DiaAtual =
        'Status Protocolo Dia'[Dia]

    RETURN
    CALCULATE (
        MAX ( 'FIELD AGENDA'[Base] ),
        FILTER (
            'FIELD AGENDA',
            'FIELD AGENDA'[protocolo] = ProtocoloAtual
                && TRUNC ( 'FIELD AGENDA'[Slot Agenda] ) = DiaAtual
        )
    )
