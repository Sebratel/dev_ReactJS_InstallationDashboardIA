# MANTIDO POR HUMANOS — este arquivo NÃO é sobrescrito por `npm run extract`.
#
# Quem abre cada aba do dashboard. APLICADO desde 13/10/2026 por
# `backend/api/src/permissoes.ts` — o mesmo modelo do dashboard comercial
# (`dados_ReactJS_CommercialDashboards`), com a configuração aqui em vez de numa
# tela de admin, porque a API é somente leitura.
#
# COMO FUNCIONA
#   - admin: abre TODAS as abas. Vem de `admins:` abaixo OU de `ADMIN_EMAILS` no .env
#     (separado por vírgula). O que está no .env vale mesmo com este arquivo quebrado.
#   - qualquer outra conta @sebratel logada: abre SÓ as abas que a liberam.
#   - cada aba:  modo: lista  → só os e-mails de `emails:`  (o padrão)
#                modo: todos  → toda conta logada do domínio
#   - aba que não aparece aqui, ou com `emails: []`: só admin.
#
# FALHA FECHADA. Chave com erro de digitação, aba que não existe, e-mail sem `@` ou
# YAML ilegível invalidam o arquivo INTEIRO: até a correção, só ADMIN_EMAILS entra, o
# log da API diz a linha do problema (`[permissoes] INVÁLIDO ...`) e `/api/saude`
# mostra `permissoes.ok: false`.
#
# MUDAR ACESSO: edite, commit, e a API relê sozinha em até 2 s (sem reiniciar). No
# container o `backend/specs/` vai dentro da imagem — lá, ou se reconstrói a imagem
# ou se monta um arquivo de fora com `PERMISSOES_ARQUIVO=/caminho/permissoes.yaml`.
#
# O QUE ISTO NÃO FAZ: recorte de linha dentro da aba (o gestor ver só a própria
# equipe). `linhas:` tem de ficar vazio — preenchido, o arquivo é recusado, porque
# declarar um recorte que nada aplica daria falsa segurança. Quando entrar,
# `backend/api/src/escopo-cache.ts` muda ANTES (o cache é compartilhado entre quem
# vê a mesma aba).

admins:
  - erick.azambuja@sebratel.com.br

