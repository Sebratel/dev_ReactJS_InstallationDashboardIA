# Cadência do poller de "quase-realtime" — SELECT direto no Voalle a cada poucos
# segundos, para detectar mudança e servir dado mais fresco sem F5. MANTIDO POR
# HUMANOS, como incremental.yaml e cache-policies.yaml.
#
# **Por que isto NÃO mora em incremental.yaml.** A marca de lá é truncada em dia
# (`comoDia`/`desdeDe`, YYYY-MM-DD) — certo para um refresh que roda por hora ou
# por dia, errado aqui: um poller a cada 12s que só sabe pedir "desde hoje"
# rebuscaria o dia inteiro a cada volta, o oposto do que isto existe para fazer.
# Aqui a marca é um TIMESTAMP de verdade, com margem em segundos, não em dias.
#
# **O que isto NÃO faz.** Não escreve no snapshot em disco (isso derrubaria o
# carimbo global e, com ele, o cache de TODAS as páginas a cada poll — ver
# docs/DECISAO-REALTIME.md e ACHADOS #89). O resultado fica em memória, no
# processo da API, e é isso que `backend/api/src/poller-realtime.ts` administra.
#
# **Sete queries hoje (03/09/2026, ACHADOS #92 e #93).** Ver ACHADOS #92/#93
# para a investigação completa das outras 17 queries do catálogo e por que
# cada uma ficou de fora:
#
#   - `contratos`, `contratos-telefonia`, `alocacao-patrimonio`,
#     `consolidado-clientes`: chave de linha fraca ou ausente — sem um id único
#     na SELECT final, o merge por chave do poller (`identidade()` em
#     `poller-realtime.ts`) pode colapsar linhas distintas em silêncio (ex.:
#     `contratos-telefonia` com `TELEFONE CONTRATO` nulo). Não é o mesmo risco
#     de "cobertura parcial" já aceito abaixo — é risco de **linha errada**.
#   - `protocolos-geral`, `protocolos-produtividade`: **a premissa desta entrada
#     morreu, e o caminho está aberto desde 09/09/2026 — ver ACHADOS #130.** O que
#     estava escrito aqui: "sem snapshot base nenhum (heap OOM / nunca materializa
#     — achados #81/#83)... Sem snapshot base, não há disco para o overlay
#     sobrepor". O diagnóstico do ACHADOS #93 estava certo sobre a causa — o
#     estouro era o motor de M mantendo uma cópia inteira da tabela por passo do
#     `let` — e foi exatamente essa causa que o commit af82774 atacou em 09/09
#     (`guardaPassos: false`), com o título "protocolos-geral volta a caber em
#     8 GB".
#
#     Medido em 16/09/2026: `protocolos-geral` materializa em **79.966 ms**
#     (95.278 linhas × 63 colunas) e `protocolos-produtividade` está no grupo
#     `frio` de `refresh.yaml` desde 13/09, com 162 s de materialização. **As duas
#     têm snapshot base em disco.** A premissa que as excluía daqui não existe
#     mais.
#
#     **Não entraram ainda, e isso é deliberado.** Um bloco novo aqui exige
#     escolher `chave` e `marca`, e a primeira entrada desta lista é sobre
#     exatamente o que acontece quando se erra a chave: `identidade()` colapsa
#     linhas distintas **em silêncio**. `protocolos-geral` alimenta 12 das 14 telas
#     — é a pior tabela do catálogo para descobrir uma chave errada em produção.
#     A urgência também caiu: ela entrou no grupo `medio` do `refresh.yaml` em
#     16/09 e já não está sem cadência nenhuma. Quem for implantar: comece pela
#     chave, prove-a contra o arquivo real, e só então escreva o bloco.
#   - `field-agenda`, `field-agenda-slot`: têm um caminho viável NÃO
#     implementado ainda — ACHADOS #93 confirmou ao vivo que `LEFT JOIN
#     assignments a ON a.id = vsdspi.assignment_id` funciona, é barato (sem
#     diferença de tempo medível) e `a.modified` viria preenchido. Não
#     implementado porque falta resolver duas coisas antes: (1) qual tabela do
#     modelo a query realmente alimenta — `field-agenda-slot` declara
#     `origin: table:FIELD AGENDA`, ou seja, o overlay teria que mirar
#     "FIELD AGENDA", a MESMA tabela com as colunas calculadas mais sensíveis
#     do catálogo (Rank*, Categoria*, achados #85/#86/#87); (2) rank é relativo
#     à partição inteira — uma linha nova no overlay não recalcula o rank das
#     outras da mesma partição, diferente do gap "coluna em branco" que
#     `TempoTotalDias`/`_marca_manutencao` toleram bem hoje. Decisão separada.
#   - `base-categorias-field`: verificado ao vivo contra
#     `information_schema.columns` — `assignment_incidents` (a única tabela
#     Voalle que ela toca) não tem NENHUMA coluna de modificação de linha, só
#     timestamps de integração SAP (`sap_modified_integration`), que não é a
#     mesma coisa.
#   - `apuracao-premiacao`, `capacidade-equipe`, `quadro-funcional` (Google
#     Sheets), `clima-tempo` (API), `feriados` (inline), `hora-atualizado`
#     (computed): sem SQL nenhum para costurar — o mecanismo deste arquivo não
#     se aplica.
#   - `backlog-agendado-futuro`, `backlog-instalacao`: medidas ao vivo em
#     ACHADOS #93 (58-60ms, 5.875 e 93.083 linhas) — rápidas, mas SEM nenhuma
#     coluna de modificação por linha (só carimbo de LOTE de carga, poucos
#     valores distintos para muitas linhas). Não são candidatas a poller;
#     entraram no grupo `quente` de `refresh.yaml` em vez disso.
#   - `gestores-equipes` (dbMaria): não medida nesta rodada, continua fora.
#
# **`instalacoes-reincidentes` e `reincidencia` — a extensão mecânica FOI
# rejeitada, mas a reescrita correta existe.** Cada uma ganhou uma CTE `alvos`
# (UNION de "ramo A mudou" / "ramo B mudou", igual `incremental.yaml` já faz
# para `protocolos-produtividade`) que filtra só QUAIS chaves entram no
# resultado — as CTEs internas (`instalacoes`/`manutencoes`,
# `primeira_instalacao`/`primeiro_suporte`) continuam rodando SEM filtro de
# `:desde`, sempre com o conjunto completo, então `ROW_NUMBER()`/`PARTITION BY`
# nunca vê um subconjunto parcial — elimina o risco de linha errada.
# Verificado ao vivo: com `:desde` no passado, o resultado costurado bate
# byte-a-byte com a contagem da query original (21.938 e 1.363 linhas); com
# `:desde` = agora, 0 linhas. Custo por volta (medido): ~2-4s cada, porque o
# filtro só reduz a SAÍDA, não o CÁLCULO — por isso o `intervalo_ms` das duas
# é 30000, não 12000: 30s ainda é ~40x mais rápido que o refresh de 20min, sem
# martelar o Voalle a cada 12s com uma consulta que sempre recomputa tudo.
#
# **As duas ganharam colunas técnicas novas** (`_marca_instalacao`,
# `_marca_manutencao`, `_marca_suporte`) — sintéticas, hand-edit, sem
# precedente no PBIP. Elas aparecem na SELECT final só para o poller conseguir
# avançar o relógio (`marcaDe()`) e podar o delta (`podaDelta()`); linhas
# antigas do disco não as têm, e ficam BLANK nas colunas calculadas que
# dependem de dados dessas linhas (`TempoTotalDias`/`TempoDifFormatado` em
# `REINCIDÊNCIA`, `TempoTotalDias` em `RETORNO PRIORITARIO`) até o próximo
# refresh completo recalculá-las — confirmado que isso é BLANK, não erro:
# `backend/packages/measure-engine` já trata chave ausente de linha como `?? BLANK`
# em vários pontos (`evaluator.ts`, `indice.ts`), nunca lança exceção.
#
# **O mesmo buraco que `incremental.yaml` já documenta, e não um novo**: cada
# query aqui só vê o que passa por `assignments.modified` (ou equivalente) —
# mudança que more só num JOIN lateral (alocação de patrimônio parece um caso
# à parte, RAUX outro) não entra. Registrado por query nos comentários de
# `costura` abaixo quando o caminho de dado é mais indireto que
# `protocolos-auxiliares`.

formato: 1

# **Sentinela (PLANO-MESTRE B.1b, 09/10/2026, ACHADOS #201).** `assignments` tem 7,3 GB e
# nenhum índice em `modified`: toda costura por `a.modified >= :desde` paga uma varredura
# (~0,9 s medido), e as cinco que só dependem disso pagavam cada uma a sua, a cada volta,
# mudasse algo ou não. A sentinela faz UMA varredura por volta e diz quais tarefas mudaram;
# uma query com `sentinela:` só vai ao banco quando apareceu tarefa NOVA no escopo dela
# (`poller-realtime.ts`, `#dispensa`). Medido às 16h de 09/10 (horário comercial), em 1 h:
# auxiliares tinha mudança em 75 de 120 janelas de 30 s; troca em 21; telefonia e retorno
# em 1; técnicos (RAUX) em 0.
#
# Na dúvida, roda: nunca rodou, a última falhou, a sentinela atrasou ou falhou, ou passou
# `teto_sem_rodar_ms`. O teto cobre o que a sentinela não enxerga e a costura também não
# enxergava direito: tarefa que mudou de tipo, commit mais lento que a margem.
#
# **Só entra aqui query cujo ÚNICO `:desde` é `a.modified`** — o teste
# `poller-realtime.test.ts` confere isso e confere que todo tipo citado na costura está no
# escopo. `field-agenda`, `alocacao-patrimonio` e as duas de reincidência olham outras
# tabelas (agenda, patrimônio, relatos) e seguem no próprio intervalo.
sentinela:
  intervalo_ms: 12000
  margem_segundos: 30
  teto_sem_rodar_ms: 300000
  sql: |-
    SELECT a.id::text AS id,
           a.modified,
           a.assignment_type AS tipo_de_tarefa,
           array_agg(DISTINCT ai.incident_type_id::text)
             FILTER (WHERE ai.incident_type_id IS NOT NULL) AS tipos
    FROM assignments a
    LEFT JOIN assignment_incidents ai ON ai.assignment_id = a.id
    WHERE a.modified >= :desde
    GROUP BY a.id, a.modified, a.assignment_type

queries:
  protocolos-auxiliares:
    tabela: PROTOCOLOS AUXILIARES
    # 12 s → 30 s: Medido em 02/10/2026 (`/api/saude`, porQuery): cada volta recalcula a query
    # inteira mesmo sem mudança, e o poller somava 38,6 min de banco por hora com 0
    # mudanças — o dobro do refresh. Com a sentinela, 30 s é o intervalo MÍNIMO entre
    # voltas: ela só roda quando há tarefa nova dos dez tipos (2,2–7 s por volta, 09/10).
    intervalo_ms: 30000
    # Folga contra relógio torto — mesmo papel de margem_dias em incremental.yaml,
    # só que em segundos porque a marca aqui é timestamp, não dia.
    margem_segundos: 30
    # Grupo reentregue inteiro — mesma semântica de `mescla()` em incremental.ts.
    chave: [SOLICITACAO]
    # Máximo entre criação e modificação — mesma armadilha 1 de incremental.ts.
    marca: [DATA CRIADO, DATA ENCERRADO]
    sentinela:
      tipos: ['12', '1014', '1254', '1255', '1136', '249', '268', '1160', '1015', '15']
    # Três costuras (B.1d, 09/10, ACHADOS #202). A primeira é o recorte. As outras duas
    # restringem as CTEs `alocacao` e `troca`, que rodavam inteiras a cada volta para casar
    # com meia dúzia de solicitações, às que a volta trouxe (`base`). Não muda resultado:
    # `alocacao` não tem janela, e `troca` particiona por protocolo — filtrar protocolo
    # inteiro não muda o vencedor de nenhuma partição. Provado no mesmo instantâneo
    # (REPEATABLE READ): 72 h, 1.405 linhas, e 30 dias, 5.182 linhas — 0 diferenças;
    # 5,97 s → 2,12 s na janela de 72 h.
    costura:
      - de: |-
          WHERE it.id IN ('12', '1014', '1254', '1255', '1136', '249', '268', '1160', '1015', '15') -- Filtrando os tipos de protocolo
                AND a.created >= DATE_TRUNC('year', CURRENT_DATE)
        para: |-
          WHERE it.id IN ('12', '1014', '1254', '1255', '1136', '249', '268', '1160', '1015', '15') -- Filtrando os tipos de protocolo
                AND a.created >= DATE_TRUNC('year', CURRENT_DATE)
                AND a.modified >= :desde
      - de: |-
          AND plis.out_date > DATE_TRUNC('year', CURRENT_DATE)
        para: |-
          AND plis.out_date > DATE_TRUNC('year', CURRENT_DATE)
                  AND a.title IN (SELECT "SOLICITACAO" FROM base)
      - de: |-
          OR r.description LIKE '%Foi feita a instalação?%')
        para: |-
          OR r.description LIKE '%Foi feita a instalação?%')
                    AND ai.protocol IN (SELECT "N°PROTOCOLO" FROM base)

  # "DATA ENCERRRADO" com 3 R — mesmo typo do PBIP original em
  # protocolos-telefonia.spec.yaml, preservado de propósito: `marca` precisa
  # citar o nome EXATO da coluna, e "corrigir" o typo aqui quebraria o match.
  protocolos-telefonia:
    tabela: PROTOCOLOS TELEFONIA
    intervalo_ms: 12000
    margem_segundos: 30
    chave: [SOLICITACAO]
    marca: [DATA CRIADO, DATA ENCERRRADO]
    sentinela:
      tipos: ['1011', '275', '269']
    costura:
      de: |-
        where (it.id = '1011'or --- TEC - Instalação Telefonia
        			   it.id = '275' OR
        			   it.id = '269') --- TEC - Instalação Telefonia com Portabilidade - Telefonia
        	and a.created >= '2025-01-01')
      para: |-
        where (it.id = '1011'or --- TEC - Instalação Telefonia
        			   it.id = '275' OR
        			   it.id = '269') --- TEC - Instalação Telefonia com Portabilidade - Telefonia
        	and a.created >= '2025-01-01'
        	and a.modified >= :desde)

  # `assignments` aqui só é ponte de JOIN (nunca teve coluna própria
  # selecionada) — "_MARCA_REALTIME" é 100% sintética, adicionada por hand-edit
  # em troca-endereco.spec.yaml em 03/09/2026 (ACHADOS #92), não herdada do
  # PBIP. Cobertura não comprovada: o filtro de negócio real é sobre
  # `reports.final_date`, não sobre `assignments` — uma troca de endereço nova
  # pode não tocar `assignments.modified`. Vigiar mesmo assim porque o pior
  # caso é o mesmo de hoje (sem poller nenhum): a tela demora até o próximo
  # refresh, nunca mostra dado errado.
  troca-endereco:
    tabela: "TROCA ENDEREÇO"
    intervalo_ms: 12000
    margem_segundos: 30
    chave: [PROTOCOLO]
    marca: [_MARCA_REALTIME]
    sentinela:
      tipos: ['15', '1256']
    costura:
      de: |2-
                DATE(r.final_date) >= '2025-01-01'
                AND it.id in ('15', '1256')
      para: |2-
                DATE(r.final_date) >= '2025-01-01'
                AND it.id in ('15', '1256')
                AND a.modified >= :desde

  # Mesma ressalva de troca-endereco: "_MARCA_REALTIME" é sintética
  # (hand-edit, ACHADOS #92), sem precedente no PBIP. `chave` tem `:` literal —
  # tem que vir entre aspas em YAML.
  tecnicos-auxiliares:
    tabela: TECNICOS AUXILIARES
    intervalo_ms: 12000
    margem_segundos: 30
    chave: ["PROTOCOLO:"]
    marca: [_MARCA_REALTIME]
    sentinela:
      tipos_de_tarefa: [RAUX]
    costura:
      de: |2-
              and a.assignment_type = 'RAUX'
              and a.final_date >= DATE_TRUNC('year', CURRENT_DATE)
      para: |2-
              and a.assignment_type = 'RAUX'
              and a.final_date >= DATE_TRUNC('year', CURRENT_DATE)
              and a.modified >= :desde

  # Cobre só a CTE `retorno_prioritario` (a metade "quente" da query) — a
  # outra metade, `primeira_instalacao`, não expõe nenhuma coluna de
  # `assignments` e fica de fora (evento passado e estável, não o que dá nome
  # à query). "_MARCA_REALTIME" é sintética (hand-edit, ACHADOS #92).
  retorno-prioritario:
    tabela: RETORNO PRIORITARIO
    intervalo_ms: 12000
    margem_segundos: 30
    chave: ["Protocolo Retorno Prioritário"]
    marca: [_MARCA_REALTIME]
    sentinela:
      tipos: ['1160']
    costura:
      de: |-
        WHERE ai.incident_type_id = '1160'
              AND is2.title <> 'Cancelado'
              AND a.created >= DATE_TRUNC('year', CURRENT_DATE)
      para: |-
        WHERE ai.incident_type_id = '1160'
              AND is2.title <> 'Cancelado'
              AND a.created >= DATE_TRUNC('year', CURRENT_DATE)
              AND a.modified >= :desde

  # `alvos` reescrito (ACHADOS #93) — NÃO copiar o padrão de `protocolos-auxiliares`
  # aqui: `instalacoes`/`manutencoes` (as CTEs internas) nunca são filtradas por
  # `:desde`, sempre rodam completas, e só a lista final de chaves é restrita. A
  # versão ingênua (filtrar `manutencoes` direto) reescreveria "SIM" por "NÃO" em
  # reincidência real — verificado ao vivo: com `:desde` no passado, 21.938 linhas,
  # idêntico à query original sem costura nenhuma.
  instalacoes-reincidentes:
    tabela: "INSTALAÇÕES REINCIDENTES"
    # **Poda por partição (PLANO-MESTRE B.1d, 14/10/2026).** A costura anterior filtrava
    # só a SAÍDA: `instalacoes`/`manutencoes`/`ROW_NUMBER` rodavam sobre o ano inteiro a
    # cada volta — 8,2 s medidos em 14/10 (2,9 min/h no poller). Agora `mudadas` (as
    # tarefas com `modified >= :desde`, a mesma varredura de `assignments` que a volta já
    # pagava) dá os CONTRATOS tocados, e as duas CTEs só leem esses contratos: 1,3 s na
    # volta normal, 2,2 s numa janela de 26 h (o `RECUO_MAXIMO_MS`).
    #
    # **Exato só porque cada protocolo de instalação tem UM contrato.** A janela particiona
    # por `protocolo_instalacao` e a poda é por `contract_id`: um protocolo em dois
    # contratos, com só um deles tocado, teria a partição lida pela metade. Medido em
    # 14/10: 0 de 25.291 protocolos do ano com mais de um contrato, 0 sem contrato.
    # Prova da mesma data, janela de 26 h: os 397 protocolos da costura antiga estão
    # todos na nova (997 — `alvos` é superconjunto, o resto volta igual e o poller
    # descarta). As únicas diferenças contra a query completa são `data_hora_saida`/
    # `data_instalacao` — o EMPATE que a query original já tem (vários itens de
    # patrimônio por protocolo, e sem manutenção o `ROW_NUMBER` não desempata); a costura
    # antiga diverge da completa do mesmo jeito.
    intervalo_ms: 120000
    margem_segundos: 30
    chave: [protocolo_instalacao]
    marca: [_marca_instalacao, _marca_manutencao]
    costura:
    - de: |-
        WITH instalacoes AS (
      para: |-
        WITH mudadas AS (
            SELECT a.id FROM assignments a WHERE a.modified >= :desde
        ),
        alvos AS (
            SELECT cst.contract_id
            FROM patrimony_packing_lists ppl
            JOIN mudadas m ON m.id = ppl.assignment_id
            JOIN contract_service_tags cst ON cst.id = ppl.contract_service_tag_id
            UNION
            SELECT cst.contract_id
            FROM assignment_incidents ai
            JOIN mudadas m ON m.id = ai.assignment_id
            JOIN contract_service_tags cst ON cst.id = ai.contract_service_tag_id
        ),
        instalacoes AS (
    - de: |-
        AND plis.out_date >= DATE_TRUNC('year', CURRENT_DATE)
      para: |-
        AND plis.out_date >= DATE_TRUNC('year', CURRENT_DATE)
              AND cst.contract_id = ANY(ARRAY(SELECT contract_id FROM alvos))
    - de: |-
        AND t.id IN ('1050', '65', '1065', '1064', '1063', '1062', '1085')
      para: |-
        AND t.id IN ('1050', '65', '1065', '1064', '1063', '1062', '1085')
            AND cst.contract_id = ANY(ARRAY(SELECT contract_id FROM alvos))

  reincidencia:
    tabela: "REINCIDÊNCIA"
    # **Poda por partição (PLANO-MESTRE B.1d, 14/10/2026).** As duas CTEs particionam por
    # `cst.id` (o `service_tag_id`), então filtrar pela chave da partição ANTES da janela
    # dá o mesmo `rn` em cada partição lida — é a chave da partição, não um subconjunto
    # das linhas dela. A costura anterior filtrava só a saída e recalculava o ano inteiro:
    # 11,9 s medidos em 14/10 (3,9 min/h no poller); agora 1,1–1,5 s, 3,5 s em 26 h.
    #
    # `= ANY(ARRAY(...))`, não `IN (SELECT ...)`: com o `IN` o planejador refazia a
    # `primeiro_suporte` por varredura a cada linha de fora (12 × 140 ms); o ARRAY vira
    # busca pelo índice de `contract_service_tag_id` — o mesmo truque da `field-agenda`.
    # Prova de 14/10, janela de 26 h: as 17 linhas da costura antiga estão todas nas 63
    # da nova, e as 63 são idênticas às da query completa.
    intervalo_ms: 120000
    margem_segundos: 30
    chave: [service_tag]
    marca: [_marca_instalacao, _marca_suporte]
    costura:
    - de: |-
        WITH primeira_instalacao AS (
      para: |-
        WITH mudadas AS (
            SELECT a.id FROM assignments a WHERE a.modified >= :desde
        ),
        alvos AS (
            SELECT ppl.contract_service_tag_id AS service_tag_id
            FROM patrimony_packing_lists ppl
            JOIN mudadas m ON m.id = ppl.assignment_id
            UNION
            SELECT ai.contract_service_tag_id
            FROM assignment_incidents ai
            JOIN mudadas m ON m.id = ai.assignment_id
        ),
        primeira_instalacao AS (
    - de: |-
        WHERE it.id IN ('12', '1014', '1254', '1255', '1136', '249', '275', '1011', '1015')
        ),
        primeiro_suporte AS (
      para: |-
        WHERE it.id IN ('12', '1014', '1254', '1255', '1136', '249', '275', '1011', '1015')
              AND ppl.contract_service_tag_id = ANY(ARRAY(SELECT service_tag_id FROM alvos))
        ),
        primeiro_suporte AS (
    - de: |-
        WHERE a.created >= DATE_TRUNC('year', CURRENT_DATE)
      para: |-
        WHERE a.created >= DATE_TRUNC('year', CURRENT_DATE)
            AND ai.contract_service_tag_id = ANY(ARRAY(SELECT service_tag_id FROM alvos))

  # FIELD AGENDA — a VISÃO PRODUTIVA em tempo real (pedido do Erick, 02/10/2026;
  # ACHADOS #166 e #169). Primeira query em DOIS PASSOS: a costura de
  # incremental.yaml custa 11–12 s por volta qualquer que seja a janela, porque a
  # view do Voalle calcula as janelas sobre todo o histórico de atendimento antes
  # de filtrar.
  #
  #   1. `alvos` — quais solicitações com agenda recente (7 dias) mudaram desde `:desde`.
  #      Os mesmos quatro ramos da costura de incremental.yaml (solicitação,
  #      histórico de atendimento, relato, slot; o porquê de cada um está lá), com
  #      a janela num ARRAY materializado: cada ramo vira busca pelo índice da
  #      própria tabela. `assignments` não tem índice em created/modified, e o
  #      `JOIN` da costura a varria inteira (830 ms). Medido: ~0,7 s a quente.
  #   2. `busca_por_ids` — só essas solicitações, com a view RECORTADA por dentro
  #      (`backend/api/src/busca-por-ids.ts`): 67 ms para 1 id, 2,6 s para 400;
  #      paridade com a view, 0 divergências em 6.736 linhas.
  #
  # `colunas_calculadas`: as 7 da FIELD AGENDA dependem só da linha ou do protocolo
  # (`RankDataProtocolo` filtra pelo mesmo protocolo), e a busca traz o protocolo
  # inteiro — calcular sobre as linhas buscadas dá o valor do snapshot.
  #
  # **A detecção vigia só agendas dos últimos 7 dias e futuras** (02/10/2026, ACHADOS
  # #171): 2.220 solicitações em vez de 23.191, ~140 ms em vez de ~780 ms (com picos de
  # 2–11 s). Medido: das 964 solicitações que mudaram desde a manhã de 01/10, 956 estavam
  # na janela de 7 dias (99,2%); nas últimas 24 h, 815 de 817. As de fora não se perdem —
  # chegam pelo refresh em lote (`frio`, 30 min), que cobre os 3 meses. A BUSCA continua
  # com a janela de 3 meses do `sql:`: o protocolo vem inteiro, como no snapshot.
  #
  # 30 s, não 12: relato e baixa de equipamento mudam na escala de minutos, e a
  # volta custa ~1 s de banco — 30 s deixa o Voalle ocupado ~4% do tempo com isto.
  field-agenda:
    tabela: FIELD AGENDA
    intervalo_ms: 30000
    margem_segundos: 60
    chave: [Protocolo]
    marca: [Data Criado, Inicio relato, Fim relato, Data Relato]
    colunas_calculadas: true
    busca_por_ids:
      view: v_service_desk_slots_productivity_informative
    alvos: |-
      WITH j AS MATERIALIZED (
          SELECT array_agg(DISTINCT fah.reserved_assignment_id) AS ids
          FROM fsm_attendance_history fah
          WHERE fah.begin_date_slot >= (CURRENT_DATE - INTERVAL '7 days')
      )
      SELECT a.id FROM assignments a, j
      WHERE a.id = ANY(j.ids) AND GREATEST(a.created, COALESCE(a.modified, a.created)) >= :desde
      UNION
      SELECT f.reserved_assignment_id FROM fsm_attendance_history f, j
      WHERE f.reserved_assignment_id = ANY(j.ids)
        AND GREATEST(f.begin_date, COALESCE(f.end_date, f.begin_date), COALESCE(f.reserved_date, f.begin_date)) >= :desde
      UNION
      SELECT r2.assignment_id FROM reports r2, j
      WHERE r2.assignment_id = ANY(j.ids)
        AND GREATEST(r2.created, COALESCE(r2.modified, r2.created), COALESCE(r2.beginning_date, r2.created)) >= :desde
      UNION
      SELECT s.pre_reserved_assignment_id FROM service_desk_slots s, j
      WHERE s.pre_reserved_assignment_id = ANY(j.ids)
        AND GREATEST(s.created, COALESCE(s.modified, s.created)) >= :desde

  # ALOCAÇÃO PATRIMONIO — o "Produtivo" da VISÃO PRODUTIVA em tempo real (PLANO-MESTRE
  # §A.1, ACHADOS #167 e #192). Ela ficava de fora por chave fraca (o topo deste arquivo):
  # uma solicitação tem vários itens, e a costura traz só o item que mudou. Aqui isso não
  # erra linha nenhuma, porque esta tabela NÃO existe no modelo: o overlay dela não é
  # mesclado em tabela física, só alimenta os pares (protocolo, dia instalado) da tradução
  # nativa de `Status Protocolo Dia` (`aoVivo` em nativas.ts), e só para protocolo que a
  # carga em lote conhece SEM data de instalação. Item antigo que o grupo perdeu já está
  # na carga — e aí vale a data dela.
  #
  # O servidor entrega este overlay e invalida SÓ as páginas que carregam a calculada
  # (`calculadasAlimentadasAoVivo`). Pelo fechamento de queries ela não chegaria a página
  # nenhuma: entra na PG pelo M, e o planejador lista só a query que vira tabela.
  #
  # `it.id <> '15'`: na troca de endereço o "Produtivo" vem de DATA DA TROCA, não da
  # alocação. `GREATEST(created, modified)`: correção de item também conta.
  #
  # 60 s, não 30: medido em 09/10/2026 ~1 s por volta (964–1195 ms), o MESMO com janela de
  # 1 h ou 24 h — sem índice em created/modified, é varredura. O #167 tinha 0,2 s. A
  # alocação já chega ~41 min depois do relato (processo), então 30 s a mais não aparecem
  # na tela, e o banco ganha 1 min por hora.
  alocacao-patrimonio:
    tabela: "ALOCAÇÃO PATRIMONIO"
    intervalo_ms: 60000
    margem_segundos: 60
    chave: [SOLICITACAO]
    marca: [DATA HORA SAIDA]
    costura:
      de: "AND plis.out_date >= '2025-01-01'"
      para: |-
        AND plis.out_date >= '2025-01-01'
          AND it.id <> '15'
          AND GREATEST(plis.created, COALESCE(plis.modified, plis.created)) >= :desde
