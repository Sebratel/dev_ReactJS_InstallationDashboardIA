# MANTIDO POR HUMANOS — o recorte que a fonte ao vivo costura no SQL do catálogo
# (docs/DECISAO-AO-VIVO.md). Mesmo formato e mesma regra da `costura` de
# `incremental.yaml`: cada âncora (`de`) tem de casar EXATAMENTE uma vez no SQL da spec,
# e todo parâmetro declarado tem de aparecer no SQL costurado. Se a spec mudar embaixo
# disto, a costura recusa — ela nunca devolve o conjunto inteiro calada.
#
# `recorte` não entra no SQL: é o que a sonda (`npm run probe:ao-vivo`) usa para
# recortar a consulta ORIGINAL do mesmo jeito e comparar as duas, linha a linha.
#
# `janela` repete, do lado de cá, um trecho que mora no SQL da spec. O teste
# `backend/packages/ao-vivo/test/catalogo.test.ts` cobra que ele continue lá.

formato: 1

consultas:

  # A agenda no grão de horário. A view da Voalle calcula as janelas por atendimento
  # sobre `fsm_attendance_history` inteira e só depois filtra a data (piso de 4–6 s
  # mesmo para 7 dias). Aqui a view é aberta: os atendimentos são escolhidos ANTES,
  # pelos protocolos com horário no período, e cada protocolo entra com TODOS os seus
  # atendimentos — as partições das janelas ficam inteiras e o resultado é o mesmo da
  # view (conferido por hash de linha em 7 e 30 dias, 22/10/2026). O protocolo inteiro,
  # e não só o dia pedido, porque `RankDataProtocolo` conta os dias DELE na janela.
  field-agenda-slot:
    parametros: [desde, ate]
    janela: "AND vsdspi.begin_date_slot >= (CURRENT_DATE - INTERVAL '3 months')"
    recorte:
      tipo: protocolos-com-data-no-periodo
      protocolo: Protocolo
      data: Slot Agenda
    costura:
      # `&vista-da-agenda`: o mesmo texto entra na agregada `relatos-do-dia`, lá embaixo.
      - de: "FROM v_service_desk_slots_productivity_informative vsdspi\n"
        para: &vista-da-agenda |
          FROM (
              WITH protocolos_do_periodo AS (
                  SELECT DISTINCT ai.protocol
                    FROM service_desk_slots sds
                    JOIN assignment_incidents ai ON ai.assignment_id = sds.pre_reserved_assignment_id
                   WHERE sds.begin_date >= :desde::date
                     AND sds.begin_date <  :ate::date
                     AND sds.begin_date >= (CURRENT_DATE - INTERVAL '3 months')
              ),
              candidatos AS (
                  SELECT DISTINCT ai.assignment_id AS id
                    FROM assignment_incidents ai
                   WHERE ai.protocol IN (SELECT protocol FROM protocolos_do_periodo)
              ),
              fah AS (
                  SELECT h.* FROM fsm_attendance_history h
                   WHERE h.reserved_assignment_id IN (SELECT id FROM candidatos)
              )
              SELECT a.id AS assignment_id,
                     ai.protocol,
                     it.title AS incident_type_title,
                     a.final_date,
                     inc.title AS incident_status_title,
                     r.title AS region_title,
                     f.begin_date,
                     f.end_date,
                     f.rescheduling_type,
                     f.begin_date_slot,
                     f.first_attendance_history,
                     f.last_attendance_history,
                     p.name AS resource_name,
                     a.created AS assignment_created,
                     ( SELECT h2.begin_date
                         FROM fsm_attendance_history h2
                        WHERE h2.reserved_assignment_id = f.reserved_assignment_id
                          AND h2.identifier_attendance = f.identifier_attendance
                          AND h2.routing_status = ANY (ARRAY[6, 8])
                        ORDER BY h2.begin_date DESC
                        LIMIT 1) AS conclusion_date
                FROM ( SELECT fah.region_id,
                              fah.begin_date,
                              fah.end_date,
                              fah.identifier_attendance,
                              fah.rescheduling_type,
                              first_value(fah.begin_date_slot) OVER (PARTITION BY fah.reserved_assignment_id, fah.identifier_attendance ORDER BY fah.begin_date DESC) AS begin_date_slot,
                              fah.routing_status,
                              lag(fah.routing_status) OVER (PARTITION BY fah.reserved_assignment_id ORDER BY fah.begin_date, fah.routing_status) AS previous_routing_status,
                              min(fah.begin_date) OVER (PARTITION BY fah.reserved_assignment_id, fah.identifier_attendance ORDER BY fah.begin_date) AS first_attendance_history,
                              max(fah.end_date) OVER (PARTITION BY fah.reserved_assignment_id, fah.identifier_attendance ORDER BY fah.end_date DESC) AS last_attendance_history,
                              fah.resource_id,
                              fah.reserved_assignment_id
                         FROM fah
                         LEFT JOIN ( SELECT DISTINCT ON (ff.reserved_assignment_id, ff.identifier_attendance)
                                            ff.reserved_assignment_id, ff.identifier_attendance, ff.begin_date_slot
                                       FROM fah ff
                                      ORDER BY ff.reserved_assignment_id, ff.identifier_attendance, ff.begin_date DESC
                                   ) fah_begin_date_slot
                                ON fah_begin_date_slot.reserved_assignment_id = fah.reserved_assignment_id
                               AND fah_begin_date_slot.identifier_attendance = fah.identifier_attendance
                        WHERE fah.routing_status = ANY (ARRAY[0, 4, 6, 8])
                          AND EXISTS ( SELECT 1 FROM service_desk_slots sds
                                        WHERE sds.pre_reserved_assignment_id = fah.reserved_assignment_id
                                          AND sds.begin_date = fah_begin_date_slot.begin_date_slot)
                        GROUP BY fah.shift, fah.region_id, fah.routing_status, fah.reserved_date, fah.resource_id, fah.begin_date,
                                 fah.end_date, fah.identifier_attendance, fah.rescheduling_type, fah.begin_date_slot,
                                 fah.reserved_skills, fah.reserved_assignment_id, fah.activation_type
                     ) f
                JOIN assignments a ON a.id = f.reserved_assignment_id
                JOIN assignment_incidents ai ON a.id = ai.assignment_id
                JOIN regions r ON f.region_id = r.id
                JOIN incident_types it ON ai.incident_type_id = it.id
                JOIN incident_status inc ON ai.incident_status_id = inc.id
                LEFT JOIN people p ON f.resource_id = p.id
               WHERE f.routing_status <> f.previous_routing_status OR f.previous_routing_status IS NULL
          ) vsdspi

  # Os protocolos da agenda. O recorte é pelas SOLICITAÇÕES desses protocolos, e não
  # pelo protocolo: o `ROW_NUMBER` que escolhe a linha (`PERSONA1`) particiona por
  # `a.title`. Cortar por protocolo poderia tirar linhas do meio de uma partição e
  # mudar qual delas vence; pela solicitação, a partição entra inteira.
  protocolos-geral:
    parametros: [protocolos]
    recorte:
      tipo: protocolos-da-lista
      protocolo: "N°PROTOCOLO"
    costura:
      - de: "      AND a.created >= '2025-01-01'\n),\nPLANOS_CONTRATO AS ("
        para: "      AND a.created >= '2025-01-01'\n      AND a.title IN (\n          SELECT a2.title\n            FROM assignment_incidents ai2\n            JOIN assignments a2 ON a2.id = ai2.assignment_id\n           WHERE ai2.protocol = ANY(:protocolos::bigint[])\n      )\n),\nPLANOS_CONTRATO AS ("

  # As três dependências de M de `protocolos-geral` que pesam (gestores-equipes, do
  # MariaDB, leva ~2 s e fica inteira). Sem o recorte, elas rodavam inteiras a cada
  # pedido: troca-endereco 53 s e alocacao-patrimonio 19,6 s, medidos em 22/10/2026.
  # O executor costura uma dependência quando ela tem entrada aqui e o pedido traz
  # TODOS os parâmetros dela — o mesmo `protocolos` da query que a puxa.
  #
  # Cada recorte preserva a chave pela qual o M junta a dependência E a partição do
  # ROW_NUMBER dela, para a linha que casa ser a mesma da consulta inteira.

  # Junta por SOLICITACAO; sem ROW_NUMBER (uma linha por item de patrimônio). Recorte
  # pelas solicitações dos protocolos: todos os itens delas entram.
  alocacao-patrimonio:
    parametros: [protocolos]
    recorte:
      tipo: protocolos-da-lista
      protocolo: "N°PROTOCOLO"
    costura:
      - de: "AND plis.out_date >= '2025-01-01'"
        para: "AND plis.out_date >= '2025-01-01'\nAND a.title IN (\n    SELECT a2.title\n      FROM assignment_incidents ai2\n      JOIN assignments a2 ON a2.id = ai2.assignment_id\n     WHERE ai2.protocol = ANY(:protocolos::bigint[])\n)"

  # Junta por PROTOCOLO, e o ROW_NUMBER particiona por `ai.protocol`: o recorte pela
  # lista mantém cada partição inteira.
  troca-endereco:
    parametros: [protocolos]
    recorte:
      tipo: protocolos-da-lista
      protocolo: PROTOCOLO
    costura:
      - de: "        AND it.id in ('15', '1256')"
        para: "        AND it.id in ('15', '1256')\n        AND ai.protocol = ANY(:protocolos::bigint[])"

  # Junta pelo número do protocolo extraído de `r.tags` (o M compara como inteiro, ver
  # juncoes.yaml), e o ROW_NUMBER particiona por `r.tags`. O recorte usa a MESMA
  # extração, comparada como texto sem zeros à esquerda: o `::bigint` poderia estourar
  # numa tag com lixo de outro tipo de solicitação, porque o banco não promete avaliar
  # o filtro de RAUX antes. Toda linha de uma mesma tag tem os mesmos dígitos, então a
  # partição entra inteira.
  tecnicos-auxiliares:
    parametros: [protocolos]
    recorte:
      tipo: protocolos-da-lista
      protocolo: "PROTOCOLO:"
    costura:
      - de: "      and a.final_date >= DATE_TRUNC('year', CURRENT_DATE)"
        para: "      and a.final_date >= DATE_TRUNC('year', CURRENT_DATE)\n      and ltrim(NULLIF(regexp_replace(r.tags::text, '\\D', '', 'g'), ''), '0') = ANY(:protocolos::text[])"

# AGREGADAS — respostas que saem do banco JÁ CONTADAS, sem Power Query e sem passar
# linha a linha pela API. A costura é a mesma (âncora exata, parâmetro que aparece),
# e os `marcadores` (`{{nome}}`) são preenchidos por quem chama com SQL gerado do modelo.
agregadas:

  # Os dois contadores de `Status Protocolo Dia` que dependem do TEXTO dos relatos:
  # houve relato improdutivo, e houve relato de técnico (alguém com skill), por
  # (protocolo, dia do relato). É a parte da tabela que exigia a agenda no grão relato —
  # 220 mil linhas e ~3 min em 30 dias (22/10/2026) — e que daqui sai como algumas
  # centenas de linhas. A base é a `field-agenda` COMPLETA do catálogo: as junções com
  # relatos, pessoas e skills e os filtros ficam os dela; só muda o SELECT (contagens),
  # o FROM (a mesma view aberta da `field-agenda-slot`) e o ORDER BY (vira GROUP BY).
  #
  # `{{categoria_do_relato}}` é o `CategoriaProdutividade` do modelo, gerado das 38
  # regras de `ClassificacaoRelato` (backend/packages/ao-vivo/src/status-dia.ts).
  relatos-do-dia:
    base: field-agenda
    parametros: [desde, ate]
    janela: "AND vsdspi.begin_date_slot >= (CURRENT_DATE - INTERVAL '3 months')"
    marcadores: [categoria_do_relato]
    costura:
      - de: "SELECT \n    vsdspi.protocol AS \"Protocolo\",\n    vsdspi.incident_type_title AS \"Tipo de Protocolo\",\n    vsdspi.incident_status_title AS \"Status Protocolo\",\n    vsdspi.region_title AS \"Base\",\n    vsdspi.resource_name AS \"Instalador\",\n    vsdspi.assignment_created AS \"Data Criado\",\n    vsdspi.rescheduling_type AS \"Reagenda\",\n    vsdspi.conclusion_date AS \"Data finalizado atendimento app\",\n    vsdspi.first_attendance_history AS \"Data primeiro Play app\",\n    vsdspi.last_attendance_history AS \"Data ultimo play app\",\n    vsdspi.final_date AS \"Prazo SLA\",\n    vsdspi.begin_date AS \"Inicio relato\",\n    vsdspi.end_date AS \"Fim relato\",\n    vsdspi.begin_date_slot AS \"Slot Agenda\",\n    p.name as \"Relator\",\n    s.title as \"Skill\",\n    r.title AS \"Descrição\",\n    r.description AS \"Relato\",\n    r.beginning_date AS \"Data Relato\"\n"
        para: "SELECT\n    vsdspi.protocol::text AS \"Protocolo\",\n    to_char(r.beginning_date, 'YYYY-MM-DD') AS \"Dia Relato\",\n    COALESCE(bool_or(({{categoria_do_relato}}) = 'Improdutiva'), false) AS \"Improdutivo\",\n    COALESCE(bool_or(s.title IS NOT NULL), false) AS \"Tecnico\"\n"
      - de: "FROM v_service_desk_slots_productivity_informative vsdspi\n"
        para: *vista-da-agenda
      - de: "ORDER BY vsdspi.assignment_created DESC;"
        para: "GROUP BY 1, 2;"

# Outra costura para uma query que já tem entrada em `consultas` — quem a usa monta o
# catálogo do pedido com ela no lugar da entrada padrão (`query` diz de qual spec é).
variantes:
  # PROTOCOLOS GERAL do ano, para a Premiação e o Diário (docs/DECISAO-AO-VIVO.md, fase 3).
  # As duas páginas cortam a PG em DATA CRIADO >= início do ano (`corte-por-pagina.yaml`).
  # Aqui vêm as SOLICITAÇÕES com algum atendimento criado desde `desde` — superconjunto
  # do corte, com a partição do ROW_NUMBER (por `a.title`) inteira — e o recorte final é
  # o mesmo do corte, pela DATA CRIADO da linha que venceu.
  protocolos-geral-criados-desde:
    query: protocolos-geral
    parametros: [desde, ate]
    recorte:
      tipo: protocolos-com-data-no-periodo
      protocolo: "N°PROTOCOLO"
      data: "DATA CRIADO"
    costura:
      - de: "      AND a.created >= '2025-01-01'\n),\nPLANOS_CONTRATO AS ("
        para: "      AND a.created >= '2025-01-01'\n      AND a.title IN (\n          SELECT a2.title\n            FROM assignments a2\n           WHERE a2.created >= :desde::date\n             AND a2.created < :ate::date\n      )\n),\nPLANOS_CONTRATO AS ("
