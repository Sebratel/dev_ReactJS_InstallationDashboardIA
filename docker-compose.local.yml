# SOBREPOSIÇÃO LOCAL — NÃO É PRODUÇÃO, E O ARQUIVO EXISTE PARA DIZER ISSO.
#
# Por que existe. Desde 04/09/2026 a API RECUSA subir sem `GOOGLE_CLIENT_ID`
# (`backend/api/src/portao-login.ts`), e o `.env` desta máquina tem a variável
# vazia. Então `docker-compose.prod.yml` sozinho **não sobe aqui — de
# propósito**. Isso é a guarda funcionando, não um problema a contornar.
#
# ATUALIZAÇÃO, 16/09/2026: o `.env` desta máquina passou a ter
# `FIREBASE_PROJECT_ID` preenchida, e a guarda aceita qualquer um dos dois
# provedores. Ou seja, `docker-compose.prod.yml` SOZINHO agora sobe aqui, com
# login de verdade — e é assim que deve ser testado. Esta sobreposição continua
# valendo para o caso que a criou: rodar a stack de propósito SEM login.
#
# O contorno honesto é declarar as duas coisas ao mesmo tempo:
#   SEM_LOGIN=1        -> sim, eu quero servir sem autenticação
#   NODE_ENV=development -> e não, isto não é uma imagem de produção
#
# A guarda recusa a combinação `SEM_LOGIN=1` + `NODE_ENV=production` exatamente
# para que ninguém consiga desligar o login *fingindo* estar em produção. Este
# arquivo obedece à regra em vez de furá-la: paga o preço de admitir que é
# desenvolvimento.
#
# O QUE ESTA STACK SERVE SEM PEDIR NADA: CLIENTE, TELEFONE, endereço. Só use em
# máquina sua, e não publique a porta para a rede.
#
# Uso (a ordem dos -f importa; o último vence por chave):
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml logs -f api
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml down
#
# Se 3100 estiver ocupada no host (foi o caso: um `npm start` do próprio
# projeto), prefixe `API_PORT_HOST=3101`.
#
# CONFERIR QUE A GUARDA CONTINUA VIVA. Suba SEM este arquivo e o container tem
# de morrer com "[login] RECUSANDO SUBIR" no log:
#   docker compose -f docker-compose.prod.yml up api

services:
  # O proxy HTTPS é exclusivo da publicação. No desenvolvimento a API é
  # acessada diretamente em localhost:3101, sem exigir certificado local.
  web:
    profiles: ['producao']
  api:
    environment:
      SEM_LOGIN: '1'
      # Rebaixa o `production` declarado em docker-compose.prod.yml. Sem esta
      # linha a própria guarda recusa a stack — e está certa.
      NODE_ENV: development
      # O overlay assume explicitamente o risco da execução local. A stack de
      # produção continua com TLS e proxy obrigatórios.
      COOKIE_SECURE: '0'
      CONFIA_PROXY: '0'
      VOALLE_SSL: '0'
      VOALLE_SSL_REJECT_UNAUTHORIZED: '0'
      MARIA_SSL: '0'
      MARIA_SSL_REJECT_UNAUTHORIZED: '0'
  refresh:
    environment:
      VOALLE_SSL: '0'
      VOALLE_SSL_REJECT_UNAUTHORIZED: '0'
      MARIA_SSL: '0'
