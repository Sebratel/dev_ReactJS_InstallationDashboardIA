# Roda em todo push e pull request. Três coisas que nada conferia sozinho:
#   1. tipos — o Node executa .ts só apagando as anotações (`npm run typecheck`);
#   2. a suíte — até aqui dependia de alguém lembrar de rodar `npm test`;
#   3. as imagens Docker — a `api` subiu a imagem do cron por duas semanas sem
#      ninguém ver, porque nenhum passo construía a imagem (ACHADOS #153).
# Não toca banco nem Power BI: sem `.env`, sem `snapshot/`, sem segredo nenhum.
name: ci

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  imagens:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # O compose exige o arquivo do `env_file`; vazio basta para construir.
      - run: touch .env
      # Construir PELO COMPOSE, não com `--target` na mão: o defeito de 25/09 era o
      # compose não declarar o `target`, e um build manual o esconderia.
      - name: constrói as imagens como o compose constrói
        # O compose exige estas duas só para interpolar o arquivo; o build não usa nenhuma.
        env:
          REDIS_PASSWORD: so-para-o-build
          GOOGLE_CREDENCIAL_HOST: /dev/null
        run: docker compose -p ci -f docker-compose.prod.yml build api refresh snapshot-diario
      - name: cada serviço recebeu a imagem certa
        run: sh backend/tools/ci/confere-imagens.sh
