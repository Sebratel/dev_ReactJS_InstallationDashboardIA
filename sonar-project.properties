sonar.projectKey=installation-dashboard-ia
sonar.projectName=Installation Dashboard IA
sonar.sourceEncoding=UTF-8

# Diretórios de código-fonte e testes
sonar.sources=frontend/src,backend
sonar.tests=frontend/test,backend

# Incluir apenas arquivos de teste na análise de testes
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.e2e.ts

# Exclusões da análise de código-fonte
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,snapshot/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.e2e.ts,backend/**/test/**,backend/**/e2e/**

# Exclusões de duplicação e cobertura
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.e2e.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.e2e.ts,**/*.d.ts
