# Referência para `PUBLICACAO: proxy-https` — NÃO é usada pela stack de hoje. Desde
# 19/10/2026 a porta da API é publicada direto, sem proxy (docs/PORTAINER.md). Se um
# dia houver proxy HTTPS na frente, este é o contrato que ele tem de cumprir, com os
# caminhos reais do certificado.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Troque pelos caminhos do certificado administrado pela Sebratel. Não
    # publique um bloco HTTP alternativo: a API só aceita produção com cookie Secure.
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Teto pequeno de propósito, coerente com o corpo de 8 KB que a própria
    # API já recusa passar disso (`backend/api/src/servidor.ts`, `leCorpo`) —
    # aqui é defesa em profundidade, para um corpo grande nem chegar ao
    # processo Node. E o teto de header, para um pedido com cabeçalho gigante
    # não segurar buffer do Nginx à toa.
    client_max_body_size 64k;
    large_client_header_buffers 4 8k;

    # Sem a versão do Nginx no cabeçalho `Server` nem nas páginas de erro.
    server_tokens off;

    # O endereço do frontend é resolvido A CADA PEDIDO pelo DNS do Docker, e não uma vez na
    # subida. Com `proxy_pass http://web:8080` literal, o Nginx guardava o IP do
    # contêiner da hora em que subiu; recriar o frontend (deploy, Portainer) dava outro IP e
    # a tela inteira ficava em 502 até alguém reiniciar o proxy. Medido em 02/10/2026:
    # proxy em 172.18.0.4, API recriada em 172.18.0.3, 502 até um `nginx -s reload`.
    # `proxy_pass $web` sem caminho repassa a URI original, igual ao literal de antes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web http://web:8080;

    # O serviço `web` serve a tela e encaminha as rotas dinâmicas para a API
    # privada na rede Docker.
    location / {
        proxy_pass $web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Aquecedor-Interno "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O SSE do poller de quase-realtime. ESTE BLOCO NÃO É OPCIONAL.
    #
    # Ele estava comentado aqui, com a justificativa "se o SSE algum dia voltar
    # (hoje não existe)". Conferido em 04/09/2026: **existe dos dois lados** —
    # `backend/api/src/servidor.ts:539` responde `content-type: text/event-stream`
    # em `GET /api/eventos`, e `frontend/src/App.tsx:153` abre
    # `new EventSource('/api/eventos')`. Sem as quatro linhas abaixo, o Nginx
    # segura o stream no buffer e **nenhum evento chega, sem erro e sem log** —
    # o comentário antigo descrevia certo o defeito que ele mesmo causava.
    #
    # Prefixo mais longo vence em Nginx, então este bloco ganha de `/api/`
    # independente da ordem; fica antes por leitura.
    location /api/eventos {
        proxy_pass $web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Aquecedor-Interno "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        chunked_transfer_encoding off;

        # Conexão de SSE fica aberta de propósito; o teto do `/api/` mataria o
        # stream a cada 90 s e o navegador reconectaria em loop.
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Aquecedor-Interno "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O padrão do Nginx (60s) corta `agendamento-field` na abertura fria
        # (~1 min de cálculo) e devolve 504 exatamente na página mais lenta do
        # relatório. Medido, não estimado — docs/DEPLOY.md §3.3.
        proxy_read_timeout 90s;
    }

    # S3 (docs/PLANO-SEGURANCA.md): `/auth/interno` abre uma sessão de máquina que vê
    # todas as abas. Não sai pela porta pública — quem a usa (`npm run tela`, e2e, régua)
    # fala direto com 127.0.0.1:3100. Regex, e não `location =`: a api ignora a barra
    # final, e `= /auth/interno` deixaria `/auth/interno/` passar. `~*` cobre maiúscula.
    location ~* ^/auth/+interno/*$ {
        return 404;
    }

    # Login (Google SSO): as duas únicas rotas que escrevem estado (sessão) em
    # vez de servir dado calculado — de propósito fora de /api/.
    location /auth/ {
        proxy_pass $web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Aquecedor-Interno "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
