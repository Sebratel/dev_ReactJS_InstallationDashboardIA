# Proxy reverso para produção (docs/DEPLOY.md §3.3). Monta como
# /etc/nginx/conf.d/default.conf no serviço `proxy` de docker-compose.prod.yml.
#
# TLS fica de fora deste arquivo por decisão já registrada — é infraestrutura,
# não código do repositório (Let's Encrypt se o host for alcançável de fora;
# certificado da Sebratel para rede interna). Adicione o bloco `listen 443 ssl`
# quando o certificado existir; até lá isto serve só HTTP.

server {
    listen 80;
    server_name _;

    # A API serve a tela (build estático) E o JSON na mesma porta — não há
    # container de tela separado (docs/DEPLOY.md §3.2).
    location / {
        proxy_pass http://api:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O padrão do Nginx (60s) corta `agendamento-field` na abertura fria
        # (~1 min de cálculo) e devolve 504 exatamente na página mais lenta do
        # relatório. Medido, não estimado — docs/DEPLOY.md §3.3.
        proxy_read_timeout 90s;
    }

    # Login (Google SSO): as duas únicas rotas que escrevem estado (sessão) em
    # vez de servir dado calculado — de propósito fora de /api/.
    location /auth/ {
        proxy_pass http://api:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Se o SSE algum dia voltar (hoje não existe — DECISAO-REALTIME.md), este
    # location precisa de 4 linhas a mais, ou o proxy segura o
    # text/event-stream no buffer e nenhum evento chega, sem erro e sem log:
    #
    # location /api/eventos {
    #     proxy_pass http://api:3100;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection '';
    #     proxy_buffering off;
    #     chunked_transfer_encoding off;
    # }
}
