server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 64k;
    large_client_header_buffers 4 8k;

    # Compressão (20/10/2026): no staging nada saía comprimido — nem o bundle (440 KB),
    # nem o JSON das páginas e dos filtros, que é o grosso do tráfego. `text/event-stream`
    # fica de fora de propósito: gzip segura o evento no buffer e o tempo real atrasa.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;

    # O navegador chega pelo proxy HTTPS (openresty/NPM) e não direto: sem isto o
    # `$remote_addr` é o IP do proxy, e o rate limit da API (`CONFIA_PROXY=1`) vira um
    # balde único para a empresa inteira. O proxy escreve o IP real em `X-Real-IP`.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3100;

    location ~* ^/auth/+interno/*$ {
        return 404;
    }

    location /api/eventos {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90s;
    }

    location /auth/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # O Vite põe o hash do conteúdo no nome: o arquivo nunca muda, pode ficar em cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
